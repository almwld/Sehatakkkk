name: apply-routing-fix
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply routing architecture fix
        shell: python
        run: |
          from pathlib import Path
          import re
          
          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p, s): Path(p).write_text(s, encoding='utf-8')
          def replace_once(s, old, new, label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return s.replace(old,new)
          
          cache_path=Path('lib/core/services/user_role_cache.dart')
          if not cache_path.exists():
              write(cache_path, '''import 'package:cloud_firestore/cloud_firestore.dart';
import 'package:firebase_auth/firebase_auth.dart';
import 'package:flutter/foundation.dart';
import 'package:shared_preferences/shared_preferences.dart';

class UserRoleCache extends ChangeNotifier {
  UserRoleCache._();

  static final UserRoleCache instance = UserRoleCache._();

  static const _roleKey = 'user_role';
  static const _uidKey = 'user_role_uid';

  String _role = 'user';
  String? _uid;
  bool _loaded = false;

  String get currentRole => _role;
  bool get isAdmin => _role == 'admin' || _role == 'superAdmin';
  bool get isLoaded => _loaded;

  bool isReadyFor(String uid) => _loaded && _uid == uid;

  Future<void> load() async {
    final prefs = await SharedPreferences.getInstance();
    _role = prefs.getString(_roleKey) ?? 'user';
    _uid = prefs.getString(_uidKey);

    final user = FirebaseAuth.instance.currentUser;
    if (user != null) {
      try {
        final doc = await FirebaseFirestore.instance
            .collection('users')
            .doc(user.uid)
            .get()
            .timeout(const Duration(seconds: 3));
        _role = doc.data()?['role']?.toString() ?? 'user';
        _uid = user.uid;
        await prefs.setString(_roleKey, _role);
        await prefs.setString(_uidKey, user.uid);
      } catch (_) {
        if (_uid != user.uid) {
          _role = 'user';
          _uid = user.uid;
        }
      }
    }

    _loaded = true;
  }

  Future<void> setRole(String role, {String? uid, bool persist = true}) async {
    _role = role.isEmpty ? 'user' : role;
    _uid = uid ?? _uid;
    _loaded = true;

    if (persist) {
      final prefs = await SharedPreferences.getInstance();
      await prefs.setString(_roleKey, _role);
      if (_uid == null || _uid!.isEmpty) {
        await prefs.remove(_uidKey);
      } else {
        await prefs.setString(_uidKey, _uid!);
      }
    }

    notifyListeners();
  }

  Future<void> clear() async {
    _role = 'user';
    _uid = null;
    _loaded = true;
    final prefs = await SharedPreferences.getInstance();
    await prefs.remove(_roleKey);
    await prefs.remove(_uidKey);
    notifyListeners();
  }
}
''')
          
