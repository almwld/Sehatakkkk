      if (!roleReady) return null;

      if (loc == auth || loc == splash) {
        return isAdmin ? dashboard : home;
      }

      if (isAdmin && loc == home) return dashboard;
      if (!isAdmin && loc == dashboard) return home;

      return null;
    },
