name: One-time Family Care Fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix-family-care:
    if: github.event.head_commit.message != 'fix(more): add dental and eye care to family care'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch family care services
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('lib/presentation/screens/more/more_screen.dart'); s=p.read_text(); marker=\"import 'package:sehatak/core/services/toast_service.dart';\\n\"; imports=\"import 'package:sehatak/presentation/screens/dental_care/dental_care_screen.dart';\\nimport 'package:sehatak/presentation/screens/eye_care/eye_care_screen.dart';\\n\"; s=s if 'dental_care/dental_care_screen.dart' in s else s.replace(marker, marker+imports); old=\"          {'icon': 'assets/images/tracking/vaccination.png', 'title': 'التطعيمات', 'subtitle': 'جدول التطعيمات', 'screen': const VaccinationScreen()},\\n\"; new=old+\"          {'icon': 'assets/icons/services/dentistry.png', 'title': 'صحة الأسنان', 'subtitle': 'العناية بالأسنان والفم', 'screen': const DentalCareScreen()},\\n          {'icon': 'assets/icons/services/ophthalmology.png', 'title': 'صحة العيون', 'subtitle': 'العناية بالعين وفحص النظر', 'screen': const EyeCareScreen()},\\n\"; s=s if \"'title': 'صحة الأسنان'\" in s else s.replace(old,new,1); p.write_text(s)"
          git diff --check
          git diff -- lib/presentation/screens/more/more_screen.dart
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/presentation/screens/more/more_screen.dart
          git commit -m 'fix(more): add dental and eye care to family care'
          git push origin HEAD:master
