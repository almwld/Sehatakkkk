name: Fix Patient Screen Icon Colors

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Restore original PNG colors and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/presentation/screens/patient/patient_dashboard.dart')
          s = p.read_text(encoding='utf-8')
          old = '''  Widget _buildIcon(String path, {double size = 40, Color? color}) {
    return Image.asset(
      path,
      width: size,
      height: size,
      fit: BoxFit.contain,
      color: color,
      errorBuilder: (context, error, stackTrace) {
        return Icon(Icons.health_and_safety, color: color, size: size);
      },
    );
  }'''
          new = '''  Widget _buildIcon(String path, {double size = 40, Color? color}) {
    return Image.asset(
      path,
      width: size,
      height: size,
      fit: BoxFit.contain,
      errorBuilder: (context, error, stackTrace) {
        return Icon(Icons.health_and_safety, color: color, size: size);
      },
    );
  }'''
          if old not in s:
              raise SystemExit('Expected _buildIcon block was not found; refusing unrelated edits.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-patient-icon-colors.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/presentation/screens/patient/patient_dashboard.dart .github/workflows/fix-patient-icon-colors.yml
          git diff --cached --check
          git commit -m "fix(patient): preserve original icon colors"
          git push
