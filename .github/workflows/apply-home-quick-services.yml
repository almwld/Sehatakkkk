name: Apply home quick-services icon-only UI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace quick services section
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lib/presentation/screens/home/tabs/home_tab.dart')
          text = path.read_text(encoding='utf-8')

          start = text.find('  Widget _quickServices(bool dark) {')
          end = text.find('\n  Widget _healthSummary', start)
          if start < 0 or end < 0:
              raise SystemExit('Target quick-services function was not found')

          replacement = r'''  Widget _quickServices(bool dark) {
    const items = <Map<String, dynamic>>[
      {
        'icon': 'assets/images/services/pharmacy.png',
        'name': 'صيدلية',
        'route': AppRouter.pharmacy,
      },
      {
        'icon': 'assets/images/services/emergency.png',
        'name': 'طوارئ',
        'route': AppRouter.emergency,
      },
      {
        'icon': 'assets/images/services/medical_community.png',
        'name': 'خدمات منزلية',
        'route': AppRouter.services,
      },
      {
        'icon': 'assets/images/services/blood_donation.png',
        'name': 'تبرع بالدم',
        'route': AppRouter.services,
      },
      {
        'icon': 'assets/images/services/consultation.png',
        'name': 'أطباء',
        'route': AppRouter.doctors,
      },
      {
        'icon': 'assets/images/services/laboratory.png',
        'name': 'مختبرات',
        'route': AppRouter.labs,
      },
      {
        'icon': 'assets/images/services/health_tips.png',
        'name': 'صحة',
        'route': AppRouter.dashboard,
      },
      {
        'icon': 'assets/images/services/wallet.png',
        'name': 'محفظة',
        'route': AppRouter.wallet,
      },
      {
        'icon': 'assets/images/services/consultation.png',
        'name': 'استشارة',
        'route': AppRouter.consultation,
      },
      {
        'icon': 'assets/images/services/map_location.png',
        'name': 'بالقرب منك',
        'route': AppRouter.map,
      },
    ];

    return _section(
      title: 'الخدمات السريعة',
      dark: dark,
      child: SizedBox(
        height: 80,
        child: ListView.builder(
          scrollDirection: Axis.horizontal,
          padding: const EdgeInsets.symmetric(horizontal: 8),
          itemCount: items.length,
          itemBuilder: (_, index) {
            final item = items[index];
            return SizedBox(
              width: 60,
              child: Padding(
                padding: const EdgeInsets.symmetric(horizontal: 4),
                child: Tooltip(
                  message: item['name'] as String,
                  preferBelow: false,
                  child: InkWell(
                    onTap: () => _go(item['route'] as String),
                    borderRadius: BorderRadius.circular(12),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        SizedBox(
                          width: 44,
                          height: 44,
                          child: Image.asset(
                            item['icon'] as String,
                            width: 44,
                            height: 44,
                            fit: BoxFit.contain,
                            errorBuilder: (_, __, ___) => Icon(
                              Icons.medical_services_outlined,
                              color: dark ? Colors.white70 : AppColors.primary,
                              size: 32,
                            ),
                          ),
                        ),
                        const SizedBox(height: 4),
                        Text(
                          item['name'] as String,
                          textAlign: TextAlign.center,
                          maxLines: 2,
                          overflow: TextOverflow.ellipsis,
                          style: TextStyle(
                            fontSize: 10,
                            fontWeight: FontWeight.w600,
                            color: dark ? Colors.white70 : _text,
                            height: 1.1,
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              ),
            );
          },
        ),
      ),
    );
  }
'''

          updated = text[:start] + replacement + text[end:]
          if updated == text:
              raise SystemExit('No change was made')
          path.write_text(updated, encoding='utf-8')

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/screens/home/tabs/home_tab.dart
          if git diff --cached --quiet; then
            echo "Quick-services UI is already applied."
            exit 0
          fi
          git commit -m "feat: make home quick services icon-only"
          git push origin HEAD:master
