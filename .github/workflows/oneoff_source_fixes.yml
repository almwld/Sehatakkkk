name: oneoff-source-fixes
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[oneoff-fixes-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def rw(path, fn):
              p=Path(path); s=p.read_text(encoding='utf-8'); p.write_text(fn(s), encoding='utf-8')
          rw('lib/presentation/screens/delivery/delivery_tracking_screen.dart', lambda s: s.replace('primaryColor','AppColors.primary'))
          def hospital(s):
              imp="import 'package:sehatak/core/models/ad_model.dart';\n"
              return s if imp in s else s.replace("import 'package:sehatak/core/constants/app_colors.dart';\n", "import 'package:sehatak/core/constants/app_colors.dart';\n"+imp)
          rw('lib/presentation/screens/hospital/dashboard/hospital_dashboard.dart', hospital)
          rw('lib/presentation/screens/home/home_screen_backup.dart', lambda s: re.sub(r"\n\s*isBottomBarVisible: ValueNotifier<bool>\(_isBottomBarVisible\),", '', s))
          rw('lib/presentation/screens/lab/test_booking_screen.dart', lambda s: s.replace("                titleTextStyle: TextStyle(color: isDark ? Colors.white : Colors.black87),\n", '').replace("                subtitleTextStyle: TextStyle(color: isDark ? Colors.grey[400] : Colors.grey[600]),\n", ''))
          def advanced(s):
              pat=r"DoctorDetailsScreen\(\s*doctor:\s*DoctorModel\(\s*id:\s*item\['id'\]\?\.toString\(\) \?\? '1',\s*name:\s*item\['name'\]\?\.toString\(\) \?\? 'طبيب',\s*specialty:\s*item\['specialty'\]\?\.toString\(\) \?\?\s*item\['category'\]\?\.toString\(\) \?\?\s*'طبيب عام',\s*\),\s*\)"
              return re.sub(pat, "DoctorDetailsScreen(doctorId: item['id']?.toString() ?? '1')", s, flags=re.S)
          rw('lib/presentation/screens/search/advanced_search_screen.dart', advanced)
          def shared(s):
              pat=r"DoctorDetailsScreen\(\s*doctor:\s*DoctorModel\(\s*id:\s*result\['id'\]\?\.toString\(\) \?\? '',\s*name:\s*result\['name'\]\?\.toString\(\) \?\? 'طبيب',\s*specialty:\s*result\['specialty'\]\?\.toString\(\) \?\? 'طبيب عام',\s*\),\s*\)"
              return re.sub(pat, "DoctorDetailsScreen(doctorId: result['id']?.toString() ?? '')", s, flags=re.S)
          rw('lib/presentation/screens/shared/search_screen.dart', shared)
          rw('lib/presentation/screens/step_tracker/step_tracker_screen.dart', lambda s: s.replace('final maxY = maxValue <= 0 ? 1000 : maxValue * 1.2;', 'final maxY = maxValue <= 0 ? 1000.0 : maxValue * 1.2;'))
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/screens/delivery/delivery_tracking_screen.dart lib/presentation/screens/hospital/dashboard/hospital_dashboard.dart lib/presentation/screens/home/home_screen_backup.dart lib/presentation/screens/lab/test_booking_screen.dart lib/presentation/screens/search/advanced_search_screen.dart lib/presentation/screens/shared/search_screen.dart lib/presentation/screens/step_tracker/step_tracker_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix: resolve targeted analyzer errors [oneoff-fixes-applied]"
          git push
