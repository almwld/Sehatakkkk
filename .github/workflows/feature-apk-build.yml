name: 🚀 Feature APK Build

on:
  push:
    branches:
      - feat/complete-sehatak-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sehatak-feature-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: 🔑 Prepare Firebase Android config
        run: |
          cat > android/app/google-services.json <<'JSONEOF'
          {
            "project_info": {
              "project_number": "1053269106596",
              "project_id": "sehatak-platform",
              "storage_bucket": "sehatak-platform.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1053269106596:android:de2128024cd023a973ab31",
                  "android_client_info": {
                    "package_name": "com.sehatak.app"
                  }
                },
                "oauth_client": [],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSONEOF

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔨 Build APK
        run: flutter build apk --release --split-per-abi --no-shrink

      - name: 📤 Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sehatak-feature-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: ✅ Build finished
        run: echo "Sehatak APK build completed"
