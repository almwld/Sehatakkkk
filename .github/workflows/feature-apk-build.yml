name: 🚀 Sehatak Production APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sehatak-production-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 💙 Flutter 3.16.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: 🔧 Repair only compiler-reported nullable chat errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/presentation/screens/chat/chat_room_screen.dart')
          text = path.read_text(encoding='utf-8')

          text, n1 = re.subn(
              r'(\b_messages\[i\]\s*\.text)\s*\.toLowerCase\(\)',
              r"(\1 ?? '').toLowerCase()",
              text,
              count=1,
          )

          n2 = text.count('_textController.text = message.text;')
          if n1 != 1:
              raise SystemExit(f'Expected exactly one search nullability repair, got {n1}')
          if n2 != 1:
              raise SystemExit(f'Expected exactly one edit-message nullability repair, got {n2}')

          text = text.replace(
              '_textController.text = message.text;',
              "_textController.text = message.text ?? '';",
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: 💾 Persist compiler repairs
        run: |
          if git diff --quiet -- lib/presentation/screens/chat/chat_room_screen.dart; then
            echo "No compiler repair needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/presentation/screens/chat/chat_room_screen.dart
            git commit -m "fix(chat): repair nullable message text compiler errors [skip ci]"
            git push origin HEAD:master
          fi

      - name: 🔑 Prepare Firebase Android config
        run: |
          cat > android/app/google-services.json <<'JSONEOF'
          {
            "project_info": {
              "project_number": "1053269106596",
              "project_id": "sehatak-platform",
              "storage_bucket": "sehatak-platform.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1053269106596:android:de2128024cd023a973ab31",
                  "android_client_info": {
                    "package_name": "com.sehatak.app"
                  }
                },
                "oauth_client": [],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSONEOF

      - name: 📦 Install dependencies
        run: flutter pub get

      # No flutter analyze: the production release compiler is the build gate.
      - name: 🔨 Build split release APKs
        run: flutter build apk --release --split-per-abi --no-shrink

      - name: 🔎 Verify APK outputs
        run: |
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -f build/app/outputs/flutter-apk/app-x86_64-release.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: 📦 Package APKs separately
        run: |
          mkdir -p dist
          cd build/app/outputs/flutter-apk
          zip -j "$GITHUB_WORKSPACE/dist/sehatak-arm64-v8a.zip" app-arm64-v8a-release.apk
          zip -j "$GITHUB_WORKSPACE/dist/sehatak-armeabi-v7a.zip" app-armeabi-v7a-release.apk
          zip -j "$GITHUB_WORKSPACE/dist/sehatak-x86_64.zip" app-x86_64-release.apk
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: 📤 Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: sehatak-arm64-v8a
          path: dist/sehatak-arm64-v8a.zip
          retention-days: 30

      - name: 📤 Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: sehatak-armeabi-v7a
          path: dist/sehatak-armeabi-v7a.zip
          retention-days: 30

      - name: 📤 Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: sehatak-x86_64
          path: dist/sehatak-x86_64.zip
          retention-days: 30

      - name: ✅ Production build complete
        run: echo "Sehatak split APK build and packaging completed successfully"
