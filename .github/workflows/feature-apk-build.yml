name: 🚀 Feature APK Build

on:
  push:
    branches:
      - feat/complete-sehatak-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sehatak-feature-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: 🔧 Repair source integration before build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          chat = Path('lib/presentation/screens/chat/chat_room_screen.dart')
          text = chat.read_text(encoding='utf-8')
          lines = text.splitlines()
          if lines and lines[0].startswith('cat > lib/presentation/screens/chat/chat_room_screen.dart'):
              lines = lines[1:]
          if lines and lines[-1].strip() == 'CHATROOMEOF':
              lines = lines[:-1]
          text = '\n'.join(lines) + '\n'
          text = text.replace("_messages[i].text.toLowerCase()", "(_messages[i].text ?? '').toLowerCase()")
          text = text.replace('_textController.text = message.text;', "_textController.text = message.text ?? '';")
          text = text.replace('message.timestamp!,\n                        messages[index - 1].timestamp!,', 'message.timestamp!.toDate(),\n                        messages[index - 1].timestamp!.toDate(),')
          text = text.replace('_buildDateDivider(message.timestamp, isDark)', '_buildDateDivider(message.timestamp?.toDate(), isDark)')
          text = text.replace('onTap: _sendImage,', 'onTap: () => _sendImage(null),')
          text = text.replace("      body: _isBlockedByUser\n          ? _buildBlockedScreen(isDark)\n          : _buildMainScreen(isDark),", "      body: ChatBackground(\n        child: _isBlockedByUser\n            ? _buildBlockedScreen(isDark)\n            : _buildMainScreen(isDark),\n      ),")
          text = text.replace('        _buildBackground(isDark),', '        const SizedBox.shrink(),')
          chat.write_text(text, encoding='utf-8')

          call = Path('lib/presentation/screens/call/call_screen.dart')
          c = call.read_text(encoding='utf-8')
          c = c.replace("  final String chatId;\n", "  final String chatId;\n  final String? callId;\n", 1)
          c = c.replace("    required this.chatId,\n", "    required this.chatId,\n    this.callId,\n", 1)
          call.write_text(c, encoding='utf-8')
          PY

      - name: 🔎 Validate repaired Dart sources
        run: |
          ! grep -q "^cat > lib/presentation/screens/chat/chat_room_screen.dart" lib/presentation/screens/chat/chat_room_screen.dart
          ! grep -q "^CHATROOMEOF$" lib/presentation/screens/chat/chat_room_screen.dart
          grep -q "sehatak_chat_wallpaper_light.svg" lib/presentation/screens/chat/widgets/chat_background.dart
          grep -q "sehatak_chat_wallpaper_dark.svg" lib/presentation/screens/chat/widgets/chat_background.dart

      - name: 🔑 Prepare Firebase Android config
        run: |
          cat > android/app/google-services.json <<'JSONEOF'
          {
            "project_info": {
              "project_number": "1053269106596",
              "project_id": "sehatak-platform",
              "storage_bucket": "sehatak-platform.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1053269106596:android:de2128024cd023a973ab31",
                  "android_client_info": {
                    "package_name": "com.sehatak.app"
                  }
                },
                "oauth_client": [],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSONEOF

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔨 Build split APKs
        run: flutter build apk --release --split-per-abi --no-shrink

      - name: 🔎 Verify split APK outputs
        run: |
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -f build/app/outputs/flutter-apk/app-x86_64-release.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: 📦 Package APKs separately
        run: |
          mkdir -p dist
          cd build/app/outputs/flutter-apk
          zip -j "$GITHUB_WORKSPACE/dist/sehatak-arm64-v8a.zip" app-arm64-v8a-release.apk
          zip -j "$GITHUB_WORKSPACE/dist/sehatak-armeabi-v7a.zip" app-armeabi-v7a-release.apk
          zip -j "$GITHUB_WORKSPACE/dist/sehatak-x86_64.zip" app-x86_64-release.apk
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: 📤 Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: sehatak-arm64-v8a
          path: dist/sehatak-arm64-v8a.zip
          retention-days: 30

      - name: 📤 Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: sehatak-armeabi-v7a
          path: dist/sehatak-armeabi-v7a.zip
          retention-days: 30

      - name: 📤 Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: sehatak-x86_64
          path: dist/sehatak-x86_64.zip
          retention-days: 30

      - name: ✅ Build finished
        run: echo "Sehatak split APK build and packaging completed"
