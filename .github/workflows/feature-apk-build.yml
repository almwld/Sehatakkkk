name: 🚀 Sehatak Production APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sehatak-production-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: ☕ Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 💙 Flutter 3.16.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true
      - name: 🔑 Prepare Firebase Android config
        run: |
          cat > android/app/google-services.json <<'JSONEOF'
          {
            "project_info": {
              "project_number": "1053269106596",
              "project_id": "sehatak-platform",
              "storage_bucket": "sehatak-platform.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1053269106596:android:de2128024cd023a973ab31",
                  "android_client_info": {"package_name": "com.sehatak.app"}
                },
                "oauth_client": [],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          JSONEOF
      - name: 📦 Install dependencies
        run: flutter pub get
      - name: 🔍 Static analysis
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
      - name: 📋 Upload analyzer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sehatak-analyzer-log
          path: analyze.log
          if-no-files-found: ignore
      - name: 🔨 Build split release APKs
        run: flutter build apk --release --split-per-abi --no-shrink
      - name: 🔎 Verify APK outputs
        run: |
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -f build/app/outputs/flutter-apk/app-x86_64-release.apk
          ls -lh build/app/outputs/flutter-apk/
      - name: 📦 Package APKs separately
        run: |
          mkdir -p dist
          cd build/app/outputs/flutter-apk
          zip -j "$GITHUB_WORKSPACE/dist/sehatak-arm64-v8a.zip" app-arm64-v8a-release.apk
          zip -j "$GITHUB_WORKSPACE/dist/sehatak-armeabi-v7a.zip" app-armeabi-v7a-release.apk
          zip -j "$GITHUB_WORKSPACE/dist/sehatak-x86_64.zip" app-x86_64-release.apk
      - name: 📤 Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: sehatak-arm64-v8a
          path: dist/sehatak-arm64-v8a.zip
          retention-days: 30
      - name: 📤 Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: sehatak-armeabi-v7a
          path: dist/sehatak-armeabi-v7a.zip
          retention-days: 30
      - name: 📤 Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: sehatak-x86_64
          path: dist/sehatak-x86_64.zip
          retention-days: 30
      - name: ✅ Production build complete
        run: echo "Sehatak split APK build and packaging completed successfully"
