name: Fix chat and syntax blockers
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: repair chat and syntax blockers')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair files
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          # chat_room_screen.dart: keep exactly one _setTyping method.
          p = root / 'lib/presentation/screens/chat/chat_room_screen.dart'
          s = p.read_text(encoding='utf-8')
          marker = '  Future<void> _setTyping(bool typing) async {'
          starts = [m.start() for m in re.finditer(re.escape(marker), s)]
          if len(starts) > 1:
              # Locate the matching closing brace for each method, ignoring braces in strings.
              ranges = []
              for start in starts:
                  open_brace = s.find('{', start)
                  depth = 0
                  quote = None
                  escape = False
                  end = None
                  i = open_brace
                  while i < len(s):
                      ch = s[i]
                      if quote:
                          if escape:
                              escape = False
                          elif ch == '\\':
                              escape = True
                          elif ch == quote:
                              quote = None
                      else:
                          if ch in "'\"":
                              quote = ch
                          elif ch == '{':
                              depth += 1
                          elif ch == '}':
                              depth -= 1
                              if depth == 0:
                                  end = i + 1
                                  break
                      i += 1
                  if end is None:
                      raise RuntimeError('Could not parse _setTyping')
                  ranges.append((start, end))
              for start, end in reversed(ranges[1:]):
                  e = end
                  if e < len(s) and s[e:e+2] == '\r\n': e += 2
                  elif e < len(s) and s[e] == '\n': e += 1
                  s = s[:start] + s[e:]
          p.write_text(s, encoding='utf-8')

          # home_tab.dart: replace malformed weather/community block with balanced Dart.
          p = root / 'lib/presentation/screens/home/tabs/home_tab.dart'
          s = p.read_text(encoding='utf-8')
          start = s.find('  Widget _weather(bool dark)')
          end = s.find('  Widget _error(String text, bool dark)', start)
          if start >= 0 and end > start:
              replacement = '''  Widget _weather(bool dark) {
    return _section(
      title: 'الطقس',
      dark: dark,
      child: FutureBuilder<Map<String, dynamic>>(
        future: _weatherFuture,
        builder: (_, snapshot) {
          if (snapshot.connectionState == ConnectionState.waiting) {
            return const SizedBox(
              height: 96,
              child: Center(child: CircularProgressIndicator(strokeWidth: 2)),
            );
          }
          final data = snapshot.data ?? const <String, dynamic>{};
          final temp = data['temp']?.toString();
          final condition = data['condition']?.toString();
          if (temp == null || temp.isEmpty || condition == null || condition.isEmpty) {
            return _empty('تعذر الحصول على بيانات الطقس حالياً', dark);
          }
          return Padding(
            padding: const EdgeInsets.symmetric(horizontal: 16),
            child: Container(
              height: 96,
              padding: const EdgeInsets.symmetric(horizontal: 18),
              decoration: BoxDecoration(
                color: dark ? _darkCard : Colors.white,
                borderRadius: BorderRadius.circular(18),
              ),
              child: Row(
                children: [
                  const Icon(Icons.wb_sunny_outlined, color: AppColors.primary, size: 38),
                  const SizedBox(width: 14),
                  Expanded(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text('صنعاء', style: TextStyle(fontSize: 13, fontWeight: FontWeight.w900, color: dark ? Colors.white : _text)),
                        const SizedBox(height: 4),
                        Text(condition, style: TextStyle(fontSize: 11, color: dark ? Colors.white70 : _muted)),
                      ],
                    ),
                  ),
                  Text('$temp°', style: TextStyle(fontSize: 28, fontWeight: FontWeight.w900, color: dark ? Colors.white : _text)),
                ],
              ),
            ),
          );
        },
      ),
    );
  }

  Widget _community(List<dynamic> items, bool dark) {
    if (items.isEmpty) {
      return _section(title: 'المجتمع', dark: dark, child: _empty('لا توجد منشورات منشورة حالياً', dark));
    }
    final posts = items.take(5).toList();
    return _section(
      title: 'المجتمع',
      dark: dark,
      child: Column(
        children: posts.map<Widget>((raw) {
          final item = Map<String, dynamic>.from(raw as Map);
          final author = (item['authorName'] ?? item['userName'] ?? item['displayName'] ?? 'مستخدم').toString();
          final text = (item['content'] ?? item['text'] ?? item['body'] ?? '').toString();
          final image = (item['imageUrl'] ?? item['image'] ?? '').toString();
          return Container(
            margin: const EdgeInsets.fromLTRB(16, 0, 16, 10),
            padding: const EdgeInsets.all(12),
            decoration: BoxDecoration(color: dark ? _darkCard : Colors.white, borderRadius: BorderRadius.circular(16)),
            child: Row(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                CircleAvatar(radius: 20, backgroundColor: AppColors.primary.withOpacity(.1), child: const Icon(Icons.person_outline, color: AppColors.primary)),
                const SizedBox(width: 10),
                Expanded(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(author, style: TextStyle(fontSize: 12, fontWeight: FontWeight.w900, color: dark ? Colors.white : _text)),
                      if (text.isNotEmpty) ...[
                        const SizedBox(height: 5),
                        Text(text, maxLines: 4, overflow: TextOverflow.ellipsis, style: TextStyle(fontSize: 11, color: dark ? Colors.white70 : _muted)),
                      ],
                      if (image.isNotEmpty) ...[
                        const SizedBox(height: 8),
                        ClipRRect(borderRadius: BorderRadius.circular(10), child: AppImage(imageUrl: image, height: 110, width: double.infinity, fit: BoxFit.cover)),
                      ],
                    ],
                  ),
                ),
              ],
            ),
          );
        }).toList(),
      ),
    );
  }

'''
              s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

          # pharmacy_marketplace_screen.dart: repair the extra closing parenthesis in stores tab.
          p = root / 'lib/presentation/screens/pharmacy/pharmacy_marketplace_screen.dart'
          s = p.read_text(encoding='utf-8')
          old = "      return Card(margin: const EdgeInsets.only(bottom: 10), child: ListTile(isThreeLine: true, leading: CircleAvatar(backgroundColor: AppColors.primary.withOpacity(.1), child: const Icon(Icons.local_pharmacy_outlined, color: AppColors.primary)), title: Text('${p['name'] ?? 'صيدلية'}', style: const TextStyle(fontWeight: FontWeight.bold)), subtitle: Text('${p['address'] ?? p['city'] ?? 'الموقع غير محدد'}\\n${open ? 'مفتوحة الآن' : 'مغلقة'} • ${delivery ? 'توصيل متاح' : 'التوصيل غير متاح'}'), trailing: const Icon(Icons.chevron_left), onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => PharmacyDetailScreen(pharmacy: p))));)    }));"
          new = """      return Card(\n        margin: const EdgeInsets.only(bottom: 10),\n        child: ListTile(\n          isThreeLine: true,\n          leading: CircleAvatar(\n            backgroundColor: AppColors.primary.withOpacity(.1),\n            child: const Icon(Icons.local_pharmacy_outlined, color: AppColors.primary),\n          ),\n          title: Text('${p['name'] ?? 'صيدلية'}', style: const TextStyle(fontWeight: FontWeight.bold)),\n          subtitle: Text('${p['address'] ?? p['city'] ?? 'الموقع غير محدد'}\\n${open ? 'مفتوحة الآن' : 'مغلقة'} • ${delivery ? 'توصيل متاح' : 'التوصيل غير متاح'}'),\n          trailing: const Icon(Icons.chevron_left),\n          onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => PharmacyDetailScreen(pharmacy: p))),\n        ),\n      );\n    }));"""
          if old not in s:
              # Fallback: replace the entire function if formatting changed.
              start = s.find('  Widget _storesTab() {')
              end = s.find('  Widget _productsTab()', start)
              if start >= 0 and end > start:
                  replacement = """  Widget _storesTab() {\n    final stores = _visiblePharmacies;\n    if (stores.isEmpty) return const Center(child: Text('لا توجد صيدليات منشورة تطابق البحث حالياً'));\n    return RefreshIndicator(\n      onRefresh: _loadAll,\n      child: ListView.builder(\n        padding: const EdgeInsets.all(12),\n        itemCount: stores.length,\n        itemBuilder: (_, i) {\n          final p = stores[i];\n          final open = p['isOpen'] == true || p['openNow'] == true;\n          final delivery = p['deliveryAvailable'] == true || p['hasDelivery'] == true || p['delivery'] == true;\n          return Card(\n            margin: const EdgeInsets.only(bottom: 10),\n            child: ListTile(\n              isThreeLine: true,\n              leading: CircleAvatar(backgroundColor: AppColors.primary.withOpacity(.1), child: const Icon(Icons.local_pharmacy_outlined, color: AppColors.primary)),\n              title: Text('${p['name'] ?? 'صيدلية'}', style: const TextStyle(fontWeight: FontWeight.bold)),\n              subtitle: Text('${p['address'] ?? p['city'] ?? 'الموقع غير محدد'}\\n${open ? 'مفتوحة الآن' : 'مغلقة'} • ${delivery ? 'توصيل متاح' : 'التوصيل غير متاح'}'),\n              trailing: const Icon(Icons.chevron_left),\n              onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => PharmacyDetailScreen(pharmacy: p))),\n            ),\n          );\n        },\n      ),\n    );\n  }\n\n"""
                  s = s[:start] + replacement + s[end:]
          else:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # go_router 13 compatibility; harmless if already repaired.
          p = root / 'lib/app_router.dart'
          s = p.read_text(encoding='utf-8')
          s = s.replace('if (router.location == home) return false;', 'if (GoRouterState.of(context).matchedLocation == home) return false;')
          s = re.sub(r"\n    navigatorBuilder: \(context, state, child\) => BackButtonListener\(\n      onBackButtonPressed: \(\) => _handleBack\(context\),\n      child: child,\n    \),", '', s)
          p.write_text(s, encoding='utf-8')
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/presentation/screens/chat/chat_room_screen.dart lib/presentation/screens/home/tabs/home_tab.dart lib/presentation/screens/pharmacy/pharmacy_marketplace_screen.dart lib/app_router.dart
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'fix: repair chat and syntax blockers'
          git push
