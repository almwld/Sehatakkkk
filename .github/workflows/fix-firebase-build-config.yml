name: One-time Firebase build config repair

on:
  push:
    paths:
      - '.github/workflows/fix-firebase-build-config.yml'
      - '.github/firebase-build-config-trigger.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align release Firebase key with tracked configuration
        shell: python
        run: |
          import json
          import re
          from pathlib import Path
          config = json.loads(Path('android/app/google-services.json').read_text(encoding='utf-8'))
          expected = config['client'][0]['api_key'][0]['current_key']
          p = Path('.github/workflows/main.yml')
          s = p.read_text(encoding='utf-8')
          pattern = r'("current_key":\s*")[^"]+("\s*)'
          s2, count = re.subn(pattern, lambda m: m.group(1) + expected + m.group(2), s, count=1)
          if count != 1:
              raise SystemExit('Expected release Firebase current_key was not found')
          p.write_text(s2, encoding='utf-8')
      - name: Commit and remove one-time repair files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-firebase-build-config.yml .github/firebase-build-config-trigger.txt
          git add .github/workflows/main.yml
          git commit -m 'fix: align Firebase Android API key in release build'
          git push origin HEAD:master
