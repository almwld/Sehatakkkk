name: Update Home Facilities Grid

on:
  push:
    paths:
      - 'lib/presentation/widgets/home/featured_facilities_grid.dart'
      - 'scripts/seed_sanaa_hospitals_labs.js'
      - '.github/workflows/update-home-facilities-grid.yml'

permissions:
  contents: write

jobs:
  update-home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch HomeTab
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lib/presentation/screens/home/tabs/home_tab.dart')
          text = path.read_text(encoding='utf-8')
          import_line = "import 'package:sehatak/presentation/widgets/home/featured_facilities_grid.dart';\n"

          if import_line not in text:
              marker = "import 'package:sehatak/presentation/widgets/common/app_image.dart';\n"
              if marker not in text:
                  raise SystemExit('HomeTab import marker not found')
              text = text.replace(marker, marker + import_line, 1)

          hospital_pattern = re.compile(
              r"SliverToBoxAdapter\(\s*child: _places\(\s*'مستشفيات مميزة',\s*state\.hospitals,\s*Icons\.local_hospital_outlined,\s*dark,\s*\),\s*\),",
              re.S,
          )
          lab_pattern = re.compile(
              r"SliverToBoxAdapter\(\s*child: _places\(\s*'مختبرات مميزة',\s*state\.labs,\s*Icons\.biotech_outlined,\s*dark,\s*\),\s*\),",
              re.S,
          )

          hospital_replacement = """SliverToBoxAdapter(\n                  child: FeaturedFacilitiesGrid(\n                    title: 'مستشفيات مميزة',\n                    items: state.hospitals,\n                    isHospital: true,\n                    isDark: dark,\n                  ),\n                ),"""
          lab_replacement = """SliverToBoxAdapter(\n                  child: FeaturedFacilitiesGrid(\n                    title: 'مختبرات مميزة',\n                    items: state.labs,\n                    isHospital: false,\n                    isDark: dark,\n                  ),\n                ),"""

          text, hospitals_count = hospital_pattern.subn(hospital_replacement, text, count=1)
          text, labs_count = lab_pattern.subn(lab_replacement, text, count=1)

          if hospitals_count != 1 or labs_count != 1:
              raise SystemExit(f'Expected one hospital and one lab section; got {hospitals_count}/{labs_count}')

          path.write_text(text, encoding='utf-8')
          print('HomeTab updated:', hospitals_count, labs_count)

      - name: Format touched Dart file
        run: |
          dart format lib/presentation/screens/home/tabs/home_tab.dart lib/presentation/widgets/home/featured_facilities_grid.dart

      - name: Commit HomeTab update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/presentation/screens/home/tabs/home_tab.dart lib/presentation/widgets/home/featured_facilities_grid.dart
          if git diff --cached --quiet; then
            echo 'No HomeTab changes to commit.'
            exit 0
          fi
          git commit -m 'feat(home): show Sana’a hospitals and labs in 2x2 grids'
          git push
