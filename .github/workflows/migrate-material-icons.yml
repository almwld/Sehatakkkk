name: One-time local icon migration
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !startsWith(github.event.head_commit.message, 'refactor(ui): migrate material icons') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Replace only Home tips, discover and weather Material icons
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lib/presentation/screens/home/tabs/home_tab.dart')
          text = path.read_text(encoding='utf-8')

          def block(source, start, end):
              s = source.index(f'Widget {start}')
              e = source.index(f'Widget {end}', s)
              return s, e

          def replace_icons(source, asset, size=30):
              pattern = re.compile(r'(?:const\s+)?Icon\s*\(')
              out, pos = [], 0
              while True:
                  m = pattern.search(source, pos)
                  if not m:
                      out.append(source[pos:])
                      break
                  out.append(source[pos:m.start()])
                  i = m.end()
                  while i < len(source) and source[i].isspace():
                      i += 1
                  if not source.startswith('Icons.', i):
                      out.append(source[m.start():m.end()])
                      pos = m.end()
                      continue
                  depth, j, quote, escaped = 1, i, None, False
                  while j < len(source) and depth:
                      c = source[j]
                      if quote:
                          if escaped: escaped = False
                          elif c == '\\': escaped = True
                          elif c == quote: quote = None
                      else:
                          if c in "'\"": quote = c
                          elif c == '(': depth += 1
                          elif c == ')': depth -= 1
                      j += 1
                  if depth:
                      raise RuntimeError('Unbalanced Icon(...)')
                  out.append(f"Image.asset('{asset}', width: {size}, height: {size}, fit: BoxFit.contain)")
                  pos = j
              return ''.join(out)

          replacements = [
              ('_tips(', '_discover(', 'assets/images/services/health_tips.png'),
              ('_discover(', '_weather(', 'assets/images/services/medical_articles.png'),
              ('_weather(', '_community(', 'assets/svg/home_weather.svg'),
          ]

          for start, end, asset in reversed(replacements):
              s, e = block(text, start, end)
              text = text[:s] + replace_icons(text[s:e], asset) + text[e:]

          for start, end, _ in replacements:
              s, e = block(text, start, end)
              if 'Icons.' in text[s:e]:
                  raise RuntimeError(f'Material icon remains in {start}')

          path.write_text(text, encoding='utf-8')
      - name: Format and commit
        run: |
          dart format lib/presentation/screens/home/tabs/home_tab.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/screens/home/tabs/home_tab.dart
          git rm .github/workflows/migrate-material-icons.yml
          git commit -m 'refactor(ui): migrate material icons in home sections'
          git push origin HEAD:master
