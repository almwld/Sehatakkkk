name: Fix Source Direct
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Patch source
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_method(path, signature, replacement):
              p=Path(path); s=p.read_text(encoding='utf-8-sig'); start=s.find(signature)
              if start<0: return False
              brace=s.find('{',start); depth=0; quote=None; esc=False; end=None
              for i in range(brace,len(s)):
                  c=s[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      continue
                  if c in "'\"": quote=c; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: end=i+1; break
              if end is None: return False
              p.write_text(s[:start]+replacement+s[end:],encoding='utf-8'); return True

          # Chat: remove every duplicate _setTyping and retain one implementation.
          p=Path('lib/presentation/screens/chat/chat_room_screen.dart'); s=p.read_text(encoding='utf-8-sig')
          sig='  Future<void> _setTyping(bool typing) async {'
          first=s.find(sig)
          if first>=0:
              brace=s.find('{',first); depth=0; quote=None; esc=False; end=None
              for i in range(brace,len(s)):
                  c=s[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      continue
                  if c in "'\"": quote=c; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: end=i+1; break
              if end:
                  head=s[:end]; tail=s[end:]
                  while True:
                      m=tail.find(sig)
                      if m<0: break
                      b=tail.find('{',m); d=0; q=None; e=None; esc=False
                      for i in range(b,len(tail)):
                          c=tail[i]
                          if q:
                              if esc: esc=False
                              elif c=='\\': esc=True
                              elif c==q: q=None
                              continue
                          if c in "'\"": q=c; continue
                          if c=='{': d+=1
                          elif c=='}':
                              d-=1
                              if d==0: e=i+1; break
                      if e is None: break
                      tail=tail[:m]+tail[e:]
                  p.write_text(head+tail,encoding='utf-8')

          # Consultation: use the actual CallModel.callType field.
          p=Path('lib/presentation/screens/consultation/consultation_screen.dart'); s=p.read_text(encoding='utf-8')
          s=s.replace("final isVideo = c.isVideo.name == 'video';", "final isVideo = c.callType == CallType.video;")
          if 'CallType' in s and "models/call_model.dart" not in s:
              s=s.replace("import 'package:sehatak/core/models/chat_model.dart';", "import 'package:sehatak/core/models/chat_model.dart';\nimport 'package:sehatak/core/models/call_model.dart';")
          p.write_text(s,encoding='utf-8')

          # Pharmacy: replace only the malformed _storesTab method; preserve its real-data behavior.
          stores = '''  Widget _storesTab() {
    final stores = _visiblePharmacies;
    if (stores.isEmpty) return const Center(child: Text('لا توجد صيدليات منشورة تطابق البحث حالياً'));
    return RefreshIndicator(
      onRefresh: _loadAll,
      child: ListView.builder(
        padding: const EdgeInsets.all(12),
        itemCount: stores.length,
        itemBuilder: (_, i) {
          final p = stores[i];
          final open = p['isOpen'] == true || p['openNow'] == true;
          final delivery = p['deliveryAvailable'] == true || p['hasDelivery'] == true || p['delivery'] == true;
          return Card(
            margin: const EdgeInsets.only(bottom: 10),
            child: ListTile(
              isThreeLine: true,
              leading: CircleAvatar(
                backgroundColor: AppColors.primary.withOpacity(.1),
                child: const Icon(Icons.local_pharmacy_outlined, color: AppColors.primary),
              ),
              title: Text('${p['name'] ?? 'صيدلية'}', style: const TextStyle(fontWeight: FontWeight.bold)),
              subtitle: Text('${p['address'] ?? p['city'] ?? 'الموقع غير محدد'}\\n${open ? 'مفتوحة الآن' : 'مغلقة'} • ${delivery ? 'توصيل متاح' : 'التوصيل غير متاح'}'),
              trailing: const Icon(Icons.chevron_left),
              onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => PharmacyDetailScreen(pharmacy: p))),
            ),
          );
        },
      ),
    );
  }
'''
          replace_method('lib/presentation/screens/pharmacy/pharmacy_marketplace_screen.dart','  Widget _storesTab() {',stores)

          # Remove this one-time workflow after the repair commit so it cannot mutate future work.
          wf=Path('.github/workflows/fix-source-direct.yml')
          if wf.exists(): wf.unlink()
      - name: Format repaired files
        run: dart format lib/presentation/screens/chat/chat_room_screen.dart lib/presentation/screens/consultation/consultation_screen.dart lib/presentation/screens/pharmacy/pharmacy_marketplace_screen.dart
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib .github/workflows
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: repair remaining source syntax blockers'
          git push origin HEAD:master
