name: 🔎 Sehatak Code Check

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Flutter static analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Repair known Dart blockers
        run: python3 scripts/repair_dart_blockers.py

      - name: 📝 Commit repaired Dart sources
        run: |
          if git diff --quiet; then
            echo 'No source repair changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/presentation/screens/home/tabs/home_tab.dart lib/presentation/screens/patient/patient_dashboard.dart
            git diff --cached --check
            git commit -m 'fix: repair Dart dashboard and HomeTab blockers'
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
          fi

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔎 Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 🧪 Run tests
        run: flutter test
