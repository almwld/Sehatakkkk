name: Apply Home Icons 2

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch Home local icons
        shell: bash
        run: |
          set -e
          if git log -1 --pretty=%B | grep -q '^refactor(home): apply local section icons$'; then
            echo 'Patch commit already applied.'
            exit 0
          fi
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/presentation/screens/home/tabs/home_tab.dart')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "const Icon(Icons.lightbulb_outline, color: AppColors.primary, size: 28)",
              "Image.asset('assets/images/services/health_tips.png', width: 30, height: 30, fit: BoxFit.contain)",
          )
          s = s.replace(
              "const Icon(Icons.lightbulb_outline, color: AppColors.primary, size: 38)",
              "Image.asset('assets/images/services/health_tips.png', width: 38, height: 38, fit: BoxFit.contain)",
          )
          old = """const items = [
      {'name': 'حجز موعد', 'icon': Icons.calendar_month_outlined, 'route': AppRouter.appointments},
      {'name': 'طوارئ', 'icon': Icons.emergency_outlined, 'route': AppRouter.emergency},
      {'name': 'خريطة', 'icon': Icons.map_outlined, 'route': AppRouter.map},
      {'name': 'باقات', 'icon': Icons.inventory_2_outlined, 'route': AppRouter.services},
    ];"""
          new = """const items = [
      {'name': 'حجز موعد', 'icon': 'assets/images/services/calendar_booking.png', 'route': AppRouter.appointments},
      {'name': 'طوارئ', 'icon': 'assets/images/services/emergency.png', 'route': AppRouter.emergency},
      {'name': 'خريطة', 'icon': 'assets/images/services/map_location.png', 'route': AppRouter.map},
      {'name': 'باقات', 'icon': 'assets/images/services/health_insurance.png', 'route': AppRouter.services},
    ];"""
          if old not in s:
              raise SystemExit('discover map not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              "Icon(item['icon']! as IconData, color: AppColors.primary, size: 27)",
              "Image.asset(item['icon']! as String, width: 27, height: 27, fit: BoxFit.contain)",
          )
          s = s.replace(
              "const Icon(Icons.wb_sunny_outlined, color: AppColors.primary, size: 34)",
              "Image.asset('assets/svg/home_weather.svg', width: 34, height: 34, fit: BoxFit.contain)",
          )
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet -- lib/presentation/screens/home/tabs/home_tab.dart; then
            echo 'No Home changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/presentation/screens/home/tabs/home_tab.dart
          git commit -m 'refactor(home): apply local section icons'
          git push origin HEAD:master
