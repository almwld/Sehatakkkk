name: 🧪 Backend Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: 📦 Install functions dependencies
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: 🔎 Validate JavaScript syntax
        run: |
          node --check functions/loader.js
          node --check functions/pharmacy_marketplace_functions.js
          node --check functions/catalog_import_v2.js

      - name: 💊 Validate and compile 300-drug source catalog
        run: node scripts/build_official_drug_catalog.js

      - name: 📊 Verify generated catalog size
        run: |
          node -e "const x=require('./functions/data/official_drug_catalog.json'); if(x.length!==300) process.exit(1); console.log('official catalog records:', x.length)"
