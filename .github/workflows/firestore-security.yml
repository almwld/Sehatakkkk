name: Firestore Security Rules Tests

on:
  push:
    branches: [master]
    paths:
      - 'firestore.rules'
      - 'security-tests/**'
      - '.github/workflows/firestore-security.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'security-tests/**'
      - '.github/workflows/firestore-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install security test dependencies
        working-directory: security-tests
        run: npm install --no-audit --no-fund
      - name: Run Firestore emulator rule tests
        working-directory: security-tests
        run: npm test
