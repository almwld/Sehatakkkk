name: Firestore Security Rules Tests

on:
  push:
    branches: [master]
    paths:
      - 'firestore.rules'
      - 'functions/**'
      - 'lib/**'
      - 'security-tests/**'
      - 'functions/**'
      - '.github/workflows/firestore-security.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'security-tests/**'
      - '.github/workflows/firestore-security.yml'
  workflow_dispatch:

concurrency:
  group: firestore-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install security test dependencies
        working-directory: security-tests
        run: npm install --no-audit --no-fund
      - name: Run Firestore emulator rule tests
        working-directory: security-tests
        run: npm test
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Validate Cloud Functions syntax
        run: |
          node --check functions/index.js
          node --check functions/public_profile_sync.js
          node --check functions/public_profile_projection.js
          node --check functions/notification_triggers.js
          node --check functions/appointment-date.js
          node --check functions/scripts/backfill_public_profiles.js
      - name: Run Cloud Functions unit tests
        working-directory: functions
        run: npm test
