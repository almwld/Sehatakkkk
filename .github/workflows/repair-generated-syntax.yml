name: Repair generated Flutter syntax
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci: repair generated syntax') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair generated files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              s = p.read_text()
              s = fn(s)
              p.write_text(s)

          edit('lib/presentation/widgets/common/custom_bottom_navigation_bar.dart', lambda s: s
               .replace('AppImages.servicesMedicalRecords', 'AppImages.servicesHealthTips'))

          edit('lib/core/services/community_share_service.dart', lambda s: s.replace(
              "import 'dart:ui' as ui;",
              "import 'dart:ui' as ui;\nimport 'package:flutter/rendering.dart';"))

          def role_fix(s):
              old = "Text(subtitle, style: TextStyle(fontSize: 10, color: Colors.grey[600]))]))]));"
              new = "Text(subtitle, style: TextStyle(fontSize: 10, color: Colors.grey[600]))]))));"
              return s.replace(old, new)
          edit('lib/presentation/screens/dashboard/role_based_dashboard_screen.dart', role_fix)

          def bottom_fix(s):
              start = s.index('  Widget _buildSpecialChatButton')
              end = s.index('\n  void _handleTap', start)
              method = '''  Widget _buildSpecialChatButton(NavItem item, bool dark) {\n    final selected = currentIndex == item.index;\n    return GestureDetector(\n      onTap: () => _handleTap(item),\n      behavior: HitTestBehavior.opaque,\n      child: SizedBox(\n        width: 60,\n        height: 72,\n        child: Column(\n          mainAxisAlignment: MainAxisAlignment.end,\n          children: [\n            Transform.translate(\n              offset: const Offset(0, -18),\n              child: AnimatedContainer(\n                duration: const Duration(milliseconds: 200),\n                width: 56,\n                height: 56,\n                decoration: BoxDecoration(\n                  gradient: const LinearGradient(colors: [AppColors.primary, AppColors.primaryDark]),\n                  shape: BoxShape.circle,\n                  border: Border.all(color: dark ? const Color(0xFF1E293B) : Colors.white, width: 3),\n                  boxShadow: [BoxShadow(color: AppColors.primary.withOpacity(.4), blurRadius: 20, offset: const Offset(0, 8))],\n                ),\n                child: Center(child: _image(item.iconPath, size: 28, color: Colors.white)),\n              ),\n            ),\n            Text(item.label, style: TextStyle(fontSize: 9, fontWeight: selected ? FontWeight.w700 : FontWeight.w500, color: selected ? AppColors.primary : (dark ? Colors.grey.shade400 : Colors.grey.shade500))),\n            const SizedBox(height: 4),\n          ],\n        ),\n      ),\n    );\n  }\n'''
              return s[:start] + method + s[end:]
          edit('lib/presentation/widgets/common/custom_bottom_navigation_bar.dart', bottom_fix)

          def home_fix(s):
              if "import 'package:flutter/rendering.dart';" not in s:
                  s=s.replace("import 'package:flutter/material.dart';", "import 'package:flutter/material.dart';\nimport 'package:flutter/rendering.dart';")
              s=s.replace('late Future<List<ProductModel>> _products;', 'late Future<List<ProductModel>> _productsFuture;')
              s=s.replace('late Future<Map<String, dynamic>> _weather;', 'late Future<Map<String, dynamic>> _weatherFuture;')
              s=s.replace('_products = PharmacyService().getAllProducts();','_productsFuture = PharmacyService().getAllProducts();')
              s=s.replace('_weather = _loadWeather();','_weatherFuture = _loadWeather();')
              s=s.replace('future: _products,','future: _productsFuture,')
              s=s.replace('future: _weather,','future: _weatherFuture,')
              start=s.index('  Widget _doctors(')
              end=s.index('  Widget _community', start)
              methods='''  Widget _doctors(HomeState state, bool dark) {\n    if (state.doctors.isEmpty) return _section('أفضل الأطباء', dark, _empty('لا يوجد أطباء موثقون متاحون حالياً', dark));\n    return _section('أفضل الأطباء', dark, SizedBox(height: 220, child: ListView.separated(scrollDirection: Axis.horizontal, padding: const EdgeInsets.symmetric(horizontal: 16), itemCount: state.doctors.take(6).length, separatorBuilder: (_, __) => const SizedBox(width: 10), itemBuilder: (_, i) {\n      final d=state.doctors[i]; final id=(d['id']??d['doctorId']??d['userId']??'').toString();\n      return InkWell(onTap: id.isEmpty?null:()=>_go('/doctor/$id'), child: Container(width:160,padding:const EdgeInsets.all(9),decoration:BoxDecoration(color:dark?_darkCard:Colors.white,borderRadius:BorderRadius.circular(16)),child:Column(children:[Expanded(child:AppImage(imageUrl:(d['photoUrl']??d['image']??ImageKit.doctor1).toString(),width:double.infinity,fit:BoxFit.cover,borderRadius:BorderRadius.circular(13))),const SizedBox(height:7),Text((d['name']??'طبيب').toString(),maxLines:1,overflow:TextOverflow.ellipsis,style:TextStyle(fontSize:12,fontWeight:FontWeight.w900,color:dark?Colors.white:_text)),Text((d['specialty']??'تخصص طبي').toString(),maxLines:1,overflow:TextOverflow.ellipsis,style:const TextStyle(fontSize:9.5,color:AppColors.primary))])));\n    }));\n  }\n\n  Widget _products(bool dark) {\n    return _section('منتجات الصيدلية', dark, FutureBuilder<List<ProductModel>>(future:_productsFuture,builder:(context,snap){\n      if(snap.connectionState==ConnectionState.waiting) return const SizedBox(height:210,child:Center(child:CircularProgressIndicator(strokeWidth:2)));\n      final products=snap.data??const <ProductModel>[]; if(products.isEmpty) return _empty('لا توجد منتجات متاحة حالياً',dark);\n      return SizedBox(height:220,child:ListView.separated(scrollDirection:Axis.horizontal,padding:const EdgeInsets.symmetric(horizontal:16),itemCount:products.take(8).length,separatorBuilder:(_,__)=>const SizedBox(width:10),itemBuilder:(_,i){final p=products[i];return Container(width:155,padding:const EdgeInsets.all(10),decoration:BoxDecoration(color:dark?_darkCard:Colors.white,borderRadius:BorderRadius.circular(16)),child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Expanded(child:AppImage(imageUrl:p.imageUrl??ImageKit.medicine1,width:90,height:90,fit:BoxFit.contain)),Text(p.name,maxLines:2,overflow:TextOverflow.ellipsis,style:TextStyle(fontSize:11.5,fontWeight:FontWeight.w800,color:dark?Colors.white:_text)),const SizedBox(height:4),Text('${p.price.toStringAsFixed(0)} ر.ي',style:const TextStyle(color:AppColors.primary,fontWeight:FontWeight.w900))]));}));\n    }));\n  }\n\n  Widget _places(String title,List<Map<String,dynamic>> data,String fallback,bool dark){\n    return _section(title,dark,data.isEmpty?_empty('لا توجد بيانات متاحة حالياً',dark):SizedBox(height:150,child:ListView.separated(scrollDirection:Axis.horizontal,padding:const EdgeInsets.symmetric(horizontal:16),itemCount:data.take(6).length,separatorBuilder:(_,__)=>const SizedBox(width:10),itemBuilder:(_,i){final x=data[i];return Container(width:190,padding:const EdgeInsets.all(9),decoration:BoxDecoration(color:dark?_darkCard:Colors.white,borderRadius:BorderRadius.circular(16)),child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Expanded(child:AppImage(imageUrl:(x['imageUrl']??x['image']??fallback).toString(),width:double.infinity,fit:BoxFit.cover,borderRadius:BorderRadius.circular(12))),const SizedBox(height:6),Text((x['name']??'منشأة صحية').toString(),maxLines:1,overflow:TextOverflow.ellipsis,style:TextStyle(fontWeight:FontWeight.w900,color:dark?Colors.white:_text)),Text((x['address']??x['location']??'').toString(),maxLines:1,overflow:TextOverflow.ellipsis,style:TextStyle(fontSize:9,color:dark?Colors.white60:_muted))]));})));\n  }\n\n  Widget _articles(List<Map<String,dynamic>> data,bool dark){\n    return _section('أحدث المقالات',dark,data.isEmpty?_empty('لا توجد مقالات منشورة حالياً',dark):GridView.builder(padding:const EdgeInsets.symmetric(horizontal:16),shrinkWrap:true,physics:const NeverScrollableScrollPhysics(),itemCount:data.take(4).length,gridDelegate:const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount:2,crossAxisSpacing:9,mainAxisSpacing:9,childAspectRatio:.95),itemBuilder:(_,i){final a=data[i];return InkWell(onTap:()=>_go(AppRouter.more),child:Container(clipBehavior:Clip.antiAlias,decoration:BoxDecoration(color:dark?_darkCard:Colors.white,borderRadius:BorderRadius.circular(15)),child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Expanded(child:AppImage(imageUrl:(a['imageUrl']??a['image']??ImageKit.nutritionTips).toString(),width:double.infinity,fit:BoxFit.cover)),Padding(padding:const EdgeInsets.all(9),child:Text((a['title']??a['name']??'مقال صحي').toString(),maxLines:3,overflow:TextOverflow.ellipsis,style:TextStyle(fontSize:11,fontWeight:FontWeight.w800,color:dark?Colors.white:_text)))])));}));\n  }\n\n  Widget _tips(List<Map<String,dynamic>> data,bool dark){\n    final f=[('شرب الماء','8 أكواب يومياً','assets/images/tracking/nutrition.png'),('المشي','30 دقيقة يومياً','assets/images/tracking/fitness.png'),('النوم','7-8 ساعات','assets/images/tracking/mental_health.png'),('الفواكه','5 حصص يومياً','assets/images/tracking/nutrition.png')];\n    return _section('النصائح اليومية',dark,GridView.builder(padding:const EdgeInsets.symmetric(horizontal:16),shrinkWrap:true,physics:const NeverScrollableScrollPhysics(),itemCount:data.isEmpty?4:data.take(4).length,gridDelegate:const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount:2,crossAxisSpacing:9,mainAxisSpacing:9,childAspectRatio:1.1),itemBuilder:(_,i){final title=data.isEmpty?f[i].$1:(data[i]['title']??data[i]['name']??'نصيحة صحية').toString();final text=data.isEmpty?f[i].$2:(data[i]['content']??data[i]['description']??'').toString();return InkWell(onTap:()=>_showTip(title,text),child:Container(padding:const EdgeInsets.all(11),decoration:BoxDecoration(color:dark?_darkCard:Colors.white,borderRadius:BorderRadius.circular(14)),child:Column(mainAxisAlignment:MainAxisAlignment.center,children:[LocalAssetIcon(data.isEmpty?f[i].$3:'assets/images/tracking/nutrition.png',size:44),const SizedBox(height:6),Text(title,maxLines:1,overflow:TextOverflow.ellipsis,style:TextStyle(fontWeight:FontWeight.w900,color:dark?Colors.white:_text)),Text(text,maxLines:2,textAlign:TextAlign.center,overflow:TextOverflow.ellipsis,style:TextStyle(fontSize:9.5,color:dark?Colors.white60:_muted))])));});\n  }\n\n  void _showTip(String title,String text)=>showModalBottomSheet<void>(context:context,builder:(_)=>Padding(padding:const EdgeInsets.all(24),child:Column(mainAxisSize:MainAxisSize.min,children:[Text(title,style:const TextStyle(fontSize:20,fontWeight:FontWeight.w900)),const SizedBox(height:10),Text(text,textAlign:TextAlign.center),const SizedBox(height:18),ElevatedButton(onPressed:()=>Navigator.pop(context),child:const Text('إغلاق'))])));\n\n  Widget _discover(bool dark)=>_section('اكتشف المزيد',dark,Padding(padding:const EdgeInsets.symmetric(horizontal:16),child:Row(children:[('assets/images/services/medical_articles.png','مقالات',AppRouter.more),('assets/images/services/packages.png','باقات',AppRouter.services)].map((x)=>Expanded(child:Padding(padding:const EdgeInsets.all(4),child:InkWell(onTap:()=>_go(x.$3),child:Container(height:80,decoration:BoxDecoration(color:dark?_darkCard:Colors.white,borderRadius:BorderRadius.circular(12)),child:Column(mainAxisAlignment:MainAxisAlignment.center,children:[LocalAssetIcon(x.$1,size:32),Text(x.$2,style:TextStyle(fontSize:10,color:dark?Colors.white:_text))]))))).toList())));\n\n  Widget _weather(bool dark)=>_section('الطقس والتوصيات',dark,FutureBuilder<Map<String,dynamic>>(future:_weatherFuture,builder:(_,snap){final d=snap.data??const <String,dynamic>{};return Padding(padding:const EdgeInsets.symmetric(horizontal:16),child:Container(padding:const EdgeInsets.all(16),decoration:BoxDecoration(color:dark?_darkCard:Colors.white,borderRadius:BorderRadius.circular(18)),child:Row(children:[const LocalAssetIcon('assets/images/tracking/nutrition.png',size:38),const SizedBox(width:12),Expanded(child:Text(d['temp']==null?'جاري تحديث الطقس':'${d['temp']}° — ${d['condition']}',style:TextStyle(fontWeight:FontWeight.w900,color:dark?Colors.white:_text)))])));}));\n\n'''
              s=s[:start]+methods+s[end:]
              s=s.replace("Widget _section(String title, bool dark, Widget child) => Padding(padding: const EdgeInsets.only(top: 18), child: Column(children: [Padding(padding: const EdgeInsets.symmetric(horizontal: 16), child: Align(alignment: Alignment.centerRight, child: Text(title, style: TextStyle(fontSize: 17, fontWeight: FontWeight.w900, color: dark ? Colors.white : _text))), const SizedBox(height: 9), child]));", "Widget _section(String title, bool dark, Widget child) => Padding(padding: const EdgeInsets.only(top: 18), child: Column(children: [Padding(padding: const EdgeInsets.symmetric(horizontal: 16), child: Align(alignment: Alignment.centerRight, child: Text(title, style: TextStyle(fontSize: 17, fontWeight: FontWeight.w900, color: dark ? Colors.white : _text)))), const SizedBox(height: 9), child]));")
              s=s.replace("Widget _empty(String text, bool dark) => Padding(padding: const EdgeInsets.symmetric(horizontal: 16), child: Container(height: 95, width: double.infinity, alignment: Alignment.center, decoration: BoxDecoration(color: dark ? _darkCard : Colors.white, borderRadius: BorderRadius.circular(16)), child: Text(text, style: TextStyle(color: dark ? Colors.white60 : _muted)));", "Widget _empty(String text, bool dark) => Padding(padding: const EdgeInsets.symmetric(horizontal: 16), child: Container(height: 95, width: double.infinity, alignment: Alignment.center, decoration: BoxDecoration(color: dark ? _darkCard : Colors.white, borderRadius: BorderRadius.circular(16)), child: Text(text, style: TextStyle(color: dark ? Colors.white60 : _muted))));")
              return s
          edit('lib/presentation/screens/home/tabs/home_tab_pro.dart', home_fix)

          def platform_fix(s):
              start=s.index('  @override Widget build')
              end=s.rindex('\n}')
              build='''  @override\n  Widget build(BuildContext context) {\n    final isDark = Theme.of(context).brightness == Brightness.dark;\n    return Scaffold(\n      backgroundColor: isDark ? const Color(0xFF0B1121) : const Color(0xFFF8FAFC),\n      appBar: CustomAppBar(title: 'إدارة التوثيق', backgroundColor: AppColors.primary, foregroundColor: Colors.white, elevation: 0),\n      body: _loading ? const Center(child: CircularProgressIndicator(color: AppColors.primary)) : (_error != null || !_isAdmin) ? Center(child: Padding(padding: const EdgeInsets.all(24), child: Text(_error ?? 'غير مصرح لك بالدخول', textAlign: TextAlign.center))) : RefreshIndicator(\n        color: AppColors.primary,\n        onRefresh: _load,\n        child: _pending.isEmpty ? ListView(children: const [SizedBox(height: 180), Center(child: Text('لا توجد طلبات توثيق معلقة حالياً'))]) : ListView.builder(\n          padding: const EdgeInsets.all(16),\n          itemCount: _pending.length,\n          itemBuilder: (context, index) {\n            final data=_pending[index].data(); final doctorId=_pending[index].id;\n            return Card(margin: const EdgeInsets.only(bottom: 12), child: Padding(padding: const EdgeInsets.all(16), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children:[Text(data['name']?.toString()??'طبيب بدون اسم',style:const TextStyle(fontSize:17,fontWeight:FontWeight.bold)),const SizedBox(height:5),Text(data['specialty']?.toString()??'غير محدد'),const SizedBox(height:14),Row(children:[Expanded(child:OutlinedButton(onPressed:()=>_review(doctorId,'reject'),child:const Text('رفض'))),const SizedBox(width:10),Expanded(child:ElevatedButton(onPressed:()=>_review(doctorId,'approve'),style:ElevatedButton.styleFrom(backgroundColor:AppColors.primary,foregroundColor:Colors.white),child:const Text('اعتماد')))])])));\n          },\n        ),\n      ),\n    );\n  }\n'''
              return s[:start]+build+s[end:]
          edit('lib/presentation/screens/platform/dashboard/platform_dashboard.dart', platform_fix)

          def marketplace_fix(s):
              start=s.index('  @override Widget build')
              end=s.index('\n  Widget _section',start)
              build='''  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      appBar: AppBar(title: const Text('إدارة Marketplace'), backgroundColor: AppColors.primary, foregroundColor: Colors.white, actions: [IconButton(onPressed: _load, icon: const Icon(Icons.refresh))]),\n      body: _loading ? const Center(child: CircularProgressIndicator()) : _error != null ? Center(child: Padding(padding: const EdgeInsets.all(24), child: Text(_error!, textAlign: TextAlign.center))) : RefreshIndicator(onRefresh: _load, child: ListView(padding: const EdgeInsets.all(12), children: [\n        _section('طلبات اعتماد الصيدليات', _pharmacies, (p) => Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text('${p['name'] ?? 'صيدلية'}', style: const TextStyle(fontWeight: FontWeight.bold)), Text('${p['address'] ?? ''}'), Text('الترخيص: ${p['licenseNumber'] ?? 'غير مسجل'}'), _actions(() => _reviewPharmacy('${p['id']}', 'reject'), () => _reviewPharmacy('${p['id']}', 'approve'))])),\n        const SizedBox(height: 16),\n        _section('منتجات معلقة', _products, (p) => Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text('${p['name'] ?? 'منتج'}', style: const TextStyle(fontWeight: FontWeight.bold)), Text('${p['category'] ?? ''} • ${p['price'] ?? 0} ر.ي • مخزون ${p['stock'] ?? 0}'), Text('الصيدلية: ${p['pharmacyId'] ?? ''}'), _actions(() => _reviewProduct('${p['id']}', 'reject'), () => _reviewProduct('${p['id']}', 'approve'))])),\n      ])),\n    );\n  }\n'''
              return s[:start]+build+s[end:]
          edit('lib/presentation/screens/platform/marketplace_admin_dashboard.dart', marketplace_fix)

          def subscription_fix(s):
              return s.replace('_trustNote()]));', '_trustNote()])));')
          edit('lib/presentation/screens/subscriptions/subscriptions_screen.dart', subscription_fix)

          def cart_fix(s):
              return s.replace("..._cart.items.map((item) => Card(child: ListTile(title: Text(item.name), subtitle: Text('${item.unitPrice.toStringAsFixed(0)} ر.ي × ${item.quantity}'), trailing: Row(mainAxisSize: MainAxisSize.min, children: [IconButton(onPressed: () => setState(() => _cart.decrement(item.productId)), icon: const Icon(Icons.remove_circle_outline)), Text('${item.quantity}'), IconButton(onPressed: () => setState(() => _cart.increment(item.productId)), icon: const Icon(Icons.add_circle_outline)), IconButton(onPressed: () => setState(() => _cart.remove(item.productId)), icon: const Icon(Icons.delete_outline, color: Colors.red))]))),", "..._cart.items.map((item) => Card(child: ListTile(title: Text(item.name), subtitle: Text('${item.unitPrice.toStringAsFixed(0)} ر.ي × ${item.quantity}'), trailing: Row(mainAxisSize: MainAxisSize.min, children: [IconButton(onPressed: () => setState(() => _cart.decrement(item.productId)), icon: const Icon(Icons.remove_circle_outline)), Text('${item.quantity}'), IconButton(onPressed: () => setState(() => _cart.increment(item.productId)), icon: const Icon(Icons.add_circle_outline)), IconButton(onPressed: () => setState(() => _cart.remove(item.productId)), icon: const Icon(Icons.delete_outline, color: Colors.red))])))),")
          edit('lib/presentation/screens/pharmacy/cart_screen.dart', cart_fix)

          PY
          git config user.name 'github-actions[bot]'
