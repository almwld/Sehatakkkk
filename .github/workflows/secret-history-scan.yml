name: Secret Scan (Current + New Commits)

on:
  push:
    branches: [main, master, "security/**", "fix/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Scan the checked-out tree on every run. This catches credentials that
      # are still present in tracked files without failing on inherited history.
      - name: Scan current repository files
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --redact --verbose /repo

      # Scan only commits introduced by this PR/push. The previous workflow
      # used --all, which repeatedly failed on legacy findings in old refs and
      # made unrelated changes impossible to verify.
      - name: Scan commits introduced by this change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No comparable base commit for this event; current-tree scan completed."
            exit 0
          fi

          git cat-file -e "${BASE_SHA}^{commit}"
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" /repo
