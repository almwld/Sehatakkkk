name: Firebase Functions

on:
  push:
    branches: [master]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install functions dependencies
        working-directory: functions
        run: npm install --ignore-scripts
      - name: Syntax check
        working-directory: functions
        run: node --check index.js

  deploy:
    if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Write Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Functions and Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --project sehatak-platform --only functions,firestore:rules
