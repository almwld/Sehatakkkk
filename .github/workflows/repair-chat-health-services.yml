name: Repair Chat Health Services

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/repair-chat-health-services.yml'
      - 'lib/**'
      - 'functions/**'
      - 'livekit-token-server/**'
  workflow_dispatch:

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply repairs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')

          # Home/health top bar: notifications are actionable; remove stray overflow dots.
          p=Path('lib/presentation/screens/health/health_dashboard.dart')
          if p.exists():
            s=read(p)
            s=re.sub(r"\n\s*IconButton\(\s*icon:\s*Icon\(Icons\.more_vert,[\s\S]*?onPressed:\s*\(\)\s*\{\},\s*\),", "", s, count=1)
            s=s.replace("onPressed: () {},", "onPressed: () => Navigator.of(context).push(MaterialPageRoute(builder: (_) => const NotificationsScreen())),", 1) if 'NotificationsScreen' in s else s
            if 'notifications_screen.dart' not in s and 'NotificationsScreen' in s:
              s=s.replace("import 'package:flutter/material.dart';", "import 'package:flutter/material.dart';\nimport 'package:sehatak/presentation/screens/shared/notifications_screen.dart';",1)
            write(p,s)

          # Status editor: the action is explicitly Save, while retaining the existing publish implementation.
          p=Path('lib/presentation/screens/chat/add_status_screen.dart')
          if p.exists():
            s=read(p).replace("const Text('نشر', style: TextStyle(fontWeight: FontWeight.w800))", "const Text('حفظ', style: TextStyle(fontWeight: FontWeight.w800))")
            write(p,s)

          # Chat contacts: use the canonical Health Contacts directory/status UI instead of the legacy doctor-only tab.
          p=Path('lib/presentation/screens/chat/chat_screen.dart')
          if p.exists():
            s=read(p)
            if 'health_contacts_section.dart' not in s:
              s=s.replace("import 'package:sehatak/presentation/widgets/status_row.dart';", "import 'package:sehatak/presentation/widgets/status_row.dart';\nimport 'package:sehatak/presentation/widgets/health_contacts_section.dart';",1)
            start=s.find('  Widget _buildContactsTab(bool isDark) {')
            if start>=0:
              end=s.find('\n  Widget _buildStatusSection(bool isDark) {', start)
              if end>start:
                replacement="  Widget _buildContactsTab(bool isDark) {\n    return const HealthContactsSection(isDark: false);\n  }\n"
                # Preserve dark mode dynamically by using a small builder instead of const.
                replacement="  Widget _buildContactsTab(bool isDark) {\n    return HealthContactsSection(isDark: isDark);\n  }\n"
                s=s[:start]+replacement+s[end:]
            write(p,s)

          # Message bubble: copy text, and render reply metadata as structured content instead of Map.toString().
          p=Path('lib/presentation/screens/chat/widgets/message_bubble.dart')
          if p.exists():
            s=read(p)
            if "import 'package:flutter/services.dart';" not in s:
              s=s.replace("import 'package:flutter/material.dart';", "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';",1)
            old="if ((m['replyPreview']?.toString().trim() ?? '').isNotEmpty) Container(width: double.infinity, margin: const EdgeInsets.only(bottom: 6), padding: const EdgeInsets.all(7), decoration: BoxDecoration(color: widget.isMe ? Colors.white.withOpacity(.14) : Colors.black.withOpacity(.06), borderRadius: BorderRadius.circular(8)), child: Text(m['replyPreview'].toString(), maxLines: 2, overflow: TextOverflow.ellipsis, style: TextStyle(fontSize: 11, color: widget.isMe ? Colors.white70 : Colors.black54))),"
            new="if (m['replyPreview'] is Map) _replyPreview(m['replyPreview'] as Map, dark),"
            if old in s: s=s.replace(old,new)
            marker='  Widget _status(Map<String, dynamic> m) {'
            helper="""  Widget _replyPreview(Map preview, bool dark) {\n    final sender = preview['senderName']?.toString().trim() ?? 'مستخدم';\n    final text = preview['text']?.toString().trim() ?? 'مرفق';\n    return Container(width: double.infinity, margin: const EdgeInsets.only(bottom: 6), padding: const EdgeInsets.all(7), decoration: BoxDecoration(color: widget.isMe ? Colors.white.withOpacity(.14) : Colors.black.withOpacity(.06), borderRadius: BorderRadius.circular(8)), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text(sender, maxLines: 1, overflow: TextOverflow.ellipsis, style: TextStyle(fontSize: 10, fontWeight: FontWeight.w700, color: widget.isMe ? Colors.white : AppColors.primary)), const SizedBox(height: 2), Text(text, maxLines: 2, overflow: TextOverflow.ellipsis, style: TextStyle(fontSize: 11, color: widget.isMe ? Colors.white70 : (dark ? Colors.white70 : Colors.black54))) ]));\n  }\n\n"""
            if marker in s and '_replyPreview(Map preview' not in s: s=s.replace(marker,helper+marker,1)
            # Add Copy before Reply in the long-press menu.
            needle="""            if (widget.onReply != null)\n              ListTile("""
            copy="""            if ((widget.message['text']?.toString().trim() ?? '').isNotEmpty)\n              ListTile(\n                leading: const Icon(Icons.copy),\n                title: const Text('نسخ الرسالة'),\n                onTap: () async {\n                  await Clipboard.setData(ClipboardData(text: widget.message['text'].toString()));\n                  if (mounted) Navigator.pop(context);\n                },\n              ),\n            if (widget.onReply != null)\n              ListTile("""
            if needle in s and 'نسخ الرسالة' not in s: s=s.replace(needle,copy,1)
            write(p,s)

          # Chat room: real typing presence + media callback is kept connected; mark read remains automatic.
          p=Path('lib/presentation/screens/chat/chat_room_screen.dart')
          if p.exists():
            s=read(p)
            if 'Timer? _typingClearTimer;' not in s:
              s=s.replace('  Timer? _pendingRefreshTimer;', '  Timer? _pendingRefreshTimer;\n  Timer? _typingClearTimer;\n  bool _otherTyping = false;',1)
            if 'void _setTyping(bool typing)' not in s:
              marker='  void _startPendingRefresh() {'
              helper="""  Future<void> _setTyping(bool typing) async {\n    final uid = _auth.currentUser?.uid;\n    if (uid == null) return;\n    _typingClearTimer?.cancel();\n    if (typing) {\n      _typingClearTimer = Timer(const Duration(seconds: 2), () => _setTyping(false));\n    }\n    try { await _firestore.collection('chats').doc(widget.chatId).set({'typing.$uid': typing}, SetOptions(merge: true)); } catch (e) { debugPrint('typing update: $e'); }\n  }\n\n"""
              if marker in s: s=s.replace(marker,helper+marker,1)
            if "'typing'" not in s[s.find('void _listen()'):s.find('DateTime _messageTime')]:
              needle="""    _chatSub = _firestore.collection('chats').doc(widget.chatId).snapshots().listen((snapshot) {"""
              replacement="""    _chatSub = _firestore.collection('chats').doc(widget.chatId).snapshots().listen((snapshot) {"""
              # inject listener inside existing callback after data/uid line
              line="""      final data = snapshot.data() ?? <String, dynamic>{}; final uid = _auth.currentUser?.uid; final mutedFor = data['mutedFor']; final pinnedFor = data['pinnedFor'];"""
              repl=line+"\n      final typing = data['typing']; final otherId = widget.otherUserId; final otherTyping = typing is Map && typing[otherId] == true; if (mounted && _otherTyping != otherTyping) setState(() => _otherTyping = otherTyping);"
              if line in s: s=s.replace(line,repl,1)
            # show typing line under app bar title via subtitle condition.
            old="Text(_online ? 'متصل الآن' : 'غير متصل', style: TextStyle(fontSize: 11, color: _online ? Colors.green : Colors.grey))"
            new="Text(_otherTyping ? 'يكتب الآن...' : (_online ? 'متصل الآن' : 'غير متصل'), style: TextStyle(fontSize: 11, color: _otherTyping ? AppColors.primary : (_online ? Colors.green : Colors.grey)))"
            if old in s: s=s.replace(old,new,1)
            # Wire typing callback into input bar.
            old="ChatInputBar(chatId: widget.chatId, onSendMessage: (_) { if (_replyingTo != null) _clearReply(); }, onSendImage: (_) {}, onLocalMedia: _addLocalMedia, onShareLocation: _shareLocation)"
            new="ChatInputBar(chatId: widget.chatId, onSendMessage: (_) { unawaited(_setTyping(false)); if (_replyingTo != null) _clearReply(); }, onTyping: _setTyping, onSendImage: (_) {}, onLocalMedia: _addLocalMedia, onShareLocation: _shareLocation)"
            if old in s: s=s.replace(old,new,1)
            s=s.replace('  @override void dispose() { _pendingRefreshTimer?.cancel();', '  @override void dispose() { _pendingRefreshTimer?.cancel(); _typingClearTimer?.cancel(); unawaited(_setTyping(false));',1)
            write(p,s)

          # Chat input: debounce typing state and expose callback.
          p=Path('lib/presentation/screens/chat/widgets/chat_input_bar.dart')
          if p.exists():
            s=read(p)
            if 'final Function(bool)? onTyping;' not in s:
              s=s.replace('  final VoidCallback? onShareLocation;', '  final VoidCallback? onShareLocation;\n  final Function(bool)? onTyping;',1)
              s=s.replace('    this.onShareLocation,', '    this.onShareLocation,\n    this.onTyping,',1)
            if 'Timer? _typingTimer;' not in s: s=s.replace('  Timer? _timer;', '  Timer? _timer;\n  Timer? _typingTimer;',1)
            old="""  void _onTextChanged() {\n    if (mounted) setState(() {});\n  }"""
            new="""  void _onTextChanged() {\n    if (mounted) setState(() {});\n    if (_controller.text.trim().isNotEmpty) {\n      widget.onTyping?.call(true);\n      _typingTimer?.cancel();\n      _typingTimer = Timer(const Duration(seconds: 2), () => widget.onTyping?.call(false));\n    } else {\n      _typingTimer?.cancel();\n      widget.onTyping?.call(false);\n    }\n  }"""
            if old in s: s=s.replace(old,new,1)
            s=s.replace('    _timer?.cancel();\n    _controller.dispose();', '    _timer?.cancel();\n    _typingTimer?.cancel();\n    widget.onTyping?.call(false);\n    _controller.dispose();',1)
            write(p,s)

          # FCM: keep a token set as well as the legacy single token, allowing multi-device delivery.
          p=Path('lib/core/services/fcm_token_service.dart')
          if p.exists():
            s=read(p)
            s=s.replace("'fcmToken': token,\n        'lastTokenUpdate':", "'fcmToken': token,\n        'fcmTokens': FieldValue.arrayUnion([token]),\n        'lastTokenUpdate':",1)
            write(p,s)

          # Health/Family screens: real navigable UI instead of placeholders.
          screens={
            'lib/presentation/screens/health/womens_health_screen.dart':("صحة المرأة","متابعة الدورة والصحة النسائية",['متابعة الدورة','مؤشرات صحية','تذكيرات الفحوصات','مواعيد الطبيبة']),
            'lib/presentation/screens/health/pregnancy_follow_up_screen.dart':("متابعة الحمل","متابعة الحمل أسبوعاً بأسبوع",['أسبوع الحمل','موعد الولادة المتوقع','الفحوصات القادمة','التذكيرات الصحية']),
            'lib/presentation/screens/health/child_health_screen.dart':("صحة الطفل","متابعة النمو والتطعيمات والمواعيد",['النمو والتطور','التطعيمات','المواعيد الطبية','التغذية']),
          }
          for path,(title,sub,items) in screens.items():
            p=Path(path); p.parent.mkdir(parents=True,exist_ok=True)
            if not p.exists():
              cards=''.join([f"""            _item(context, '{x}', {['Icons.calendar_month_outlined','Icons.favorite_outline','Icons.notifications_none','Icons.medical_services_outlined'][i%4]}),\n""" for i,x in enumerate(items)])
              code=f"""import 'package:flutter/material.dart';\nimport 'package:sehatak/core/constants/app_colors.dart';\n\nclass {p.stem.title().replace('_','')} extends StatelessWidget {{\n  const {p.stem.title().replace('_','')}({{super.key}});\n  @override Widget build(BuildContext context) {{\n    final dark=Theme.of(context).brightness==Brightness.dark;\n    return Scaffold(backgroundColor: dark?const Color(0xFF0B1121):const Color(0xFFF8FAFC), appBar: AppBar(title: const Text('{title}'), backgroundColor: AppColors.primary, foregroundColor: Colors.white), body: ListView(padding: const EdgeInsets.all(16), children: [\n      Container(padding: const EdgeInsets.all(20), decoration: BoxDecoration(color: AppColors.primary.withOpacity(.10), borderRadius: BorderRadius.circular(22)), child: const Row(children: [CircleAvatar(radius: 28, backgroundColor: AppColors.primary, child: Icon(Icons.health_and_safety_outlined,color:Colors.white)), SizedBox(width:14), Expanded(child: Text('{sub}', style: TextStyle(fontSize:17,fontWeight:FontWeight.w800)))])),\n      const SizedBox(height:16),\n{cards}    ]));\n  }}\n  Widget _item(BuildContext context,String title,IconData icon)=>Card(elevation:0,margin:const EdgeInsets.only(bottom:10),child:ListTile(leading:CircleAvatar(backgroundColor:AppColors.primary.withOpacity(.10),child:Icon(icon,color:AppColors.primary)),title:Text(title,style:const TextStyle(fontWeight:FontWeight.w700)),subtitle:const Text('قيد التطوير — سيتم تفعيل هذه الخدمة مع حفظ بياناتك الصحية.'),trailing:const Icon(Icons.chevron_left),onTap:()=>ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('هذه الخدمة قيد التطوير حالياً.')))));\n}}\n"""
              write(p,code)

          # Wire the new family-health screens from More and All Services.
          p=Path('lib/presentation/screens/more/more_screen.dart')
          if p.exists():
            s=read(p)
            if 'womens_health_screen.dart' not in s: s=s.replace("import 'package:sehatak/presentation/screens/family_planning/family_planning_screen.dart';", "import 'package:sehatak/presentation/screens/family_planning/family_planning_screen.dart';\nimport 'package:sehatak/presentation/screens/health/womens_health_screen.dart';\nimport 'package:sehatak/presentation/screens/health/pregnancy_follow_up_screen.dart';\nimport 'package:sehatak/presentation/screens/health/child_health_screen.dart';",1)
            s=s.replace("'screen': const FamilyPlanningScreen()},\n          {'icon': 'assets/images/childhealth.png', 'title': 'نمو الطفل', 'subtitle': 'مراحل التطور', 'screen': const FamilyPlanningScreen()},", "'screen': const WomensHealthScreen()},\n          {'icon': 'assets/images/childhealth.png', 'title': 'نمو الطفل', 'subtitle': 'مراحل التطور', 'screen': const ChildHealthScreen()},",1)
            s=s.replace("'icon': 'assets/images/pregnancy_follow_up.png', 'title': 'متابعة الحمل', 'subtitle': 'أسابيع الحمل بدقة', 'screen': const FamilyPlanningScreen()", "'icon': 'assets/images/pregnancy_follow_up.png', 'title': 'متابعة الحمل', 'subtitle': 'أسابيع الحمل بدقة', 'screen': const PregnancyFollowUpScreen()",1)
            write(p,s)

          # Insurance: make every primary action functional and remove the empty button.
          p=Path('lib/presentation/screens/insurance/insurance_companies.dart')
          if p.exists():
            s=read(p)
            s=s.replace('onPressed: () {},', "onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => const SubscriptionsScreen())),",1)
            write(p,s)

          # Video consultation: route the actual call action into the existing CallScreen instead of simulated dialogs.
          p=Path('lib/presentation/screens/video_consultation/video_consultation_screen.dart')
          if p.exists():
            s=read(p)
            if "firebase_auth" not in s: s=s.replace("import 'package:flutter/material.dart';", "import 'package:flutter/material.dart';\nimport 'package:firebase_auth/firebase_auth.dart';\nimport 'package:sehatak/core/services/chat_service.dart';\nimport 'package:sehatak/core/models/call_model.dart';\nimport 'package:sehatak/core/services/call_service.dart';\nimport 'package:sehatak/presentation/screens/call/call_screen.dart';",1)
            # Replace the simulated connected dialog's video/audio actions with actual navigation where possible.
            s=s.replace("ToastService.showSuccess('✅ بدء الاستشارة مع ${doctor['name']}');", "_startRealCall(doctor, true);")
            s=s.replace("ToastService.showSuccess('📞 بدء المكالمة الصوتية مع ${doctor['name']}');", "_startRealCall(doctor, false);")
            if 'Future<void> _startRealCall' not in s:
              marker='  @override\n  Widget build(BuildContext context) {'
              helper="""  Future<void> _startRealCall(Map<String,dynamic> doctor,bool video) async {\n    final me=FirebaseAuth.instance.currentUser;\n    final doctorId=(doctor['userId'] ?? doctor['id'] ?? '').toString();\n    if(me==null || doctorId.isEmpty || doctorId==me.uid){ ToastService.showError('حساب الطبيب غير صالح للمكالمة'); return; }\n    try {\n      final data=await FirebaseFirestore.instance.collection('users').doc(me.uid).get();\n      final chatId=await ChatService().createChat(doctorId:doctorId,doctorName:doctor['name'].toString(),patientName:(data.data()?['name'] ?? me.displayName ?? 'مستخدم').toString(),doctorImage:doctor['image']?.toString(),patientImage:me.photoURL);\n      final call=await CallService().initiateCall(receiverId:doctorId,receiverName:doctor['name'].toString(),receiverPhotoUrl:doctor['image']?.toString(),type:video?CallType.video:CallType.audio,chatId:chatId);\n      if(!mounted || call==null)return;\n      await Navigator.push(context,MaterialPageRoute(builder:(_)=>CallScreen(chatId:chatId,doctorName:doctor['name'].toString(),doctorId:doctorId,doctorImage:doctor['image']?.toString(),isVideo:video,isOutgoing:true)));\n    }catch(e){ if(mounted) ToastService.showError('تعذر بدء المكالمة: $e'); }\n  }\n\n"""
              if marker in s:
                s=s.replace(marker,helper+marker,1)
            # ensure Firestore import
            if 'cloud_firestore' not in s: s=s.replace("import 'package:firebase_auth/firebase_auth.dart';", "import 'package:firebase_auth/firebase_auth.dart';\nimport 'package:cloud_firestore/cloud_firestore.dart';",1)
            write(p,s)

          # Functions: send to all known device tokens, not only the legacy fcmToken field.
          p=Path('functions/chat_notifications.js')
          if p.exists():
            s=read(p)
            old="""  const token=snap.data()?.fcmToken;\n  if(!token)return;\n  try{\n    const type=String(payload.data?.type||'');"""
            new="""  const userData=snap.data()||{};\n  const tokens=[...(Array.isArray(userData.fcmTokens)?userData.fcmTokens:[]), userData.fcmToken].map(v=>String(v||'').trim()).filter(Boolean);\n  if(!tokens.length)return;\n  try{\n    const type=String(payload.data?.type||'');"""
            if old in s:
              s=s.replace(old,new,1)
              # replace single token send block with multicast-compatible loop, preserving cleanup.
              s=s.replace("""      token:String(token).trim(),\n      data:Object.fromEntries""", """      tokens,\n      data:Object.fromEntries""",1)
              s=s.replace("await admin.messaging().send(message);", "const response=await admin.messaging().sendEachForMulticast(message);\n    if(response.failureCount){ console.warn(`FCM multicast failures for ${uid}: ${response.failureCount}`); }",1)
            write(p,s)

          print('repairs applied')
          PY
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib functions
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'fix(app): repair chat calls media health services'
            git push
          fi
