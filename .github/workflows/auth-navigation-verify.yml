name: "🔎 Verify Auth → Home Navigation"

on:
  push:
    branches: [ master ]
    paths:
      - "lib/main.dart"
      - "lib/app_router.dart"
      - "lib/presentation/screens/auth/**"
      - "lib/presentation/screens/home/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/auth-navigation-verify.yml"

permissions:
  contents: read

jobs:
  navigation-audit:
    name: "🧭 Audit Auth → Home ownership"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5

      - name: "🔍 Verify Router ownership"
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Auth → Home navigation audit ==="
          echo
          echo "[1] MaterialApp.router"
          grep -n "routerConfig: AppRouter.router" lib/main.dart
          echo
          echo "[2] GoRouter auth refresh"
          grep -n "authStateChanges()" lib/app_router.dart
          echo
          echo "[3] Home route"
          grep -n "path: home" lib/app_router.dart
          echo
          echo "[4] Direct post-auth navigation in main.dart"
          if grep -nE "_navigateAfterSignInFast|pushAndRemoveUntil\\(.*HomeScreen|MaterialPageRoute\\(builder:.*HomeScreen" lib/main.dart; then
            echo
            echo "❌ Direct Auth → Home navigation still exists in main.dart."
            exit 1
          fi
          echo
          echo "✅ No direct post-auth Home navigation detected in main.dart."

  flutter-verify:
    name: "💙 Analyze + APK build"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5

      - name: "☕ Setup Java 17"
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: "💙 Setup Flutter 3.16.0"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.0"
          channel: stable
          cache: true

      - name: "📦 Flutter pub get"
        run: flutter pub get
      - name: "🔐 Prepare production release keystore"
        shell: bash
        env:
          SEHATAK_KEYSTORE_BASE64: ${{ secrets.SEHATAK_KEYSTORE_BASE64 }}
          SEHATAK_KEYSTORE_PASSWORD: ${{ secrets.SEHATAK_KEYSTORE_PASSWORD }}
          SEHATAK_KEY_ALIAS: ${{ secrets.SEHATAK_KEY_ALIAS }}
          SEHATAK_KEY_PASSWORD: ${{ secrets.SEHATAK_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${SEHATAK_KEYSTORE_BASE64:?SEHATAK_KEYSTORE_BASE64 is missing}"
          : "${SEHATAK_KEYSTORE_PASSWORD:?SEHATAK_KEYSTORE_PASSWORD is missing}"
          : "${SEHATAK_KEY_ALIAS:?SEHATAK_KEY_ALIAS is missing}"
          : "${SEHATAK_KEY_PASSWORD:?SEHATAK_KEY_PASSWORD is missing}"

          rm -rf android/keystore
          mkdir -p android/keystore
          printf '%s' "${SEHATAK_KEYSTORE_BASE64}" | base64 --decode > android/keystore/sehatak-release.jks
          test -s android/keystore/sehatak-release.jks
          chmod 600 android/keystore/sehatak-release.jks

          keytool -list -keystore android/keystore/sehatak-release.jks \
            -storepass "${SEHATAK_KEYSTORE_PASSWORD}" \
            -alias "${SEHATAK_KEY_ALIAS}" >/dev/null

          {
            echo "SEHATAK_KEYSTORE_FILE=${GITHUB_WORKSPACE}/android/keystore/sehatak-release.jks"
            echo "SEHATAK_KEYSTORE_PASSWORD=${SEHATAK_KEYSTORE_PASSWORD}"
            echo "SEHATAK_KEY_ALIAS=${SEHATAK_KEY_ALIAS}"
            echo "SEHATAK_KEY_PASSWORD=${SEHATAK_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

          echo "✅ Production release keystore validated and configured."


      - name: "🧪 Flutter analyze (diagnostic)"
        continue-on-error: true
        run: flutter analyze

      - name: "🧹 Clean Gradle/D8 transform state"
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          rm -rf ~/.gradle/caches/transforms-*
          rm -rf ~/.gradle/caches/*/fileHashes
          cd android
          ./gradlew --stop || true

      - name: "🔨 Build release APK (proven Android path)"
        run: flutter build apk --release --no-shrink
