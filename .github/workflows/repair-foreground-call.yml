name: Repair Foreground Calls
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/repair-foreground-call.yml'
  workflow_dispatch:
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Patch foreground call handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart'); s=p.read_text(encoding='utf-8')
          old="""      if (callId != null && callId.isNotEmpty) await _notificationService.showIncomingCallNotification(callerName: message.data['callerName']?.toString() ?? message.notification?.title ?? 'مكالمة واردة', callId: callId, isVideo: message.data['isVideo']?.toString() == 'true' || message.data['callType']?.toString() == 'video', silent: true);\n      return;"""
          new="""      if (callId != null && callId.isNotEmpty) {\n        await _notificationService.showIncomingCallNotification(callerName: message.data['callerName']?.toString() ?? message.notification?.title ?? 'مكالمة واردة', callId: callId, isVideo: message.data['isVideo']?.toString() == 'true' || message.data['callType']?.toString() == 'video', silent: true);\n        if (mounted) {\n          await _callService.handleIncomingCall(context, message);\n        }\n      }\n      return;"""
          if old in s:
            p.write_text(s.replace(old,new,1),encoding='utf-8')
          else:
            print('foreground call block already patched or changed')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'fix(calls): show incoming call screen in foreground'; git push; fi
