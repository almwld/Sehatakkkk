name: Apply Home Local Icons

on:
  push:
    paths:
      - '.github/workflows/apply_home_local_icons.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Replace Home section Material icons
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lib/presentation/screens/home/tabs/home_tab.dart')
          text = path.read_text(encoding='utf-8')

          def method_block(source, start_name, end_name):
              start = source.index(f'Widget {start_name}')
              end = source.index(f'Widget {end_name}', start)
              return start, end

          def replace_material_icons(block, asset, size=30):
              pattern = re.compile(r'(?:const\s+)?Icon\s*\(')
              pos = 0
              out = []
              while True:
                  m = pattern.search(block, pos)
                  if not m:
                      out.append(block[pos:])
                      break
                  out.append(block[pos:m.start()])
                  i = m.end()
                  while i < len(block) and block[i].isspace():
                      i += 1
                  if not block.startswith('Icons.', i):
                      out.append(block[m.start():m.end()])
                      pos = m.end()
                      continue
                  depth = 1
                  j = i
                  quote = None
                  escaped = False
                  while j < len(block) and depth:
                      c = block[j]
                      if quote:
                          if escaped:
                              escaped = False
                          elif c == '\\':
                              escaped = True
                          elif c == quote:
                              quote = None
                      else:
                          if c in "'\"":
                              quote = c
                          elif c == '(':
                              depth += 1
                          elif c == ')':
                              depth -= 1
                      j += 1
                  if depth != 0:
                      raise RuntimeError('Unbalanced Icon(...) in HomeTab')
                  out.append(f"Image.asset('{asset}', width: {size}, height: {size}, fit: BoxFit.contain)")
                  pos = j
              return ''.join(out)

          ranges = []
          for start_name, end_name, asset in [
              ('_tips(', '_discover(', 'assets/images/services/health_tips.png'),
              ('_discover(', '_weather(', 'assets/images/services/medical_articles.png'),
              ('_weather(', '_community(', 'assets/svg/home_weather.svg'),
          ]:
              s, e = method_block(text, start_name, end_name)
              ranges.append((s, e, asset))

          for s, e, asset in reversed(ranges):
              text = text[:s] + replace_material_icons(text[s:e], asset) + text[e:]

          path.write_text(text, encoding='utf-8')

          # Fail the job if any Material Icon remains inside the three target methods.
          for start_name, end_name, _ in [
              ('_tips(', '_discover(', ''),
              ('_discover(', '_weather(', ''),
              ('_weather(', '_community(', ''),
          ]:
              s, e = method_block(text, start_name, end_name)
              if 'Icons.' in text[s:e]:
                  raise RuntimeError(f'Material Icons still remain in {start_name}')

      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/screens/home/tabs/home_tab.dart
          git rm .github/workflows/apply_home_local_icons.yml
          git commit -m "feat(home): replace tips discover and weather icons with local assets"
          git push origin HEAD:master
