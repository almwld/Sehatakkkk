name: Patch Home Sections

on:
  push:
    paths:
      - '.github/workflows/patch-home-sections.yml'
      - 'lib/presentation/widgets/unified_search_bar.dart'
      - 'scripts/fix_startup_auth_flow.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Apply startup auth repair
        run: python3 scripts/fix_startup_auth_flow.py

      - name: Verify startup auth repair
        shell: bash
        run: |
          set -euo pipefail
          if grep -n "_navigateAfterSignInFast" lib/main.dart; then
            echo "ERROR: legacy startup navigation still exists"
            exit 1
          fi
          if grep -n "collection('users')" lib/presentation/screens/auth/auth_screen.dart | grep -q .; then
            echo "ERROR: auth screen still contains a users collection read"
            exit 1
          fi
          grep -n "signInWithEmailAndPassword" lib/presentation/screens/auth/auth_screen.dart
          grep -n "authStateChanges" lib/main.dart

      - name: Patch HomeTab
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/presentation/screens/home/tabs/home_tab.dart')
          text = path.read_text(encoding='utf-8')

          for name in ('calendar_booking', 'emergency', 'map_location', 'packages'):
              text = text.replace(
                  f'assets/icons/services/{name}.png',
                  f'assets/images/services/{name}.png',
              )

          discover_start = text.find('  Widget _discover(bool dark) {')
          if discover_start != -1:
              items_start = text.find('    final items = [', discover_start)
              items_end = text.find('    ];', items_start)
              if items_start != -1 and items_end != -1:
                  new_items = """    final items = [
      {'name': 'حجز موعد', 'asset': 'assets/images/services/calendar_booking.png', 'route': AppRouter.appointments},
      {'name': 'السجلات الطبية', 'asset': 'assets/images/services/medical_records.png', 'route': AppRouter.dashboard},
      {'name': 'مجتمع صحتك', 'asset': 'assets/images/services/medical_community.png', 'route': AppRouter.community},
      {'name': 'باقات', 'asset': 'assets/images/services/packages.png', 'route': AppRouter.services},
    ];"""
                  text = text[:items_start] + new_items + text[items_end + len('    ];'):]

          path.write_text(text, encoding='utf-8')
          print('HomeTab asset/discover patch completed')
          PY

      - name: Verify HomeTab
        run: |
          grep -n "مقالات طبية\|نصائح اليوم\|مجتمع صحتك" lib/presentation/screens/home/tabs/home_tab.dart || true
          grep -n "assets/images/services/calendar_booking.png" lib/presentation/screens/home/tabs/home_tab.dart || true

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/presentation/screens/auth/auth_screen.dart lib/presentation/screens/home/tabs/home_tab.dart
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix(auth): make login non-blocking and centralize routing"
          git push origin master
