# Build-repair automation for the current master branch.
name: Repair current Dart build errors

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Dart syntax and missing dental screens
        shell: python
        run: |
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              if not p.exists():
                  return
              s = p.read_text()
              original = s
              for old, new in replacements:
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s)

          edit('lib/presentation/screens/more/more_screen.dart', [("_buildLogoutButton(isDark)]));}", "_buildLogoutButton(isDark)])));}")])
          edit('lib/presentation/screens/home/widgets/quick_services_widget.dart', [("_buildServiceItem(context,_services[index])));", "_buildServiceItem(context,_services[index]))));")])
          for f in [
              'lib/presentation/screens/dental/dental_health_screen.dart','lib/presentation/screens/eye/eye_health_screen.dart','lib/presentation/screens/pregnancy/pregnancy_health_screen.dart','lib/presentation/screens/women/women_health_screen.dart','lib/presentation/screens/child/child_health_screen.dart']:
              edit(f, [(']));});}', '])));});}'), ('])));}}', '])));}')])
          for f in Path('lib/presentation/screens').glob('**/*.dart'):
              if any(x in str(f) for x in ['/eye/','/pregnancy/','/women/','/child/']):
                  edit(str(f), [('}));}}', '}));}')])
          for f in ['lib/bloc/pregnancy/pregnancy_bloc.dart','lib/bloc/women/women_bloc.dart','lib/bloc/child/child_bloc.dart']:
              edit(f, [('service.streamHospitals(limit:10)', 'service.streamHospitals(limit:10).first')])
          edit('lib/presentation/screens/eye/eye_consultation_screen.dart', [("children:items.map((d)=>Card(child:ExpansionTile(title:Text(d.question),subtitle:Text(d.status=='answered'?'تم الرد':'قيد الانتظار'),children:[if(d.answer!=null)Padding(padding:const EdgeInsets.all(16),child:Text(d.answer!))])).toList());})", "children:items.map((d)=>Card(child:ExpansionTile(title:Text(d.question),subtitle:Text(d.status=='answered'?'تم الرد':'قيد الانتظار'),children:[if(d.answer!=null)Padding(padding:const EdgeInsets.all(16),child:Text(d.answer!))]))).toList());})")])
          edit('lib/presentation/widgets/specialty/child_growth_tracker_card.dart', [(']));} }', '])));}')])
          edit('lib/presentation/widgets/specialty/vaccination_schedule.dart', [(')));}}', ')));}')])
          dental = Path('lib/presentation/screens/dental')
          # Dental screens are created by the preceding repair commit and remain untouched here.
          for p in dental.glob('*.dart'):
              pass

      - name: Commit repaired sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib .github/workflows/repair-build-errors.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(build): final Dart syntax cleanup'
          git push origin HEAD:master
