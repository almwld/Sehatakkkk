name: Repair current Dart build errors

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Dart syntax and missing dental screens
        shell: python
        run: |
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              if not p.exists():
                  return
              s = p.read_text()
              original = s
              for old, new in replacements:
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s)

          # Files whose generated one-line Dart lost one closing delimiter.
          edit('lib/presentation/screens/more/more_screen.dart', [
              ("_buildLogoutButton(isDark)]));}\n", "_buildLogoutButton(isDark)])));}\n"),
          ])
          edit('lib/presentation/screens/home/widgets/quick_services_widget.dart', [
              ("_buildServiceItem(context,_services[index])));", "_buildServiceItem(context,_services[index]))));"),
          ])

          health = [
              'lib/presentation/screens/dental/dental_health_screen.dart',
              'lib/presentation/screens/eye/eye_health_screen.dart',
              'lib/presentation/screens/pregnancy/pregnancy_health_screen.dart',
              'lib/presentation/screens/women/women_health_screen.dart',
              'lib/presentation/screens/child/child_health_screen.dart',
          ]
          for f in health:
              edit(f, [
                  (']));});}', '])));});}'),
                  ('])););}', ']))););'),
              ])

          # StreamBuilder-based list/detail screens had one extra class brace.
          for f in [
              'lib/presentation/screens/eye/eye_doctor_detail_screen.dart',
              'lib/presentation/screens/eye/eye_clinic_detail_screen.dart',
              'lib/presentation/screens/pregnancy/pregnancy_doctors_screen.dart',
              'lib/presentation/screens/pregnancy/pregnancy_doctor_detail_screen.dart',
              'lib/presentation/screens/pregnancy/pregnancy_clinics_screen.dart',
              'lib/presentation/screens/pregnancy/pregnancy_clinic_detail_screen.dart',
              'lib/presentation/screens/pregnancy/pregnancy_tips_screen.dart',
              'lib/presentation/screens/pregnancy/pregnancy_hospitals_screen.dart',
              'lib/presentation/screens/pregnancy/pregnancy_consultation_screen.dart',
              'lib/presentation/screens/pregnancy/pregnancy_tracker_screen.dart',
              'lib/presentation/screens/women/women_doctors_screen.dart',
              'lib/presentation/screens/women/women_doctor_detail_screen.dart',
              'lib/presentation/screens/women/women_clinics_screen.dart',
              'lib/presentation/screens/women/women_clinic_detail_screen.dart',
              'lib/presentation/screens/women/women_tips_screen.dart',
              'lib/presentation/screens/women/women_hospitals_screen.dart',
              'lib/presentation/screens/women/women_consultation_screen.dart',
              'lib/presentation/screens/child/child_doctors_screen.dart',
              'lib/presentation/screens/child/child_doctor_detail_screen.dart',
              'lib/presentation/screens/child/child_clinics_screen.dart',
              'lib/presentation/screens/child/child_clinic_detail_screen.dart',
              'lib/presentation/screens/child/child_tips_screen.dart',
              'lib/presentation/screens/child/child_hospitals_screen.dart',
              'lib/presentation/screens/child/child_consultation_screen.dart',
              'lib/presentation/screens/child/child_growth_tracker_screen.dart',
          ]:
              edit(f, [('}));}}', '}));}')])

          edit('lib/presentation/widgets/specialty/child_growth_tracker_card.dart', [
              ("_v('الوزن',tracker?.weight==null?'--':'${tracker!.weight!.toStringAsFixed(1)} كجم')]))]))));}", "_v('الوزن',tracker?.weight==null?'--':'${tracker!.weight!.toStringAsFixed(1)} كجم')]))])));}"),
              ('Text(a,style:const TextStyle(fontSize:11))]));}}', 'Text(a,style:const TextStyle(fontSize:11))]));}'),
          ])
          edit('lib/presentation/widgets/specialty/vaccination_schedule.dart', [
              ("subtitle:Text(e.$2))) ])));}}", "subtitle:Text(e.$2))) ])));}"),
          ])

          edit('lib/presentation/screens/eye/eye_consultation_screen.dart', [
              ("return Column(children:items.map((d)=>Card(child:ExpansionTile(title:Text(d.question),subtitle:Text(d.status=='answered'?'تم الرد':'قيد الانتظار'),children:[if(d.answer!=null)Padding(padding:const EdgeInsets.all(16),child:Text(d.answer!))])).toList());})", "return Column(children:items.map((d)=>Card(child:ExpansionTile(title:Text(d.question),subtitle:Text(d.status=='answered'?'تم الرد':'قيد الانتظار'),children:[if(d.answer!=null)Padding(padding:const EdgeInsets.all(16),child:Text(d.answer!))]))).toList());})"),
          ])

          for f in [
              'lib/bloc/pregnancy/pregnancy_bloc.dart',
              'lib/bloc/child/child_bloc.dart',
          ]:
              edit(f, [("service.streamHospitals(limit:10)", "service.streamHospitals(limit:10).first")])
          edit('lib/bloc/women/women_bloc.dart', [
              ("service.streamHospitals(limit:10)", "service.streamHospitals(limit:10).first")
          ])

          # The dental router references seven screens that were never committed.
          dental = Path('lib/presentation/screens/dental')
          dental.mkdir(parents=True, exist_ok=True)
          files = {
            'dental_doctors_screen.dart': '''import 'package:flutter/material.dart';\nimport 'package:go_router/go_router.dart';\nimport 'package:sehatak/app_router.dart';\nimport 'package:sehatak/core/models/dental/dental_models.dart';\nimport 'package:sehatak/core/services/dental_service.dart';\nclass DentalDoctorsScreen extends StatelessWidget { const DentalDoctorsScreen({super.key}); @override Widget build(BuildContext context) => Scaffold(appBar: AppBar(title: const Text('أطباء الأسنان')),body: StreamBuilder<List<DentalDoctor>>(stream: DentalService().streamDoctors(),builder:(context,s){if(!s.hasData)return const Center(child:CircularProgressIndicator());final data=s.data!;return ListView.builder(itemCount:data.length,itemBuilder:(_,i){final d=data[i];return Card(child:ListTile(onTap:()=>context.push(AppRouter.dentalDoctorDetail.replaceFirst(':id',d.id)),title:Text(d.name),subtitle:Text('${d.specialty} • ${d.experienceYears} سنوات خبرة'),trailing:Text('★${d.rating.toStringAsFixed(1)}')));});}));} }\n''',
            'dental_doctor_detail_screen.dart': '''import 'package:flutter/material.dart';\nimport 'package:sehatak/core/models/dental/dental_models.dart';\nimport 'package:sehatak/core/services/dental_service.dart';\nclass DentalDoctorDetailScreen extends StatelessWidget { final String doctorId; const DentalDoctorDetailScreen({super.key,required this.doctorId}); @override Widget build(BuildContext context)=>Scaffold(appBar:AppBar(title:const Text('تفاصيل طبيب الأسنان')),body:FutureBuilder<DentalDoctor?>(future:DentalService().getDoctor(doctorId),builder:(context,s){if(!s.hasData)return const Center(child:CircularProgressIndicator());final d=s.data;if(d==null)return const Center(child:Text('الطبيب غير متوفر'));return ListView(padding:const EdgeInsets.all(16),children:[Text(d.name,textAlign:TextAlign.center,style:const TextStyle(fontSize:22,fontWeight:FontWeight.bold)),Text(d.specialty,textAlign:TextAlign.center),Text('التقييم: ${d.rating.toStringAsFixed(1)}'),Text('الخبرة: ${d.experienceYears} سنة'),Text('العنوان: ${d.address}'),Text('الهاتف: ${d.phone}')]);}));} }\n''',
            'dental_clinics_screen.dart': '''import 'package:flutter/material.dart';\nimport 'package:go_router/go_router.dart';\nimport 'package:sehatak/app_router.dart';\nimport 'package:sehatak/core/models/dental/dental_models.dart';\nimport 'package:sehatak/core/services/dental_service.dart';\nclass DentalClinicsScreen extends StatelessWidget { const DentalClinicsScreen({super.key}); @override Widget build(BuildContext context)=>Scaffold(appBar:AppBar(title:const Text('عيادات الأسنان')),body:StreamBuilder<List<DentalClinic>>(stream:DentalService().streamClinics(),builder:(context,s){if(!s.hasData)return const Center(child:CircularProgressIndicator());return ListView(padding:const EdgeInsets.all(12),children:s.data!.map((d)=>Card(child:ListTile(onTap:()=>context.push(AppRouter.dentalClinicDetail.replaceFirst(':id',d.id)),title:Text(d.name),subtitle:Text(d.address),trailing:Text(d.isOpen?'مفتوح':'مغلق')))).toList());}));} }\n''',
            'dental_clinic_detail_screen.dart': '''import 'package:flutter/material.dart';\nimport 'package:sehatak/core/models/dental/dental_models.dart';\nimport 'package:sehatak/core/services/dental_service.dart';\nclass DentalClinicDetailScreen extends StatelessWidget { final String clinicId; const DentalClinicDetailScreen({super.key,required this.clinicId}); @override Widget build(BuildContext context)=>Scaffold(appBar:AppBar(title:const Text('تفاصيل عيادة الأسنان')),body:FutureBuilder<DentalClinic?>(future:DentalService().getClinic(clinicId),builder:(context,s){if(!s.hasData)return const Center(child:CircularProgressIndicator());final d=s.data;if(d==null)return const Center(child:Text('العيادة غير متوفرة'));return ListView(padding:const EdgeInsets.all(16),children:[Text(d.name,style:const TextStyle(fontSize:22,fontWeight:FontWeight.bold)),Text(d.address),Text('الهاتف: ${d.phone}'),Text('التقييم: ${d.rating.toStringAsFixed(1)}'),Text(d.isOpen?'مفتوح الآن':'مغلق الآن')]);}));} }\n''',
            'dental_tips_screen.dart': '''import 'package:flutter/material.dart';\nimport 'package:sehatak/core/services/dental_service.dart';\nclass DentalTipsScreen extends StatelessWidget { const DentalTipsScreen({super.key}); @override Widget build(BuildContext context)=>Scaffold(appBar:AppBar(title:const Text('نصائح صحة الأسنان')),body:StreamBuilder(stream:DentalService().streamTips(limit:30),builder:(context,s){if(!s.hasData)return const Center(child:CircularProgressIndicator());return ListView(padding:const EdgeInsets.all(16),children:s.data!.map((d)=>Card(child:ExpansionTile(title:Text(d.title),subtitle:Text(d.category),children:[Padding(padding:const EdgeInsets.all(16),child:Text(d.body))]))).toList());}));} }\n''',
            'dental_hospitals_screen.dart': '''import 'package:flutter/material.dart';\nimport 'package:sehatak/core/services/dental_service.dart';\nclass DentalHospitalsScreen extends StatelessWidget { const DentalHospitalsScreen({super.key}); @override Widget build(BuildContext context)=>Scaffold(appBar:AppBar(title:const Text('مستشفيات الأسنان والطوارئ')),body:StreamBuilder(stream:DentalService().streamHospitals(limit:20),builder:(context,s){if(!s.hasData)return const Center(child:CircularProgressIndicator());return ListView(padding:const EdgeInsets.all(16),children:s.data!.map((d)=>Card(child:ListTile(leading:Icon(d.emergency?Icons.emergency:Icons.local_hospital,color:d.emergency?Colors.red:Colors.cyan),title:Text(d.name),subtitle:Text('${d.address}\\n${d.phone}')))).toList());}));} }\n''',
            'dental_consultation_screen.dart': '''import 'package:flutter/material.dart';\nimport 'package:firebase_auth/firebase_auth.dart';\nimport 'package:sehatak/core/services/dental_service.dart';\nclass DentalConsultationScreen extends StatefulWidget { const DentalConsultationScreen({super.key}); @override State<DentalConsultationScreen> createState()=>_DentalConsultationState(); }\nclass _DentalConsultationState extends State<DentalConsultationScreen>{final q=TextEditingController();bool saving=false;@override void dispose(){q.dispose();super.dispose();}Future<void> send()async{final u=FirebaseAuth.instance.currentUser;if(u==null)return;if(q.text.trim().isEmpty)return;setState(()=>saving=true);try{await DentalService().createConsultation(userId:u.uid,userName:u.displayName??'مستخدم',doctorId:'',doctorName:'',question:q.text.trim());q.clear();if(mounted)ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content:Text('تم إرسال الاستشارة')));}finally{if(mounted)setState(()=>saving=false);}}@override Widget build(BuildContext context)=>Scaffold(appBar:AppBar(title:const Text('استشارة الأسنان')),body:Padding(padding:const EdgeInsets.all(20),child:Column(children:[TextField(controller:q,maxLines:6,decoration:const InputDecoration(labelText:'اكتب سؤالك',border:OutlineInputBorder())),const SizedBox(height:16),SizedBox(width:double.infinity,child:ElevatedButton(onPressed:saving?null:send,child:Text(saving?'جارٍ الإرسال...':'إرسال الاستشارة')))])));}\n}\n'''
          }
          for name, content in files.items():
              (dental/name).write_text(content)

      - name: Commit repaired sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib .github/workflows/repair-build-errors.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(build): repair Dart syntax and missing dental screens'
          git push origin HEAD:master
