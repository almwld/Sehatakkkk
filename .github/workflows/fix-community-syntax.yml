name: fix-community-syntax
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor == 'almwld'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 2
      - name: Fix exact syntax issue
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/presentation/screens/community/community_screen.dart')
          s = p.read_text(encoding='utf-8')
          old = '  @override\n  void _updateFabVisibility() {'
          new = '  void _updateFabVisibility() {'
          if old not in s:
              raise SystemExit('expected syntax marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-community-syntax.yml').unlink()
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/screens/community/community_screen.dart .github/workflows/fix-community-syntax.yml
          git commit -m "fix(community): correct fab helper override"
          git push origin HEAD:master
