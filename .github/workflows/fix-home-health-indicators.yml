name: Fix home health indicator navigation

on:
  push:
    paths:
      - ".github/workflows/fix-home-health-indicators.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(home): route health indicators to their services'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch exact navigation mappings
        shell: python
        run: |
          from pathlib import Path

          router = Path("lib/app_router.dart")
          text = router.read_text(encoding="utf-8")

          replacements = [
              (
                  "import 'package:sehatak/presentation/screens/heart_rate/heart_rate_screen.dart';",
                  "import 'package:sehatak/presentation/screens/heart_rate/heart_rate_screen.dart';\nimport 'package:sehatak/presentation/screens/blood_pressure/blood_pressure_screen.dart';\nimport 'package:sehatak/presentation/screens/glucose_tracker/glucose_tracker_screen.dart';\nimport 'package:sehatak/presentation/screens/weight_tracker/weight_tracker_screen.dart';\nimport 'package:sehatak/presentation/screens/mental_health/mental_health_screen.dart';\nimport 'package:sehatak/presentation/screens/diet_plan/diet_plan_screen.dart';",
              ),
              (
                  "      heartRate = '/heart-rate',\n      delivery = '/delivery',",
                  "      heartRate = '/heart-rate',\n      bloodPressure = '/blood-pressure',\n      glucoseTracker = '/glucose-tracker',\n      weightTracker = '/weight-tracker',\n      mentalHealth = '/mental-health',\n      dietPlan = '/diet-plan',\n      delivery = '/delivery',",
              ),
              (
                  "      GoRoute(path: heartRate, builder: (_, __) => const HeartRateScreen()),\n      GoRoute(path: delivery, builder: (_, __) => const DeliveryScreen()),",
                  "      GoRoute(path: heartRate, builder: (_, __) => const HeartRateScreen()),\n      GoRoute(path: bloodPressure, builder: (_, __) => const BloodPressureScreen()),\n      GoRoute(path: glucoseTracker, builder: (_, __) => const GlucoseTrackerScreen()),\n      GoRoute(path: weightTracker, builder: (_, __) => const WeightTrackerScreen()),\n      GoRoute(path: mentalHealth, builder: (_, __) => const MentalHealthScreen()),\n      GoRoute(path: dietPlan, builder: (_, __) => const DietPlanScreen()),\n      GoRoute(path: delivery, builder: (_, __) => const DeliveryScreen()),",
              ),
              (
                  "      case heartRate:\n        return MaterialPageRoute(\n            builder: (_) => const HeartRateScreen(), settings: routeSettings);\n      case delivery:",
                  "      case heartRate:\n        return MaterialPageRoute(\n            builder: (_) => const HeartRateScreen(), settings: routeSettings);\n      case bloodPressure:\n        return MaterialPageRoute(\n            builder: (_) => const BloodPressureScreen(), settings: routeSettings);\n      case glucoseTracker:\n        return MaterialPageRoute(\n            builder: (_) => const GlucoseTrackerScreen(), settings: routeSettings);\n      case weightTracker:\n        return MaterialPageRoute(\n            builder: (_) => const WeightTrackerScreen(), settings: routeSettings);\n      case mentalHealth:\n        return MaterialPageRoute(\n            builder: (_) => const MentalHealthScreen(), settings: routeSettings);\n      case dietPlan:\n        return MaterialPageRoute(\n            builder: (_) => const DietPlanScreen(), settings: routeSettings);\n      case delivery:",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected router text not found: {old[:100]}")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one router occurrence: {old[:100]}")
              text = text.replace(old, new)

          router.write_text(text, encoding="utf-8")

          home = Path("lib/presentation/widgets/home/home_health_widgets.dart")
          text = home.read_text(encoding="utf-8")

          old_import = "import 'package:sehatak/core/constants/app_colors.dart';"
          new_import = "import 'package:sehatak/core/constants/app_colors.dart';"
          if old_import not in text:
              raise SystemExit("Expected HomeHealthWidgets imports not found")

          old_map = """  String? _trackerRoute(String name) {
    switch (name) {
      case 'الخطوات': return AppRouter.stepTracker;
      case 'النوم': return AppRouter.sleepTracker;
      case 'النبض': return AppRouter.heartRate;
      default: return null;
    }
  }"""
          new_map = """  String? _trackerRoute(String name) {
    switch (name) {
      case 'ضغط الدم': return AppRouter.bloodPressure;
      case 'سكر الدم': return AppRouter.glucoseTracker;
      case 'اللياقة': return AppRouter.stepTracker;
      case 'الوزن': return AppRouter.weightTracker;
      case 'التغذية': return AppRouter.dietPlan;
      case 'الصحة النفسية': return AppRouter.mentalHealth;
      case 'الخطوات': return AppRouter.stepTracker;
      case 'النوم': return AppRouter.sleepTracker;
      case 'النبض': return AppRouter.heartRate;
      default: return null;
    }
  }"""

          if old_map not in text:
              raise SystemExit("Expected health indicator route map not found")
          if text.count(old_map) != 1:
              raise SystemExit("Expected exactly one health indicator route map")
          text = text.replace(old_map, new_map)

          old_vital = "          onTap: () => onNavigate(AppRouter.dashboard),"
          new_vital = """          onTap: () {
            final route = _trackerRoute(item['label'] as String);
            onNavigate(route ?? AppRouter.dashboard);
          },"""
          if old_vital not in text:
              raise SystemExit("Expected vital onTap not found")
          if text.count(old_vital) != 1:
              raise SystemExit("Expected exactly one vital onTap")
          text = text.replace(old_vital, new_vital)

          home.write_text(text, encoding="utf-8")

          # Verification: every six Home indicators has a dedicated route mapping.
          required = {
              'ضغط الدم': 'AppRouter.bloodPressure',
              'سكر الدم': 'AppRouter.glucoseTracker',
              'اللياقة': 'AppRouter.stepTracker',
              'الوزن': 'AppRouter.weightTracker',
              'التغذية': 'AppRouter.dietPlan',
              'الصحة النفسية': 'AppRouter.mentalHealth',
          }
          for label, route in required.items():
              if f"case '{label}': return {route};" not in home.read_text(encoding="utf-8"):
                  raise SystemExit(f"Missing mapping for {label}")
          print("Exact source patch verification passed.")

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app_router.dart lib/presentation/widgets/home/home_health_widgets.dart
          git rm .github/workflows/fix-home-health-indicators.yml
          git commit -m "fix(home): route health indicators to their services"
          git push
