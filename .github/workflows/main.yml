name: 🚀 Build Sehatak APK
# Release build with signing + Firebase config from secrets.

permissions:
  contents: write

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 💙 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        cache: true

    - name: 🔑 Add google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        set -euo pipefail
        if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
          echo "❌ GOOGLE_SERVICES_JSON secret is missing."
          exit 1
        fi
        printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
        echo "✅ google-services.json created: $(wc -c < android/app/google-services.json) bytes"
        echo "SHA-1 fingerprints found:"
        grep -o '"certificate_hash": "[^"]*"' android/app/google-services.json || echo "(none)"

    - name: 🔐 Prepare Sehatak release keystore
      shell: bash
      env:
        SEHATAK_KEYSTORE_BASE64: ${{ secrets.SEHATAK_KEYSTORE_BASE64 }}
        SEHATAK_KEYSTORE_PASSWORD: ${{ secrets.SEHATAK_KEYSTORE_PASSWORD }}
        SEHATAK_KEY_ALIAS: ${{ secrets.SEHATAK_KEY_ALIAS }}
        SEHATAK_KEY_PASSWORD: ${{ secrets.SEHATAK_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        rm -rf android/keystore
        mkdir -p android/keystore
        if [ -z "${SEHATAK_KEYSTORE_BASE64:-}" ] || [ -z "${SEHATAK_KEYSTORE_PASSWORD:-}" ] || [ -z "${SEHATAK_KEY_ALIAS:-}" ] || [ -z "${SEHATAK_KEY_PASSWORD:-}" ]; then
          echo "❌ Production release signing secrets are incomplete."
          exit 1
        fi
        if ! printf '%s' "${SEHATAK_KEYSTORE_BASE64}" | base64 --decode > android/keystore/sehatak-release.jks 2>/dev/null || ! test -s android/keystore/sehatak-release.jks; then
          rm -f android/keystore/sehatak-release.jks
          echo "❌ Invalid release keystore payload."
          exit 1
        fi
        chmod 600 android/keystore/sehatak-release.jks
        validation_alias="${SEHATAK_KEY_ALIAS}"
        echo "Decoded keystore SHA-256: $(sha256sum android/keystore/sehatak-release.jks | awk '{print $1}')"
        if ! keytool -list -keystore android/keystore/sehatak-release.jks -storepass "${SEHATAK_KEYSTORE_PASSWORD}" >/tmp/ks.txt 2>/tmp/ks.err; then
          echo "❌ Keystore password is invalid."
          rm -f android/keystore/sehatak-release.jks /tmp/ks.txt /tmp/ks.err
          exit 1
        fi
        echo "✅ Keystore password validated."
        if ! grep -Eq "^[[:space:]]*${validation_alias}[[:space:]]*(,|$)" /tmp/ks.txt; then
          echo "❌ Keystore alias is invalid."
          rm -f android/keystore/sehatak-release.jks /tmp/ks.txt /tmp/ks.err
          exit 1
        fi
        echo "✅ Keystore alias validated: ${validation_alias}"
        if ! keytool -certreq -alias "${validation_alias}" -keystore android/keystore/sehatak-release.jks -storepass "${SEHATAK_KEYSTORE_PASSWORD}" -keypass "${SEHATAK_KEY_PASSWORD}" -file android/keystore/.csr >/dev/null 2>&1; then
          rm -f android/keystore/sehatak-release.jks android/keystore/.csr
          echo "❌ Private-key password is invalid."
          exit 1
        fi
        rm -f android/keystore/.csr
        {
          echo "SEHATAK_KEYSTORE_FILE=${GITHUB_WORKSPACE}/android/keystore/sehatak-release.jks"
          echo "SEHATAK_KEYSTORE_PASSWORD=${SEHATAK_KEYSTORE_PASSWORD}"
          echo "SEHATAK_KEY_ALIAS=${validation_alias}"
          echo "SEHATAK_KEY_PASSWORD=${SEHATAK_KEY_PASSWORD}"
        } >> "${GITHUB_ENV}"
        echo "✅ Release keystore validated."

    - name: 🖼️ Convert original PNG assets to alpha-safe lossless WebP
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq webp
        python -m pip install --disable-pip-version-check --quiet Pillow
        python - <<'PY'
        from pathlib import Path
        from PIL import Image
        import subprocess

        root = Path("assets")
        original_conversion = "686fb01557bf60dabecf790e1ca5c79230a409c1"
        original_parent = "a968aed9e66764ba24d59dbd0d2ed8c150ac2de1"
        excluded = {
            "assets/images/sehatak_chat_wallpaper_dark_1080x2160.webp",
            "assets/images/sehatak_chat_wallpaper_light_1080x2160.webp",
        }

        # Rehydrate the exact PNG sources from the pre-conversion commit.
        # -r is required so git diff-tree walks the assets tree recursively.
        subprocess.run(
            ["git", "fetch", "--no-tags", "--depth=1", "origin",
             original_parent, original_conversion],
            check=True,
        )
        deleted = subprocess.check_output(
            [
                "git", "diff-tree", "-r", "--no-commit-id", "--name-only",
                "--diff-filter=D", original_parent, original_conversion,
                "--", "assets",
            ],
            text=True,
        ).splitlines()

        original_pngs = []
        for rel in deleted:
            target = Path(rel)
            if target.suffix.lower() != ".png":
                continue
            target.parent.mkdir(parents=True, exist_ok=True)
            target.write_bytes(
                subprocess.check_output(
                    ["git", "show", f"{original_parent}:{rel}"]
                )
            )
            original_pngs.append(target)

        print(f"Rehydrated {len(original_pngs)} original PNG sources")

        def referenced_in_source(asset: Path) -> bool:
            ref = asset.as_posix()
            result = subprocess.run(
                ["git", "grep", "-F", "--quiet", ref, original_parent, "--",
                 "lib", "pubspec.yaml", "flutter_native_splash.yaml"],
                stdout=subprocess.DEVNULL,
                stderr=subprocess.DEVNULL,
            )
            return result.returncode == 0

        converted = 0
        alpha_converted = 0
        opaque_converted = 0
        saved = 0

        for src in sorted(original_pngs):
            dst = src.with_suffix(".webp")
            if dst.as_posix() in excluded:
                continue

            try:
                with Image.open(src) as opened:
                    opened.load()
                    has_alpha = (
                        "A" in opened.getbands()
                        or "transparency" in opened.info
                        or opened.mode in ("LA", "PA")
                    )
                    image = opened.convert("RGBA" if has_alpha else "RGB")
                    source_size = image.size
                    source_alpha = (
                        image.getchannel("A").getextrema()
                        if has_alpha else None
                    )
                    source_corners = (
                        [image.getpixel(p)[3] for p in (
                            (0, 0),
                            (image.width - 1, 0),
                            (0, image.height - 1),
                            (image.width - 1, image.height - 1),
                        )]
                        if has_alpha else None
                    )

                    # Never use the current WebP as the source. Always write
                    # from the rehydrated original PNG.
                    #
                    # Flutter decodes encoded image bytes by their content. For
                    # alpha-bearing assets we intentionally keep the existing .webp
                    # asset key but store PNG bytes in that key. This bypasses the
                    # Android/WebP alpha decoder path that is producing black
                    # backgrounds on affected devices.
                    if has_alpha:
                        image.save(dst, "PNG", optimize=True)
                    else:
                        subprocess.run([
                            "cwebp", "-quiet", "-lossless", "-m", "6",
                            str(src), "-o", str(dst),
                        ], check=True)

                # Validate before deleting the source PNG.
                with Image.open(dst) as converted_image:
                    converted_image.load()
                    if converted_image.size != source_size:
                        raise RuntimeError(
                            f"Dimension mismatch: {src} -> {dst}"
                        )
                    output_rgba = converted_image.convert("RGBA")
                    output_alpha = (
                        output_rgba.getchannel("A").getextrema()
                        if has_alpha else None
                    )
                    if has_alpha:
                        source_alpha_bytes = image.getchannel("A").tobytes()
                        output_alpha_bytes = output_rgba.getchannel("A").tobytes()
                        if output_alpha_bytes != source_alpha_bytes:
                            raise RuntimeError(f"Alpha channel changed pixel-wise: {src} -> {dst}")
                        if output_alpha != source_alpha:
                            raise RuntimeError(
                                f"Alpha changed: {src} {source_alpha} -> {dst} {output_alpha}"
                            )
                        output_corners = [
                            output_rgba.getpixel(p)[3] for p in (
                                (0, 0),
                                (output_rgba.width - 1, 0),
                                (0, output_rgba.height - 1),
                                (output_rgba.width - 1, output_rgba.height - 1),
                            )
                        ]
                        if output_corners != source_corners:
                            raise RuntimeError(
                                f"Corner alpha changed: {src} {source_corners} -> {dst} {output_corners}"
                            )
                        if output_alpha[0] != source_alpha[0]:
                            raise RuntimeError(
                                f"Alpha lost/changed: {dst}; original minimum alpha was {source_alpha[0]}, output minimum alpha is {output_alpha[0]}"
                            )
                        alpha_converted += 1
                    else:
                        opaque_converted += 1

                old_size = src.stat().st_size
                new_size = dst.stat().st_size
                if new_size < old_size:
                    saved += old_size - new_size

                old_ref = src.as_posix()
                new_ref = dst.as_posix()
                for path in Path(".").rglob("*"):
                    if not path.is_file() or ".git" in path.parts or path in (src, dst):
                        continue
                    try:
                        text = path.read_text(encoding="utf-8")
                    except (UnicodeDecodeError, OSError):
                        continue
                    if old_ref in text:
                        path.write_text(
                            text.replace(old_ref, new_ref),
                            encoding="utf-8",
                        )

                src.unlink()
                converted += 1

            except Exception as exc:
                if referenced_in_source(src):
                    raise RuntimeError(
                        f"Referenced PNG failed safe conversion: {src}: {exc}"
                    ) from exc
                print(f"⚠️ Skipping invalid/unreferenced PNG: {src}: {exc}")
                if dst.exists():
                    dst.unlink()
                src.unlink(missing_ok=True)

        print(
            f"Converted original PNG assets: {converted}; "
            f"alpha-preserved: {alpha_converted}; "
            f"opaque: {opaque_converted}; "
            f"estimated byte savings: {saved}"
        )

        remaining = list(root.rglob("*.png"))
        if remaining:
            raise SystemExit(
                "PNG assets remain under assets/: " +
                ", ".join(map(str, remaining))
            )

        # Final WebP alpha audit. Chat wallpapers are intentionally excluded
        # from icon/background transparency statistics.
        webps = [
            p for p in root.rglob("*.webp")
            if p.as_posix() not in excluded
        ]
        alpha_count = 0
        opaque_count = 0
        transparent_corner_count = 0
        black_corner_candidates = []

        for path in webps:
            with Image.open(path) as opened:
                opened.load()
                rgba = opened.convert("RGBA")
                extrema = rgba.getchannel("A").getextrema()
                corners = [
                    rgba.getpixel(p) for p in (
                        (0, 0),
                        (rgba.width - 1, 0),
                        (0, rgba.height - 1),
                        (rgba.width - 1, rgba.height - 1),
                    )
                ]
                if extrema[0] < 255:
                    alpha_count += 1
                    if any(px[3] == 0 for px in corners):
                        transparent_corner_count += 1
                    if all(px[3] == 255 and px[:3] == (0, 0, 0) for px in corners):
                        black_corner_candidates.append(path.as_posix())
                else:
                    opaque_count += 1

        print(
            f"WebP alpha audit: total={len(webps)}, "
            f"with_alpha={alpha_count}, opaque={opaque_count}, "
            f"transparent_corners={transparent_corner_count}, "
            f"black_corner_candidates={len(black_corner_candidates)}"
        )
        if black_corner_candidates:
            print("⚠️ Black-corner candidates (manual review):")
            for path in black_corner_candidates:
                print(f"  {path}")
        print("✅ Alpha assets use PNG codec bytes; opaque assets use lossless libwebp")
        PY

    - name: 🔎 Check asset changes and Flutter dependencies
      shell: bash
      run: |
        set -euo pipefail
        git diff --check
        flutter pub get

    - name: 💾 Persist optimized assets
      shell: bash
      run: |
        set -euo pipefail
        if git diff --quiet -- assets lib pubspec.yaml flutter_native_splash.yaml; then
          echo "✅ No persistent asset changes."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add assets lib pubspec.yaml flutter_native_splash.yaml
        git commit -m "fix(assets): preserve alpha in converted webp icons"
        git push
        echo "✅ Lossless WebP assets committed to master."

    - name: 🧪 Flutter analyze
      shell: bash
      continue-on-error: true
      run: |
        set +e
        flutter analyze --no-fatal-warnings --no-fatal-infos
        status=$?
        echo "FLUTTER_ANALYZE_EXIT_CODE=$status"
        if [ "$status" -ne 0 ]; then
          echo "⚠️ Flutter analyze reports pre-existing code issues; asset validation remains successful."
        fi
        exit 0

    - name: 📦 Install dependencies
      run: flutter pub get

    - name: 🔨 Build APK
      run: |
        flutter build apk --release --split-per-abi --no-shrink \
          --dart-define=NEXTCLOUD_URL=https://noa.it.tabdigital.cloud \
          --dart-define=NEXTCLOUD_USERNAME=PlatformSehatak@gmail.com \
          --dart-define=NEXTCLOUD_PASSWORD=${{ secrets.NEXTCLOUD_PASSWORD }} \
          --dart-define=FIREBASE_PROJECT_ID=sehatak-platform \
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
          --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
          --dart-define=FIREBASE_AUTH_DOMAIN=sehatak-platform.firebaseapp.com \
          --dart-define=FIREBASE_STORAGE_BUCKET=sehatak-platform.appspot.com \
          --dart-define=FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }} \
          --dart-define=LIVEKIT_URL=wss://platformsehatak-z73p6n5m.livekit.cloud \
          --dart-define=LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }} \
          --dart-define=LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }} \
          --dart-define=JWT_SECRET=${{ secrets.JWT_SECRET }} \
          --dart-define=ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }} \
          --dart-define=APP_NAME=صحتك_Sehatak \
          --dart-define=APP_VERSION=2.0.0 \
          --dart-define=APP_ENV=production \
          --dart-define=API_RATE_LIMIT=100 \
          --dart-define=API_RATE_LIMIT_WINDOW=60000 \
          --dart-define=CORS_ORIGIN=* \
          --dart-define=LOG_LEVEL=info \
          --dart-define=DB_HOST=localhost \
          --dart-define=DB_PORT=5432 \
          --dart-define=DB_NAME=sehatak \
          --dart-define=DB_USER=sehatak_user \
          --dart-define=DB_PASSWORD=${{ secrets.DB_PASSWORD }}

    - name: 🔎 Verify production APK signing
      shell: bash
      run: |
        set -euo pipefail
        apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
        test -s "$apk"
        echo "=== Production signing certificate ==="
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" -type f 2>/dev/null | sort -V | tail -1 || true)
        if [ -z "$APKSIGNER" ]; then
          echo "⚠️ apksigner not found — skipping"
          ls -la build/app/outputs/flutter-apk/
          exit 0
        fi
        "$APKSIGNER" verify --verbose --print-certs "$apk"
        certs="$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>/dev/null || true)"
        if printf '%s\n' "$certs" | grep -q 'Signer #1 certificate DN: C=US, O=Android, CN=Android Debug'; then
          echo "❌ Release APK is debug-signed."
          exit 1
        fi
        echo "✅ Release APK is not debug-signed."

    - name: 📤 Upload arm64-v8a
      uses: actions/upload-artifact@v4
      with:
        name: app-arm64-v8a-release
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        retention-days: 30

    - name: 📤 Upload armeabi-v7a
      uses: actions/upload-artifact@v4
      with:
        name: app-armeabi-v7a-release
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        retention-days: 30

    - name: 📤 Upload x86_64
      uses: actions/upload-artifact@v4
      with:
        name: app-x86_64-release
        path: build/app/outputs/flutter-apk/app-x86_64-release.apk
        retention-days: 30
