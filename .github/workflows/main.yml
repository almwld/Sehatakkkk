name: 🚀 Build Sehatak APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sehatak-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🧩 Apply Home local section icons once
      shell: bash
      run: |
        python3 <<'PY'
        from pathlib import Path
        import re
        p = Path('lib/presentation/screens/home/tabs/home_tab.dart')
        s = p.read_text(encoding='utf-8')

        def bounds(src, start, end):
            a = src.index('Widget ' + start)
            b = src.index('Widget ' + end, a)
            return a, b

        def replace_icons(src, asset, size=30):
            pat = re.compile(r'(?:const\s+)?Icon\s*\(')
            out=[]; pos=0
            while True:
                m=pat.search(src,pos)
                if not m:
                    out.append(src[pos:]); break
                out.append(src[pos:m.start()])
                i=m.end()
                while i<len(src) and src[i].isspace(): i+=1
                if not src.startswith('Icons.',i):
                    out.append(src[m.start():m.end()]); pos=m.end(); continue
                depth=1; j=i; quote=None; esc=False
                while j<len(src) and depth:
                    c=src[j]
                    if quote:
                        if esc: esc=False
                        elif c=='\\': esc=True
                        elif c==quote: quote=None
                    else:
                        if c in "'\"": quote=c
                        elif c=='(': depth+=1
                        elif c==')': depth-=1
                    j+=1
                if depth: raise RuntimeError('Unbalanced Icon call')
                out.append(f"Image.asset('{asset}', width: {size}, height: {size}, fit: BoxFit.contain)")
                pos=j
            return ''.join(out)

        for start,end,asset in [
            ('_tips(', '_discover(', 'assets/images/services/health_tips.png'),
            ('_weather(', '_community(', 'assets/svg/home_weather.svg'),
        ][::-1]:
            a,b=bounds(s,start,end)
            s=s[:a]+replace_icons(s[a:b],asset)+s[b:]

        a,b=bounds(s,'_discover(','_weather(')
        d=s[a:b]
        d=re.sub(
            r"const items = \[.*?\n    \];",
            """const items = [
      {'name': 'حجز موعد', 'icon': 'assets/images/services/calendar_booking.png', 'route': AppRouter.appointments},
      {'name': 'طوارئ', 'icon': 'assets/images/services/emergency.png', 'route': AppRouter.emergency},
      {'name': 'خريطة', 'icon': 'assets/images/services/map_location.png', 'route': AppRouter.map},
      {'name': 'باقات', 'icon': 'assets/images/services/health_insurance.png', 'route': AppRouter.services},
    ];""",
            d,
            count=1,
            flags=re.S,
        )
        d=d.replace(
            "Icon(item['icon']! as IconData, color: AppColors.primary, size: 27)",
            "Image.asset(item['icon']! as String, width: 27, height: 27, fit: BoxFit.contain)",
        )
        s=s[:a]+d+s[b:]

        for start,end in [
            ('_tips(', '_discover('),
            ('_discover(', '_weather('),
            ('_weather(', '_community('),
        ]:
            a,b=bounds(s,start,end)
            if 'Icons.' in s[a:b]:
                raise RuntimeError('Material icon remains in '+start)
        p.write_text(s,encoding='utf-8')
        PY
        git diff --check
        if git diff --quiet -- lib/presentation/screens/home/tabs/home_tab.dart; then
          echo "Home local section icons already applied."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add lib/presentation/screens/home/tabs/home_tab.dart
        git commit -m "refactor(home): apply local section icons"
        git push origin HEAD:${GITHUB_REF_NAME}

    - name: ☕ Setup Java
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: 💙 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        cache: true
    - name: 🔑 Add google-services.json
      run: |
        cat > android/app/google-services.json << 'JSONEOF'
        {
          "project_info": {"project_number": "1053269106596", "project_id": "sehatak-platform", "storage_bucket": "sehatak-platform.firebasestorage.app"},
          "client": [{"client_info": {"mobilesdk_app_id": "1:1053269106596:android:de2128024cd023a973ab31", "android_client_info": {"package_name": "com.sehatak.app"}}, "oauth_client": [], "api_key": [{"current_key": "AIzaSyD_frsfhn0jde9cWVUW3hXjGcnMIQmY51k"}], "services": {"appinvite_service": {"other_platform_oauth_client": []}}}],
          "configuration_version": "1"
        }
        JSONEOF
    - name: 📦 Install dependencies
      run: flutter pub get
    - name: 🔨 Build APK
      run: flutter build apk --release --split-per-abi --no-shrink
    - name: 📤 Upload arm64-v8a
      uses: actions/upload-artifact@v4
      with:
        name: app-arm64-v8a
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        retention-days: 30
    - name: 📤 Upload armeabi-v7a
      uses: actions/upload-artifact@v4
      with:
        name: app-armeabi-v7a
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        retention-days: 30
    - name: 📤 Upload x86_64
      uses: actions/upload-artifact@v4
      with:
        name: app-x86_64
        path: build/app/outputs/flutter-apk/app-x86_64-release.apk
        retention-days: 30
