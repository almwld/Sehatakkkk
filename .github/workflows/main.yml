name: 🚀 Build Sehatak APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🩺 Apply health contact directory
      run: python3 scripts/apply_health_contact_directory.py

    - name: 📊 Apply dynamic vitals integration
      run: python3 scripts/apply_dynamic_vitals_v2.py

    - name: 🛠️ Apply unified Sehatak prompt repairs
      run: python3 scripts/apply_unified_prompt_repairs.py

    - name: 🧩 Finish unified chat and routing repairs
      run: python3 scripts/finish_unified_prompt_repairs.py

    - name: 📝 Commit generated source changes
      run: |
        if git diff --quiet; then
          echo 'No generated source changes.'
          exit 0
        fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -A
        git diff --cached --check
        git commit -m 'feat: apply final unified prompt repairs'
        git push origin HEAD:master

    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 💙 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        cache: true

    - name: 📦 Install dependencies
      run: flutter pub get

    - name: 🔨 Build APK
      run: flutter build apk --release --split-per-abi

    - name: 📤 Upload arm64-v8a
      uses: actions/upload-artifact@v4
      with:
        name: app-arm64-v8a
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        retention-days: 30

    - name: 📤 Upload armeabi-v7a
      uses: actions/upload-artifact@v4
      with:
        name: app-armeabi-v7a
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        retention-days: 30

    - name: 📤 Upload x86_64
      uses: actions/upload-artifact@v4
      with:
        name: app-x86_64
        path: build/app/outputs/flutter-apk/app-x86_64-release.apk
        retention-days: 30
