name: 🚀 Build Sehatak APK
# Build verification after dependency and Dart fixes

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 💙 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        cache: true

    - name: 🔑 Add google-services.json
      run: |
        cat > android/app/google-services.json << 'JSONEOF'
        {
          "project_info": {
            "project_number": "1053269106596",
            "project_id": "sehatak-platform",
            "storage_bucket": "sehatak-platform.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:1053269106596:android:de2128024cd023a973ab31",
                "android_client_info": {
                  "package_name": "com.sehatak.app"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyD_frsfhn0jde9cWVUW3hXjGcnMIQmY51k"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        JSONEOF

    # ============================================================
    # 🔐 Prepare production release keystore
    # ============================================================
    - name: 🔐 Prepare Sehatak release keystore
      shell: bash
      env:
        SEHATAK_KEYSTORE_BASE64: ${{ secrets.SEHATAK_KEYSTORE_BASE64 }}
        SEHATAK_KEYSTORE_PASSWORD: ${{ secrets.SEHATAK_KEYSTORE_PASSWORD }}
        SEHATAK_KEY_ALIAS: ${{ secrets.SEHATAK_KEY_ALIAS }}
        SEHATAK_KEY_PASSWORD: ${{ secrets.SEHATAK_KEY_PASSWORD }}
      run: |
        set -euo pipefail

        : "${SEHATAK_KEYSTORE_BASE64:?SEHATAK_KEYSTORE_BASE64 is missing}"
        : "${SEHATAK_KEYSTORE_PASSWORD:?SEHATAK_KEYSTORE_PASSWORD is missing}"
        : "${SEHATAK_KEY_ALIAS:?SEHATAK_KEY_ALIAS is missing}"
        : "${SEHATAK_KEY_PASSWORD:?SEHATAK_KEY_PASSWORD is missing}"

        rm -rf android/keystore
        mkdir -p android/keystore

        printf '%s' "${SEHATAK_KEYSTORE_BASE64}" | base64 --decode > android/keystore/sehatak-release.jks
        test -s android/keystore/sehatak-release.jks
        chmod 600 android/keystore/sehatak-release.jks

        keytool -list -keystore android/keystore/sehatak-release.jks \
          -storepass "${SEHATAK_KEYSTORE_PASSWORD}" \
          -alias "${SEHATAK_KEY_ALIAS}" >/dev/null

        {
          echo "SEHATAK_KEYSTORE_FILE=${GITHUB_WORKSPACE}/android/keystore/sehatak-release.jks"
          echo "SEHATAK_KEYSTORE_PASSWORD=${SEHATAK_KEYSTORE_PASSWORD}"
          echo "SEHATAK_KEY_ALIAS=${SEHATAK_KEY_ALIAS}"
          echo "SEHATAK_KEY_PASSWORD=${SEHATAK_KEY_PASSWORD}"
        } >> "${GITHUB_ENV}"

        echo "✅ Production release keystore validated and configured."

    - name: 📦 Install dependencies
      run: flutter pub get

    - name: 🔨 Build APK
      run: |
        flutter build apk --release --split-per-abi --no-shrink \
          --dart-define=NEXTCLOUD_URL=https://noa.it.tabdigital.cloud \
          --dart-define=NEXTCLOUD_USERNAME=PlatformSehatak@gmail.com \
          --dart-define=NEXTCLOUD_PASSWORD=10.10.10.1010.10.10.10 \
          --dart-define=FIREBASE_PROJECT_ID=sehatak-platform \
          --dart-define=FIREBASE_API_KEY=AIzaSyDSjIBY-jZR00mhNVzuy2PYN5gKzKDiq74 \
          --dart-define=FIREBASE_APP_ID=1:642028459034:android:1a18ab80ca5a28163249fd \
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=642028459034 \
          --dart-define=FIREBASE_AUTH_DOMAIN=sehatak-platform.firebaseapp.com \
          --dart-define=FIREBASE_STORAGE_BUCKET=sehatak-platform.appspot.com \
          --dart-define=FIREBASE_CLIENT_EMAIL=firebase-adminsdk-fbsvc@sehatak-platform.iam.gserviceaccount.com \
          --dart-define=LIVEKIT_URL=wss://platformsehatak-z73p6n5m.livekit.cloud \
          --dart-define=LIVEKIT_API_KEY=APIJA856nkFikBG \
          --dart-define=LIVEKIT_API_SECRET=20uYYBFoHewR7kCm3TSL89lp15jtyz7TIzdioVcYNNb \
          --dart-define=JWT_SECRET=sehatak_super_secret_jwt_key_2026_change_me \
          --dart-define=ENCRYPTION_KEY=sehatak_encryption_key_2026 \
          --dart-define=APP_NAME=صحتك_Sehatak \
          --dart-define=APP_VERSION=2.0.0 \
          --dart-define=APP_ENV=production \
          --dart-define=API_RATE_LIMIT=100 \
          --dart-define=API_RATE_LIMIT_WINDOW=60000 \
          --dart-define=CORS_ORIGIN=* \
          --dart-define=LOG_LEVEL=info \
          --dart-define=DB_HOST=localhost \
          --dart-define=DB_PORT=5432 \
          --dart-define=DB_NAME=sehatak \
          --dart-define=DB_USER=sehatak_user \
          --dart-define=DB_PASSWORD=sehatak_db_password_2026

    - name: 🔎 Verify APK signatures
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        apks=(build/app/outputs/flutter-apk/*.apk)
        test "${#apks[@]}" -gt 0
        for apk in "${apks[@]}"; do
          echo "Verifying: ${apk}"
          apksigner verify --verbose "${apk}"
        done
        echo "✅ All release APKs are cryptographically signed."

    - name: 📤 Upload arm64-v8a
      uses: actions/upload-artifact@v4
      with:
        name: app-arm64-v8a
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        retention-days: 30

    - name: 📤 Upload armeabi-v7a
      uses: actions/upload-artifact@v4
      with:
        name: app-armeabi-v7a
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        retention-days: 30

    - name: 📤 Upload x86_64
      uses: actions/upload-artifact@v4
      with:
        name: app-x86_64
        path: build/app/outputs/flutter-apk/app-x86_64-release.apk
        retention-days: 30
