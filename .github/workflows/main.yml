name: 🚀 Build Sehatak APK
# Build verification after dependency, Dart, and release-signing fixes
# Release keystore normalization is validated before Flutter build.

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 💙 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        cache: true

    - name: 🔑 Add google-services.json
      run: |
        cat > android/app/google-services.json << 'JSONEOF'
        {
          "project_info": {
            "project_number": "1053269106596",
            "project_id": "sehatak-platform",
            "storage_bucket": "sehatak-platform.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:1053269106596:android:de2128024cd023a973ab31",
                "android_client_info": {
                  "package_name": "com.sehatak.app"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyD_frsfhn0jde9cWVUW3hXjGcnMIQmY51k"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        JSONEOF

    - name: 🔐 Prepare Sehatak release keystore
      shell: bash
      env:
        SEHATAK_KEYSTORE_BASE64: ${{ secrets.SEHATAK_KEYSTORE_BASE64 }}
        SEHATAK_KEYSTORE_PASSWORD: ${{ secrets.SEHATAK_KEYSTORE_PASSWORD }}
        SEHATAK_KEY_ALIAS: ${{ secrets.SEHATAK_KEY_ALIAS }}
        SEHATAK_KEY_PASSWORD: ${{ secrets.SEHATAK_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        : "${SEHATAK_KEYSTORE_BASE64:?SEHATAK_KEYSTORE_BASE64 is missing}"
        : "${SEHATAK_KEYSTORE_PASSWORD:?SEHATAK_KEYSTORE_PASSWORD is missing}"
        : "${SEHATAK_KEY_ALIAS:?SEHATAK_KEY_ALIAS is missing}"
        : "${SEHATAK_KEY_PASSWORD:?SEHATAK_KEY_PASSWORD is missing}"

        rm -rf android/keystore
        mkdir -p android/keystore

        normalized_base64="$(printf '%s' "${SEHATAK_KEYSTORE_BASE64}" | tr -d '[:space:]')"
        test -n "${normalized_base64}"
        printf '%s' "${normalized_base64}" | base64 --decode > android/keystore/sehatak-release.jks
        test -s android/keystore/sehatak-release.jks
        chmod 600 android/keystore/sehatak-release.jks

        echo "🔎 Keystore bytes: $(wc -c < android/keystore/sehatak-release.jks)"
        echo "🔎 Keystore SHA-256: $(sha256sum android/keystore/sehatak-release.jks | cut -d' ' -f1)"

        # Diagnose the credential/alias mismatch without printing any secret.
        # Some JKS files use the same value for store and key password. If the
        # dedicated store-password secret is wrong but the key-password secret
        # is the actual JKS store password, accept it as a safe fallback.
        STORE_PASSWORD="${SEHATAK_KEYSTORE_PASSWORD}"
        if keytool -list -keystore android/keystore/sehatak-release.jks -storepass "${STORE_PASSWORD}" >/tmp/sehatak-keystore-list.txt 2>/tmp/sehatak-keystore-error.txt; then
          echo "✅ Keystore password accepted."
        elif keytool -list -keystore android/keystore/sehatak-release.jks -storepass "${SEHATAK_KEY_PASSWORD}" >/tmp/sehatak-keystore-list.txt 2>/tmp/sehatak-keystore-error.txt; then
          STORE_PASSWORD="${SEHATAK_KEY_PASSWORD}"
          echo "✅ Keystore unlocked using the key-password secret."
        else
          echo "❌ Neither signing password secret unlocks this keystore."
          sed 's/.*Exception:/keytool exception:/' /tmp/sehatak-keystore-error.txt | head -n 3
          exit 1
        fi

        if grep -Fq "Alias name: ${SEHATAK_KEY_ALIAS}" /tmp/sehatak-keystore-list.txt; then
          EFFECTIVE_ALIAS="${SEHATAK_KEY_ALIAS}"
          echo "✅ Configured alias exists."
        else
          aliases="$(grep -E '^([[:space:]]*)Alias name:' /tmp/sehatak-keystore-list.txt | sed 's/^[[:space:]]*Alias name: //' | sed 's/^[[:space:]]*//' | head -n 2)"
          alias_count="$(printf '%s\n' "${aliases}" | sed '/^$/d' | wc -l)"
          if [ "${alias_count}" -eq 1 ]; then
            EFFECTIVE_ALIAS="$(printf '%s\n' "${aliases}" | sed -n '1p')"
            echo "⚠️ Configured alias was not found; using the only alias in the keystore."
          else
            echo "❌ SEHATAK_KEY_ALIAS was not found and the keystore does not have exactly one alias."
            exit 1
          fi
        fi

        if keytool -list -keystore android/keystore/sehatak-release.jks           -storepass "${STORE_PASSWORD}"           -alias "${EFFECTIVE_ALIAS}" >/dev/null 2>/tmp/sehatak-alias-error.txt; then
          echo "✅ Keystore + alias validation passed."
        else
          echo "❌ Keystore/alias validation failed."
          sed 's/.*Exception:/keytool exception:/' /tmp/sehatak-alias-error.txt | head -n 3
          exit 1
        fi

        {
          echo "SEHATAK_KEYSTORE_FILE=${GITHUB_WORKSPACE}/android/keystore/sehatak-release.jks"
          echo "SEHATAK_KEYSTORE_PASSWORD=${STORE_PASSWORD}"
          echo "SEHATAK_KEY_ALIAS=${EFFECTIVE_ALIAS}"
          echo "SEHATAK_KEY_PASSWORD=${SEHATAK_KEY_PASSWORD}"
        } >> "${GITHUB_ENV}"

        echo "✅ Production release keystore validated and configured."

    - name: 📦 Install dependencies
      run: flutter pub get

    - name: 🔨 Build APK
      run: |
        flutter build apk --release --split-per-abi --no-shrink \
          --dart-define=NEXTCLOUD_URL=https://noa.it.tabdigital.cloud \
          --dart-define=NEXTCLOUD_USERNAME=PlatformSehatak@gmail.com \
          --dart-define=NEXTCLOUD_PASSWORD=${{ secrets.NEXTCLOUD_PASSWORD }} \
          --dart-define=FIREBASE_PROJECT_ID=sehatak-platform \
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
          --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
          --dart-define=FIREBASE_AUTH_DOMAIN=sehatak-platform.firebaseapp.com \
          --dart-define=FIREBASE_STORAGE_BUCKET=sehatak-platform.appspot.com \
          --dart-define=FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }} \
          --dart-define=LIVEKIT_URL=wss://platformsehatak-z73p6n5m.livekit.cloud \
          --dart-define=LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }} \
          --dart-define=LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }} \
          --dart-define=JWT_SECRET=${{ secrets.JWT_SECRET }} \
          --dart-define=ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }} \
          --dart-define=APP_NAME=صحتك_Sehatak \
          --dart-define=APP_VERSION=2.0.0 \
          --dart-define=APP_ENV=production \
          --dart-define=API_RATE_LIMIT=100 \
          --dart-define=API_RATE_LIMIT_WINDOW=60000 \
          --dart-define=CORS_ORIGIN=* \
          --dart-define=LOG_LEVEL=info \
          --dart-define=DB_HOST=localhost \
          --dart-define=DB_PORT=5432 \
          --dart-define=DB_NAME=sehatak \
          --dart-define=DB_USER=sehatak_user \
          --dart-define=DB_PASSWORD=${{ secrets.DB_PASSWORD }}

    - name: 🔎 Verify APK signatures
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        apks=(build/app/outputs/flutter-apk/*.apk)
        test "${#apks[@]}" -gt 0
        for apk in "${apks[@]}"; do
          echo "Verifying: ${apk}"
          apksigner verify --verbose "${apk}"
        done
        echo "✅ All release APKs are cryptographically signed."

    - name: 📤 Upload arm64-v8a
      uses: actions/upload-artifact@v4
      with:
        name: app-arm64-v8a
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        retention-days: 30

    - name: 📤 Upload armeabi-v7a
      uses: actions/upload-artifact@v4
      with:
        name: app-armeabi-v7a
        path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        retention-days: 30

    - name: 📤 Upload x86_64
      uses: actions/upload-artifact@v4
      with:
        name: app-x86_64
        path: build/app/outputs/flutter-apk/app-x86_64-release.apk
        retention-days: 30
