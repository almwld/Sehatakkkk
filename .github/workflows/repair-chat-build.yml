name: 🔧 Repair Chat Build Sources

on:
  push:
    branches:
      - feat/complete-sehatak-integration

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-chat-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-sehatak-integration
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: Patch sources
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/presentation/screens/chat/chat_room_screen.dart')
          s = p.read_text(encoding='utf-8')
          if s.startswith('cat > lib/presentation/screens/chat/chat_room_screen.dart <<'):
              s = s.split('\n', 1)[1]
          s = s.replace('\nCHATROOMEOF\n', '\n')
          s = s.replace("message.timestamp!,\n                        messages[index - 1].timestamp!,", "message.timestamp!.toDate(),\n                        messages[index - 1].timestamp!.toDate(),", 1)
          s = s.replace("_buildDateDivider(message.timestamp, isDark)", "_buildDateDivider(message.timestamp?.toDate(), isDark)", 1)
          s = s.replace("onTap: _sendImage,", "onTap: () => _sendImage(null),")
          s = s.replace("with SingleTickerProviderStateMixin, WidgetsBindingObserver, TickerProviderStateMixin", "with WidgetsBindingObserver, TickerProviderStateMixin", 1)
          s = s.replace("final query = _searchQuery.toLowerCase();", "final query = (_searchQuery).toLowerCase();", 1)
          s = s.replace("final String text = message.text;", "final String text = message.text ?? '';", 1)

          # The old gradient/background layer was covering the approved SVG wallpaper.
          # Keep the existing ChatBackground as the single source of truth.
          s = s.replace("        _buildBackground(isDark),", "        const SizedBox.shrink(),", 1)
          s = s.replace("        _buildBackground(isDark),\n", "", 1)

          p.write_text(s, encoding='utf-8')

          p = Path('lib/presentation/screens/call/call_screen.dart')
          s = p.read_text(encoding='utf-8')
          if 'final String? callId;' not in s:
              s = s.replace('  final String chatId;\n', '  final String chatId;\n  final String? callId;\n', 1)
          if '    this.callId,' not in s:
              s = s.replace('    required this.chatId,\n', '    required this.chatId,\n    this.callId,\n', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('lib/app_router.dart')
          s = p.read_text(encoding='utf-8')
          if "import 'package:sehatak/presentation/screens/hospital/hospital_screen.dart';" not in s:
              s = s.replace("import 'package:sehatak/presentation/screens/home/home_screen.dart';", "import 'package:sehatak/presentation/screens/home/home_screen.dart';\nimport 'package:sehatak/presentation/screens/hospital/hospital_screen.dart';", 1)
          if "static const String hospitals = '/hospitals';" not in s:
              s = s.replace("  static const String labs = '/labs';", "  static const String labs = '/labs';\n  static const String hospitals = '/hospitals';", 1)
          if "GoRoute(path: hospitals" not in s:
              s = s.replace("      GoRoute(path: labs, builder: (_, __) => const LabsListScreen()),", "      GoRoute(path: labs, builder: (_, __) => const LabsListScreen()),\n      GoRoute(path: hospitals, builder: (_, __) => const HospitalScreen()),", 1)
          if "case hospitals:" not in s:
              s = s.replace("      case labs:\n        return MaterialPageRoute(builder: (_) => const LabsListScreen(), settings: routeSettings);", "      case labs:\n        return MaterialPageRoute(builder: (_) => const LabsListScreen(), settings: routeSettings);\n      case hospitals:\n        return MaterialPageRoute(builder: (_) => const HospitalScreen(), settings: routeSettings);", 1)
          p.write_text(s, encoding='utf-8')

      - name: Verify source changes
        run: |
          ! grep -q "^cat > lib/presentation/screens/chat/chat_room_screen.dart" lib/presentation/screens/chat/chat_room_screen.dart
          ! grep -q "^CHATROOMEOF$" lib/presentation/screens/chat/chat_room_screen.dart
          grep -q "sehatak_chat_wallpaper_light.svg" lib/presentation/screens/chat/widgets/chat_background.dart
          grep -q "sehatak_chat_wallpaper_dark.svg" lib/presentation/screens/chat/widgets/chat_background.dart
          grep -q "const SizedBox.shrink()," lib/presentation/screens/chat/chat_room_screen.dart
          git diff --check

      - name: Format sources
        run: |
          dart format lib/presentation/screens/chat/chat_room_screen.dart lib/presentation/screens/call/call_screen.dart lib/app_router.dart

      - name: Commit repaired sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/presentation/screens/chat/chat_room_screen.dart lib/presentation/screens/call/call_screen.dart lib/app_router.dart
          if git diff --cached --quiet; then echo 'No source changes needed'; exit 0; fi
          git commit -m 'fix(chat): show approved SVG wallpaper [repair-chat-build]'
          git push origin HEAD:feat/complete-sehatak-integration
