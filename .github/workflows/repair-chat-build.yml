name: 🔧 Repair Chat Build Sources

on:
  push:
    branches:
      - feat/complete-sehatak-integration

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-chat-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-sehatak-integration
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: Patch sources
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          # Restore the last known-good complete chat source before applying the
          # narrowly scoped null-safety fix. This prevents a broken generated
          # replacement from destroying the large chat screen.
          known_good = '2ebbc1cf922974e9fbf01031ebf71e23c81af0c8'
          subprocess.run(['git', 'checkout', known_good, '--', 'lib/presentation/screens/chat/chat_room_screen.dart'], check=True)

          p = Path('lib/presentation/screens/chat/chat_room_screen.dart')
          s = p.read_text(encoding='utf-8')
          if s.startswith('cat > lib/presentation/screens/chat/chat_room_screen.dart <<'):
              s = s.split('\n', 1)[1]
          s = s.replace('\nCHATROOMEOF\n', '\n')
          s = s.replace("message.timestamp!,\n                        messages[index - 1].timestamp!,", "message.timestamp!.toDate(),\n                        messages[index - 1].timestamp!.toDate(),", 1)
          s = s.replace("_buildDateDivider(message.timestamp, isDark)", "_buildDateDivider(message.timestamp?.toDate(), isDark)", 1)
          s = s.replace("onTap: _sendImage,", "onTap: () => _sendImage(null),")
          s = s.replace("_messages[i].text.toLowerCase()", "(_messages[i].text ?? '').toLowerCase()")
          s = s.replace("final String text = message.text;", "final String text = message.text ?? '';", 1)
          # Remove the obsolete opaque background layer; ChatBackground is the source of truth.
          s = s.replace("        _buildBackground(isDark),", "        const SizedBox.shrink(),", 1)
          s = s.replace("        _buildBackground(isDark),\n", "", 1)
          p.write_text(s, encoding='utf-8')

          # Calls: normalize accidental duplicate callId edits without touching other code.
          p = Path('lib/presentation/screens/call/call_screen.dart')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'(  final String\? callId;\n)(\s*final String\? callId;\n)+', r'\1', s, count=1)
          s = re.sub(r'(    this\.callId,\n)(\s*this\.callId,\n)+', r'\1', s, count=1)
          if 'final String? callId;' not in s:
              s = s.replace('  final String chatId;\n', '  final String chatId;\n  final String? callId;\n', 1)
          if '    this.callId,' not in s:
              s = s.replace('    required this.chatId,\n', '    required this.chatId,\n    this.callId,\n', 1)
          p.write_text(s, encoding='utf-8')

          # Home health widgets: use the clean structured implementation rather than
          # trying to repair fragile one-line generated expressions.
          p = Path('lib/presentation/widgets/home/home_health_widgets.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace('])));\n  }\n\n  Widget _vital', ']))));\n  }\n\n  Widget _vital', 1)
          s = s.replace('])));\n  }\n\n  static String _number', ']))));\n  }\n\n  static String _number', 1)
          p.write_text(s, encoding='utf-8')

          # Router: preserve the hospitals route if the feature grid references it.
          p = Path('lib/app_router.dart')
          s = p.read_text(encoding='utf-8')
          if "import 'package:sehatak/presentation/screens/hospital/hospital_screen.dart';" not in s:
              anchor = "import 'package:sehatak/presentation/screens/home/home_screen.dart';"
              if anchor in s:
                  s = s.replace(anchor, anchor + "\nimport 'package:sehatak/presentation/screens/hospital/hospital_screen.dart';", 1)
          if "static const String hospitals = '/hospitals';" not in s and "static const String labs = '/labs';" in s:
              s = s.replace("  static const String labs = '/labs';", "  static const String labs = '/labs';\n  static const String hospitals = '/hospitals';", 1)
          if "GoRoute(path: hospitals" not in s and "GoRoute(path: labs" in s:
              s = s.replace("      GoRoute(path: labs, builder: (_, __) => const LabsListScreen()),", "      GoRoute(path: labs, builder: (_, __) => const LabsListScreen()),\n      GoRoute(path: hospitals, builder: (_, __) => const HospitalScreen()),", 1)
          p.write_text(s, encoding='utf-8')

      - name: Verify source changes
        run: |
          ! grep -q "^cat > lib/presentation/screens/chat/chat_room_screen.dart" lib/presentation/screens/chat/chat_room_screen.dart
          ! grep -q "^CHATROOMEOF$" lib/presentation/screens/chat/chat_room_screen.dart
          grep -q "sehatak_chat_wallpaper_light.svg" lib/presentation/screens/chat/widgets/chat_background.dart
          grep -q "sehatak_chat_wallpaper_dark.svg" lib/presentation/screens/chat/widgets/chat_background.dart
          grep -q "const SizedBox.shrink()," lib/presentation/screens/chat/chat_room_screen.dart
          test "$(grep -c 'final String? callId;' lib/presentation/screens/call/call_screen.dart)" -eq 1
          test "$(grep -c 'this.callId,' lib/presentation/screens/call/call_screen.dart)" -eq 1
          ! grep -q "_messages\[i\]\.text\.toLowerCase()" lib/presentation/screens/chat/chat_room_screen.dart
          git diff --check

      - name: Format sources
        run: |
          dart format lib/presentation/screens/chat/chat_room_screen.dart lib/presentation/screens/call/call_screen.dart lib/presentation/widgets/home/home_health_widgets.dart lib/app_router.dart

      - name: Commit repaired sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/presentation/screens/chat/chat_room_screen.dart lib/presentation/screens/call/call_screen.dart lib/presentation/widgets/home/home_health_widgets.dart lib/app_router.dart
          if git diff --cached --quiet; then echo 'No source changes needed'; exit 0; fi
          git commit -m 'fix(build): restore chat and repair source syntax [repair-chat-build]'
          git push origin HEAD:feat/complete-sehatak-integration
