    );
  }

  Widget _sectionTitle(String title, bool dark) {
    return Text(title, style: TextStyle(fontSize: 17, fontWeight: FontWeight.w900, color: dark ? Colors.white : Colors.black87));
  }

  Widget _profileInfo(String label, String value, IconData icon, bool dark) {
    return Padding(
      padding: const EdgeInsets.symmetric(horizontal: 8),
      child: Column(
        children: [
          Icon(icon, size: 21, color: AppColors.primary),
          const SizedBox(height: 5),
          Text(label, style: TextStyle(fontSize: 10, color: dark ? Colors.white60 : Colors.black45)),
