              text = text.replace(marker, build_method + marker, 1)
              patient.write_text(text, encoding='utf-8')
              print('Restored PatientDashboard.build without removing existing fields/helpers.')
          else:
              print('PatientDashboard.build already exists.')
          PY

      - name: Validate repaired source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in ['lib/presentation/screens/home/tabs/home_tab.dart','lib/presentation/screens/patient/patient_dashboard.dart']:
              print(p, 'lines=', len(Path(p).read_text(encoding='utf-8').splitlines()))
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/presentation/screens/home/tabs/home_tab.dart lib/presentation/screens/patient/patient_dashboard.dart
          git diff --cached --check
          git commit -m 'fix: restore patient dashboard build and home syntax'
          git push origin HEAD:master

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          git fetch origin master
          git checkout master
          git pull --ff-only origin master
          git rm -f .github/workflows/one-time-repair-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove one-time Dart repair workflow'
          git push origin HEAD:master
