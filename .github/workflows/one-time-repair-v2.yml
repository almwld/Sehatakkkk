name: One-time Dart repair v2

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair remaining Dart blockers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # home_tab.dart: close the children list and the conditional spread list.
          home = Path('lib/presentation/screens/home/tabs/home_tab.dart')
          text = home.read_text(encoding='utf-8')
          bad = "color: dark ? Colors.white70 : _muted))]),"
          good = "color: dark ? Colors.white70 : _muted))]]),"
          if bad in text:
              text = text.replace(bad, good, 1)
              home.write_text(text, encoding='utf-8')
              print('Fixed home_tab.dart missing ].')
          else:
              print('home_tab.dart target already fixed or not found.')

          # patient_dashboard.dart: the file contains all state/data/helper methods,
          # but the State.build implementation was lost by an earlier truncation.
          patient = Path('lib/presentation/screens/patient/patient_dashboard.dart')
          text = patient.read_text(encoding='utf-8')
          if 'Widget build(BuildContext context)' not in text:
              marker = '  Widget _buildQRCode() {'
              if marker not in text:
                  raise SystemExit('Patient dashboard insertion marker not found')
              build_method = r'''  @override
