name: ImageKit Lab Images

on:
  push:
    branches: [master]
    paths:
      - 'scripts/upload_lab_images.js'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload lab images
        if: ${{ secrets.IMAGEKIT_PRIVATE_KEY != '' }}
        env:
          IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
        run: node scripts/upload_lab_images.js
      - name: Verify configuration
        if: ${{ secrets.IMAGEKIT_PRIVATE_KEY == '' }}
        run: echo 'ImageKit upload skipped because IMAGEKIT_PRIVATE_KEY is not configured in repository secrets.'
