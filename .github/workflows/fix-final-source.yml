name: Final Source Syntax Repair

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'almwld' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: Repair home_tab.dart
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/presentation/screens/home/tabs/home_tab.dart')
          s = p.read_text(encoding='utf-8-sig')
          start = s.index('  Widget _weather(bool dark)')
          end = s.index('  Widget _error(String text, bool dark)', start)
          replacement = r'''  Widget _weather(bool dark) {
            return _section(
              title: 'الطقس',
              dark: dark,
              child: FutureBuilder<Map<String, dynamic>>(
                future: _weatherFuture,
                builder: (_, snapshot) {
                  if (snapshot.connectionState == ConnectionState.waiting) {
                    return const SizedBox(
                      height: 96,
                      child: Center(child: CircularProgressIndicator(strokeWidth: 2)),
                    );
                  }
                  final data = snapshot.data ?? const <String, dynamic>{};
                  final temp = data['temp']?.toString();
                  final condition = data['condition']?.toString();
                  if (temp == null || condition == null || temp.isEmpty) {
                    return _empty('تعذر الحصول على بيانات الطقس حالياً', dark);
                  }
                  return Padding(
                    padding: const EdgeInsets.symmetric(horizontal: 16),
                    child: Container(
                      height: 96,
                      padding: const EdgeInsets.symmetric(horizontal: 18),
                      decoration: BoxDecoration(
                        color: dark ? _darkCard : Colors.white,
                        borderRadius: BorderRadius.circular(18),
                      ),
                      child: Row(
                        children: [
                          const Icon(Icons.wb_sunny_outlined, color: AppColors.primary, size: 38),
                          const SizedBox(width: 14),
                          Expanded(
                            child: Column(
                              mainAxisAlignment: MainAxisAlignment.center,
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text('صنعاء', style: TextStyle(fontSize: 13, fontWeight: FontWeight.w900, color: dark ? Colors.white : _text)),
                                const SizedBox(height: 4),
                                Text(condition, style: TextStyle(fontSize: 11, color: dark ? Colors.white70 : _muted)),
                              ],
                            ),
                          ),
                          Text('$temp°', style: TextStyle(fontSize: 28, fontWeight: FontWeight.w900, color: dark ? Colors.white : _text)),
                        ],
                      ),
                    ),
                  );
                },
              ),
            );
          }

          Widget _community(List<dynamic> items, bool dark) {
            if (items.isEmpty) {
              return _section(title: 'المجتمع', dark: dark, child: _empty('لا توجد منشورات منشورة حالياً', dark));
            }
            final posts = items.take(5).toList();
            return _section(
              title: 'المجتمع',
              dark: dark,
              child: Column(
                children: posts.map((raw) {
                  final item = Map<String, dynamic>.from(raw as Map);
                  final author = (item['authorName'] ?? item['userName'] ?? item['displayName'] ?? 'مستخدم').toString();
                  final text = (item['content'] ?? item['text'] ?? item['body'] ?? '').toString();
                  final image = (item['imageUrl'] ?? item['image'] ?? '').toString();
                  return Container(
                    margin: const EdgeInsets.fromLTRB(16, 0, 16, 10),
                    padding: const EdgeInsets.all(12),
                    decoration: BoxDecoration(color: dark ? _darkCard : Colors.white, borderRadius: BorderRadius.circular(16)),
                    child: Row(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        CircleAvatar(radius: 20, backgroundColor: AppColors.primary.withOpacity(.1), child: const Icon(Icons.person_outline, color: AppColors.primary)),
                        const SizedBox(width: 10),
                        Expanded(
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text(author, style: TextStyle(fontSize: 12, fontWeight: FontWeight.w900, color: dark ? Colors.white : _text)),
                              if (text.isNotEmpty) ...[
                                const SizedBox(height: 5),
                                Text(text, maxLines: 4, overflow: TextOverflow.ellipsis, style: TextStyle(fontSize: 11, color: dark ? Colors.white70 : _muted)),
                              ],
                              if (image.isNotEmpty) ...[
                                const SizedBox(height: 8),
                                ClipRRect(borderRadius: BorderRadius.circular(10), child: AppImage(imageUrl: image, height: 110, width: double.infinity, fit: BoxFit.cover)),
                              ],
                            ],
                          ),
                        ),
                      ],
                    ),
                  );
                }).toList(),
              ),
            );
          }

'''
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')

      - name: Repair medical_records_screen.dart
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/presentation/screens/records/medical_records_screen.dart')
          s = p.read_text(encoding='utf-8-sig')
          start = s.index(' Future<void> _showAddRecordDialog')
          replacement = r'''  Future<void> _showAddRecordDialog(BuildContext context) async {
    final title = TextEditingController();
    final doctor = TextEditingController();
    final type = TextEditingController(text: 'تقارير');
    final desc = TextEditingController();
    try {
      final ok = await showDialog<bool>(
        context: context,
        builder: (_) => AlertDialog(
          title: const Text('إضافة ملف طبي'),
          content: SingleChildScrollView(
            child: Column(
              children: [
                TextField(controller: title, decoration: const InputDecoration(labelText: 'العنوان')),
                TextField(controller: doctor, decoration: const InputDecoration(labelText: 'اسم الطبيب')),
                TextField(controller: type, decoration: const InputDecoration(labelText: 'النوع')),
                TextField(controller: desc, maxLines: 3, decoration: const InputDecoration(labelText: 'الوصف')),
              ],
            ),
          ),
          actions: [
            TextButton(onPressed: () => Navigator.pop(context, false), child: const Text('إلغاء')),
            ElevatedButton(onPressed: () => Navigator.pop(context, true), child: const Text('حفظ')),
          ],
        ),
      );
      if (ok != true) return;
      final user = _auth.currentUser;
      if (user == null || title.text.trim().isEmpty) {
        ToastService.showWarning('يرجى إدخال عنوان الملف');
        return;
      }
      try {
        await _firestore.collection('medical_records').add({
          'patientId': user.uid,
          'patientName': user.displayName ?? 'مريض',
          'title': title.text.trim(),
          'doctorName': doctor.text.trim(),
          'type': type.text.trim(),
          'description': desc.text.trim(),
          'attachments': [],
          'date': FieldValue.serverTimestamp(),
          'createdAt': FieldValue.serverTimestamp(),
        });
        if (mounted) ToastService.showSuccess('تمت إضافة الملف الطبي');
      } catch (e) {
        if (mounted) ToastService.showError('تعذر حفظ الملف الطبي');
      }
    } finally {
      title.dispose();
      doctor.dispose();
      type.dispose();
      desc.dispose();
    }
  }
}
'''
          p.write_text(s[:start] + replacement, encoding='utf-8')

      - name: Format repaired files
        run: dart format lib/presentation/screens/home/tabs/home_tab.dart lib/presentation/screens/records/medical_records_screen.dart

      - name: Verify required syntax
        run: |
          dart analyze lib/presentation/screens/home/tabs/home_tab.dart
          dart analyze lib/presentation/screens/records/medical_records_screen.dart

      - name: Commit exact repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/presentation/screens/home/tabs/home_tab.dart lib/presentation/screens/records/medical_records_screen.dart
          git diff --cached --quiet || git commit -m 'fix(build): repair syntax errors in home_tab + medical_records

- home_tab.dart line 273: extra parens after Padding widget
- medical_records_screen.dart line 16: missing ] or ) in minified code

Both files were minified incorrectly. Re-formatted without removing
any widget or feature.'
          git push origin HEAD:master
