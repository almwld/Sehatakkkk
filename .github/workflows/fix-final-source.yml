name: Final Source Syntax Repair
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'almwld' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Repair home and medical records syntax
        shell: python
        run: |
          from pathlib import Path
          import re

          # Repair only the malformed Home weather/community region.
          p = Path('lib/presentation/screens/home/tabs/home_tab.dart')
          s = p.read_text(encoding='utf-8-sig')
          start = s.find('  Widget _weather(bool dark)')
          end = s.find('  Widget _error(String text, bool dark)')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Home weather/community region not found')
          replacement = r'''  Widget _weather(bool dark) {
    return _section(
      title: 'الطقس اليوم',
      dark: dark,
      child: FutureBuilder<Map<String, dynamic>>(
        future: _weatherFuture,
        builder: (context, snapshot) {
          final data = snapshot.data ?? const <String, dynamic>{};
          if (snapshot.connectionState == ConnectionState.waiting) {
            return const Padding(
              padding: EdgeInsets.all(16),
              child: Center(child: CircularProgressIndicator(strokeWidth: 2)),
            );
          }
          if (data.isEmpty) {
            return _empty('تعذر الحصول على بيانات الطقس حالياً', dark);
          }
          final temp = '${data['temp'] ?? '--'}°';
          final condition = (data['condition'] ?? 'غير متوفر').toString();
          return Padding(
            padding: const EdgeInsets.symmetric(horizontal: 16),
            child: Container(
              padding: const EdgeInsets.all(18),
              decoration: BoxDecoration(
                color: dark ? _darkCard : Colors.white,
                borderRadius: BorderRadius.circular(18),
              ),
              child: Row(
                children: [
                  const Icon(Icons.wb_sunny_outlined, color: AppColors.primary, size: 40),
                  const SizedBox(width: 14),
                  Expanded(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text('صنعاء', style: TextStyle(color: dark ? Colors.white : _text, fontWeight: FontWeight.w900)),
                        const SizedBox(height: 4),
                        Text(condition, style: const TextStyle(color: AppColors.primary, fontSize: 12)),
                      ],
                    ),
                  ),
                  Text(temp, style: TextStyle(color: dark ? Colors.white : _text, fontSize: 28, fontWeight: FontWeight.w900)),
                ],
              ),
            ),
          );
        },
      ),
    );
  }

  Widget _community(List<dynamic> posts, bool dark) {
    if (posts.isEmpty) {
      return _section(
        title: 'المجتمع',
        dark: dark,
        child: _empty('لا توجد منشورات منشورة حالياً', dark),
      );
    }
    return _section(
      title: 'المجتمع',
      dark: dark,
      more: () => _go(AppRouter.community),
      child: SizedBox(
        height: 190,
        child: ListView.separated(
          padding: const EdgeInsets.symmetric(horizontal: 16),
          scrollDirection: Axis.horizontal,
          itemCount: posts.length > 8 ? 8 : posts.length,
          separatorBuilder: (_, __) => const SizedBox(width: 10),
          itemBuilder: (_, index) {
            final raw = posts[index];
            final post = raw is Map ? raw.cast<String, dynamic>() : <String, dynamic>{};
            final author = (post['authorName'] ?? post['userName'] ?? post['displayName'] ?? 'مستخدم').toString();
            final content = (post['content'] ?? post['text'] ?? post['body'] ?? '').toString();
            final image = (post['imageUrl'] ?? post['image'] ?? '').toString();
            return Container(
              width: 260,
              padding: const EdgeInsets.all(12),
              decoration: BoxDecoration(
                color: dark ? _darkCard : Colors.white,
                borderRadius: BorderRadius.circular(18),
              ),
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  if (image.isNotEmpty)
                    ClipRRect(
                      borderRadius: BorderRadius.circular(12),
                      child: AppImage(imageUrl: image, height: 72, width: double.infinity, fit: BoxFit.cover),
                    ),
                  const SizedBox(height: 8),
                  Text(author, maxLines: 1, overflow: TextOverflow.ellipsis, style: TextStyle(color: dark ? Colors.white : _text, fontWeight: FontWeight.w900)),
                  const SizedBox(height: 6),
                  Expanded(
                    child: Text(content.isEmpty ? 'منشور مجتمعي' : content, maxLines: 4, overflow: TextOverflow.ellipsis, style: TextStyle(color: dark ? Colors.white70 : _muted, fontSize: 12, height: 1.4)),
                  ),
                ],
              ),
            );
          },
        ),
      ),
    );
  }

'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

          # Replace only the malformed final dialog method; preserve the rest of the medical-record screen.
          p = Path('lib/presentation/screens/records/medical_records_screen.dart')
          s = p.read_text(encoding='utf-8-sig')
          start = s.find(' Future<void> _showAddRecordDialog')
          if start < 0:
              raise SystemExit('Medical records dialog method not found')
          replacement = r'''  Future<void> _showAddRecordDialog(BuildContext context) async {
    final title = TextEditingController();
    final doctor = TextEditingController();
    final type = TextEditingController(text: 'تقارير');
    final desc = TextEditingController();
    try {
      final ok = await showDialog<bool>(
        context: context,
        builder: (_) => AlertDialog(
          title: const Text('إضافة ملف طبي'),
          content: SingleChildScrollView(
            child: Column(
              children: [
                TextField(controller: title, decoration: const InputDecoration(labelText: 'العنوان')),
                TextField(controller: doctor, decoration: const InputDecoration(labelText: 'اسم الطبيب')),
                TextField(controller: type, decoration: const InputDecoration(labelText: 'النوع')),
                TextField(controller: desc, maxLines: 3, decoration: const InputDecoration(labelText: 'الوصف')),
              ],
            ),
          ),
          actions: [
            TextButton(onPressed: () => Navigator.pop(context, false), child: const Text('إلغاء')),
            ElevatedButton(onPressed: () => Navigator.pop(context, true), child: const Text('حفظ')),
          ],
        ),
      );
      if (ok != true) return;
      final user = _auth.currentUser;
      if (user == null || title.text.trim().isEmpty) {
        ToastService.showWarning('يرجى إدخال عنوان الملف');
        return;
      }
      try {
        await _firestore.collection('medical_records').add({
          'patientId': user.uid,
          'patientName': user.displayName ?? 'مريض',
          'title': title.text.trim(),
          'doctorName': doctor.text.trim(),
          'type': type.text.trim(),
          'description': desc.text.trim(),
          'attachments': <String>[],
          'date': FieldValue.serverTimestamp(),
          'createdAt': FieldValue.serverTimestamp(),
        });
        if (mounted) ToastService.showSuccess('تمت إضافة الملف الطبي');
      } catch (_) {
        if (mounted) ToastService.showError('تعذر حفظ الملف الطبي');
      }
    } finally {
      title.dispose();
      doctor.dispose();
      type.dispose();
      desc.dispose();
    }
  }
}
'''
          s = s[:start] + replacement
          p.write_text(s, encoding='utf-8')
      - name: Format repaired files
        run: dart format lib/presentation/screens/home/tabs/home_tab.dart lib/presentation/screens/records/medical_records_screen.dart
      - name: Verify analyzer has no errors
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.log
          ! grep -E '^\s*error •|^\s*error ' /tmp/analyze.log
      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/presentation/screens/home/tabs/home_tab.dart lib/presentation/screens/records/medical_records_screen.dart
          git commit -m 'fix: repair final home and medical records syntax'
          git push origin HEAD:master
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/fix-final-source.yml
          git commit -m 'chore: remove one-time source repair workflow'
          git push origin HEAD:master
