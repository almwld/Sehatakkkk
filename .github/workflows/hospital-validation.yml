name: Hospital PR validation

on:
  pull_request:
    branches: [master]
    paths:
      - 'lib/presentation/screens/hospital/**'
      - 'lib/presentation/widgets/home/featured_facilities_grid.dart'
      - 'lib/app_router.dart'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/hospital-validation.yml'

permissions:
  contents: read

concurrency:
  group: hospital-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter 3.16.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded
