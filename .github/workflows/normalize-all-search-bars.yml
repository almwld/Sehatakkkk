name: Normalize All Search Bars

on:
  push:
    branches: [master, main]
    paths:
      - 'lib/**/*.dart'
      - '.github/workflows/normalize-all-search-bars.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize search fields
        shell: python
        run: |
          import pathlib, re
          SEARCH_HINT_RE = re.compile(r"['\"]([^'\"]*(?:ابحث|بحث|البحث|search|Search)[^'\"]*)['\"]")
          def matching_paren(s, start):
              depth=0; quote=None; esc=False
              for i in range(start,len(s)):
                  c=s[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in "'\"": quote=c
                      elif c=='(': depth+=1
                      elif c==')':
                          depth-=1
                          if depth==0:return i
              return -1
          def split_args(s):
              out=[]; st=0; stack=[]; quote=None; esc=False
              for i,c in enumerate(s):
                  if quote:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==quote:quote=None
                  else:
                      if c in "'\"":quote=c
                      elif c in '([{':stack.append(c)
                      elif c in ')]}':
                          if stack:stack.pop()
                      elif c==',' and not stack:out.append(s[st:i].strip());st=i+1
              out.append(s[st:].strip()); return [x for x in out if x]
          def arg(parts,name):
              pat=re.compile(r'^\s*'+re.escape(name)+r'\s*:')
              for p in parts:
                  if pat.match(p):return re.sub(r'^\s*'+re.escape(name)+r'\s*:\s*','',p,count=1)
              return None
          def transform(call):
              parts=split_args(call); deco=arg(parts,'decoration'); hint=None
              if deco:
                  m=SEARCH_HINT_RE.search(deco)
                  if m:hint=m.group(1)
              if not hint and not re.search(r'Icons\.search(?:_rounded)?',call):return None
              vals=[]
              for n in ('controller','onChanged','onTap','readOnly','enabled'):
                  v=arg(parts,n)
                  if v:vals.append(f'{n}: {v}')
              if hint:vals.append("hintText: '"+hint.replace("'","\\'")+"'")
              return 'UnifiedSearchBar('+', '.join(vals)+')'
          changed=[]
          for path in pathlib.Path('lib').rglob('*.dart'):
              text=path.read_text(encoding='utf-8')
              if 'class UnifiedSearchBar' in text:continue
              reps=[]; cur=0
              while True:
                  m=re.search(r'\bTextField\s*\(',text[cur:])
                  if not m:break
                  start=cur+m.start(); op=text.find('(',start); end=matching_paren(text,op)
                  if end<0:break
                  r=transform(text[op+1:end])
                  if r:reps.append((start,end+1,r))
                  cur=end+1
              if not reps:continue
              for a,b,r in reversed(reps):text=text[:a]+r+text[b:]
              imp="import 'package:sehatak/presentation/widgets/common/unified_search_bar.dart';"
              if imp not in text:
                  lines=text.splitlines(True); last=max((i for i,l in enumerate(lines) if l.startswith('import ')),default=-1)
                  if last>=0:lines.insert(last+1,imp+'\n');text=''.join(lines)
                  else:text=imp+'\n'+text
              path.write_text(text,encoding='utf-8');changed.append(str(path))
          print('Normalized:', *changed, sep='\n- ')
          if not changed: raise SystemExit('No search TextFields found to normalize')
      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          git commit -m 'fix(search): unify all search field appearance'
          git push
          git rm .github/workflows/normalize-all-search-bars.yml
          git commit -m 'chore(ci): remove temporary search normalization workflow'
          git push
