name: Apply Home Design System
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Integrate Home widgets
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lib/presentation/screens/home/tabs/home_tab.dart')
          text = path.read_text(encoding='utf-8')

          imports = "import 'package:sehatak/presentation/screens/home/widgets/quick_services_widget.dart';\nimport 'package:sehatak/presentation/widgets/home/home_health_widgets.dart';\n"
          anchor = "import 'package:sehatak/presentation/screens/home/widgets/banner_carousel.dart';\n"
          if imports.splitlines()[0] not in text:
              text = text.replace(anchor, anchor + imports)

          quick = re.compile(r"  Widget _quickServices\(bool dark\) \{.*?\n  \}\n\n  Widget _healthSummary", re.S)
          quick_replacement = "  Widget _quickServices(bool dark) => QuickServicesWidget(\n        isDark: dark,\n        onNavigate: (screen) => Navigator.of(context).push(\n          MaterialPageRoute(builder: (_) => screen),\n        ),\n      );\n\n  Widget _healthSummary"
          text, quick_count = quick.subn(quick_replacement, text, count=1)
          if quick_count != 1:
              raise SystemExit('quick services block was not found')

          health = re.compile(r"  Widget _healthSummary\(HomeState state, bool dark\) \{.*?\n  \}\n\n  Widget _doctors", re.S)
          health_replacement = "  Widget _healthSummary(HomeState state, bool dark) => HomeHealthWidgets(\n        state: state,\n        isDark: dark,\n        onNavigate: _go,\n      );\n\n  Widget _doctors"
          text, health_count = health.subn(health_replacement, text, count=1)
          if health_count != 1:
              raise SystemExit('health summary block was not found')

          path.write_text(text, encoding='utf-8')

      - name: Verify Dart source
        run: |
          grep -q "HomeHealthWidgets" lib/presentation/screens/home/tabs/home_tab.dart
          grep -q "QuickServicesWidget" lib/presentation/screens/home/tabs/home_tab.dart

      - name: Commit and remove integration workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/screens/home/tabs/home_tab.dart .github/workflows/apply-home-design.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git rm .github/workflows/apply-home-design.yml
          git add lib/presentation/screens/home/tabs/home_tab.dart
          git commit -m "feat(home): apply widget color system"
          git push
