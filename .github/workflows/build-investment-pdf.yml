name: Build Investment PDFs

on:
  workflow_dispatch:
  push:
    branches:
      - investment/technical-due-diligence-v0.1
    paths:
      - 'docs/investment/html/**'
      - 'docs/investment/assets/**'
      - '.github/workflows/build-investment-pdf.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render HTML documents to PDF
        run: |
          mkdir -p dist/investment
          node - <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({headless:true});
            for (const name of ['executive-summary','report-full']) {
              const page = await browser.newPage();
              const file = path.resolve('docs/investment/html', name + '.html');
              await page.goto('file://' + file, {waitUntil:'networkidle'});
              await page.pdf({path:'dist/investment/' + name + '.pdf', format:'A4', printBackground:true, preferCSSPageSize:true});
              await page.close();
            }
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sehatak-investment-pdfs
          path: dist/investment/*.pdf
          if-no-files-found: error