name: One-time repair broken Dart sources

on:
  push:
    branches: [master]

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and repair sources
        shell: bash
        run: |
          set -euo pipefail
          git checkout b9795c30b1e5bc4531e4c4daa2466f6ff378a126 -- lib/presentation/screens/chat/chat_screen.dart
          git checkout ed8b8a068432a58fa0a7d5e729362d733d23a733 -- lib/presentation/screens/patient/patient_dashboard.dart

          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/presentation/screens/home/tabs/home_tab.dart')
          text = path.read_text(encoding='utf-8')
          old = """child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text(author, style: TextStyle(fontSize: 11, fontWeight: FontWeight.w900, color: dark ? Colors.white : _text)), if (body.isNotEmpty) ...[const SizedBox(height: 5), Text(body, maxLines: 4, overflow: TextOverflow.ellipsis, style: TextStyle(fontSize: 11, height: 1.4, color: dark ? Colors.white70 : _muted))]],"""
          new = """child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text(author, style: TextStyle(fontSize: 11, fontWeight: FontWeight.w900, color: dark ? Colors.white : _text)), if (body.isNotEmpty) ...[const SizedBox(height: 5), Text(body, maxLines: 4, overflow: TextOverflow.ellipsis, style: TextStyle(fontSize: 11, height: 1.4, color: dark ? Colors.white70 : _muted))]),"""
          if old not in text:
              raise SystemExit('Expected malformed HomeTab community block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/presentation/screens/chat/chat_screen.dart')
          text = path.read_text(encoding='utf-8')
          old = "leading: const CircleAvatar(backgroundColor: AppColors.primary, child: Icon(Icons.smart_toy_outlined, color: Colors.white)),"
          new = """leading: Image.asset(
            'assets/images/services/ai_assistant.png',
            width: 46,
            height: 46,
            fit: BoxFit.contain,
            errorBuilder: (_, __, ___) => const Icon(Icons.smart_toy_outlined, color: AppColors.primary, size: 30),
          ),"""
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/presentation/screens/chat/chat_screen.dart lib/presentation/screens/home/tabs/home_tab.dart lib/presentation/screens/patient/patient_dashboard.dart
          git rm .github/workflows/one-time-repair.yml
          git commit -m 'fix: restore truncated Dart sources and repair HomeTab syntax'
          git push origin HEAD:master
