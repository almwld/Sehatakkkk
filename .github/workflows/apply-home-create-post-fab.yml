name: Apply Home Create Post FAB

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply Home FAB
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path('lib/presentation/screens/home/tabs/home_tab.dart')
          text = path.read_text(encoding='utf-8')
          imp = "import 'package:sehatak/presentation/widgets/home/home_create_post_fab.dart';"
          if imp not in text:
              anchor = "import 'package:sehatak/presentation/widgets/home/featured_facilities_grid.dart';"
              if anchor not in text:
                  raise SystemExit('Home import anchor not found')
              text = text.replace(anchor, anchor + '\n' + imp, 1)

          marker = 'child: RefreshIndicator('
          start = text.find(marker)
          if start < 0:
              raise SystemExit('RefreshIndicator marker not found')
          if 'HomeCreatePostFab' in text:
              raise SystemExit('HomeCreatePostFab already applied')

          open_pos = start + len(marker) - 1
          depth = 0
          quote = None
          escape = False
          end = None
          for i in range(open_pos, len(text)):
              c = text[i]
              if quote:
                  if escape:
                      escape = False
                  elif c == '\\':
                      escape = True
                  elif c == quote:
                      quote = None
                  continue
              if c in ("'", '"'):
                  quote = c
                  continue
              if c == '(':
                  depth += 1
              elif c == ')':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('Could not balance RefreshIndicator expression')

          expr = text[start:end]
          replacement = "child: Stack(\n            children: [\n              " + expr + ",\n              const Positioned(\n                right: 16,\n                bottom: 16,\n                child: HomeCreatePostFab(),\n              ),\n            ],\n          )"
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

          check = path.read_text(encoding='utf-8')
          if imp not in check or check.count('HomeCreatePostFab') != 2:
              raise SystemExit('Validation failed: import/widget reference count')
          if check.count('home_create_post_fab.dart') != 1:
              raise SystemExit('Validation failed: import count')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/screens/home/tabs/home_tab.dart
          git diff --cached --check
          git commit -m "feat(home): add floating create post action"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/apply-home-create-post-fab.yml
          git add .github/workflows/apply-home-create-post-fab.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary home fab workflow"
            git push
          fi
