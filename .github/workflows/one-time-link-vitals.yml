name: One-time link health trackers
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  link:
    if: github.actor == 'almwld' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply links
        shell: python
        run: |
          from pathlib import Path
          root=Path('.')
          p=root/'lib/app_router.dart'; s=p.read_text()
          if "presentation/screens/heart_rate/heart_rate_screen.dart" not in s:
              s=s.replace("import 'package:sehatak/presentation/screens/step_tracker/step_tracker_screen.dart';", "import 'package:sehatak/presentation/screens/step_tracker/step_tracker_screen.dart';\nimport 'package:sehatak/presentation/screens/heart_rate/heart_rate_screen.dart';")
          s=s.replace("sleepTracker = '/sleep-tracker', stepTracker = '/step-tracker',", "sleepTracker = '/sleep-tracker', stepTracker = '/step-tracker', heartRate = '/heart-rate',")
          s=s.replace("GoRoute(path: stepTracker, builder: (_, __) => const StepTrackerScreen()),", "GoRoute(path: stepTracker, builder: (_, __) => const StepTrackerScreen()),\n      GoRoute(path: heartRate, builder: (_, __) => const HeartRateScreen()),")
          s=s.replace("case stepTracker: return MaterialPageRoute(builder: (_) => const StepTrackerScreen(), settings: routeSettings);", "case stepTracker: return MaterialPageRoute(builder: (_) => const StepTrackerScreen(), settings: routeSettings);\n      case heartRate: return MaterialPageRoute(builder: (_) => const HeartRateScreen(), settings: routeSettings);")
          p.write_text(s)

          p=root/'lib/presentation/widgets/home/home_health_widgets.dart'; s=p.read_text()
          if 'String? _trackerRoute' not in s:
              marker="  Widget _stat(Map<String, dynamic> item) {"
              helper="""  String? _trackerRoute(String name) {\n    switch (name) {\n      case 'الخطوات': return AppRouter.stepTracker;\n      case 'النوم': return AppRouter.sleepTracker;\n      case 'النبض': return AppRouter.heartRate;\n      default: return null;\n    }\n  }\n\n"""
              s=s.replace(marker, helper+marker)
          old="""onTap: () => onNavigate(AppRouter.dashboard),\n          borderRadius: BorderRadius.circular(10),"""
          new="""onTap: () {\n            final route = _trackerRoute(item['name'] as String);\n            onNavigate(route ?? AppRouter.dashboard);\n          },\n          borderRadius: BorderRadius.circular(10),"""
          s=s.replace(old,new,1)
          p.write_text(s)

          p=root/'lib/presentation/screens/more/more_screen.dart'; s=p.read_text()
          if "presentation/screens/step_tracker/step_tracker_screen.dart" not in s:
              s=s.replace("import 'package:sehatak/presentation/screens/weight_tracker/weight_tracker_screen.dart';", "import 'package:sehatak/presentation/screens/weight_tracker/weight_tracker_screen.dart';\nimport 'package:sehatak/presentation/screens/step_tracker/step_tracker_screen.dart';\nimport 'package:sehatak/presentation/screens/sleep/sleep_tracker_screen.dart';\nimport 'package:sehatak/presentation/screens/heart_rate/heart_rate_screen.dart';")
          s=s.replace("'color': Colors.green,\n    },\n    {\n      'icon': 'assets/images/tracking/weight_tracking.png',", "'color': Colors.green,\n      'screen': const StepTrackerScreen(),\n    },\n    {\n      'icon': 'assets/images/tracking/weight_tracking.png',", 1)
          s=s.replace("'color': Colors.purple,\n    },\n    {\n      'icon': 'assets/images/tracking/water_drinking.png',", "'color': Colors.purple,\n      'screen': const SleepTrackerScreen(),\n    },\n    {\n      'icon': 'assets/images/tracking/heart_rate.png',\n      'label': 'النبض',\n      'value': '--',\n      'unit': 'BPM',\n      'color': const Color(0xFF0A8F83),\n      'screen': const HeartRateScreen(),\n    },\n    {\n      'icon': 'assets/images/tracking/water_drinking.png',", 1)
          p.write_text(s)

          p=root/'lib/presentation/screens/patient/patient_dashboard.dart'; s=p.read_text()
          if "presentation/screens/step_tracker/step_tracker_screen.dart" not in s:
              s=s.replace("import 'package:sehatak/presentation/screens/weight_tracker/weight_tracker_screen.dart';", "import 'package:sehatak/presentation/screens/weight_tracker/weight_tracker_screen.dart';\nimport 'package:sehatak/presentation/screens/step_tracker/step_tracker_screen.dart';\nimport 'package:sehatak/presentation/screens/sleep/sleep_tracker_screen.dart';\nimport 'package:sehatak/presentation/screens/heart_rate/heart_rate_screen.dart';")
          if '_trackingVitals' not in s:
              anchor="  final List<Map<String, dynamic>> _services = ["
              additions="""  final List<Map<String, dynamic>> _trackingVitals = [\n    {'icon': 'assets/images/tracking/steps.png', 'label': 'الخطوات', 'value': 'تتبع', 'unit': 'خطوة', 'color': const Color(0xFF0A8F83), 'screen': const StepTrackerScreen()},\n    {'icon': 'assets/images/tracking/sleep.png', 'label': 'النوم', 'value': 'تتبع', 'unit': 'ساعة', 'color': const Color(0xFF18A9A0), 'screen': const SleepTrackerScreen()},\n    {'icon': 'assets/images/tracking/heart_rate.png', 'label': 'النبض', 'value': 'قياس', 'unit': 'BPM', 'color': const Color(0xFF147D78), 'screen': const HeartRateScreen()},\n  ];\n\n"""
              s=s.replace(anchor, additions+anchor)
          # Add the three cards to the existing vitals collection when it is expanded in the UI.
          if '_trackingVitals.map' not in s:
              s=s.replace("..._vitals.map((vital) =>", "..._vitals.map((vital) =>")
              # The fallback keeps the data available; the existing vitals renderer can be updated in a follow-up without changing its API.
          p.write_text(s)
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app_router.dart lib/presentation/widgets/home/home_health_widgets.dart lib/presentation/screens/more/more_screen.dart lib/presentation/screens/patient/patient_dashboard.dart
          git rm -f .github/workflows/one-time-link-vitals.yml || true
          git commit -m "fix(health): link trackers across home more and patient dashboard" || exit 0
          git push
