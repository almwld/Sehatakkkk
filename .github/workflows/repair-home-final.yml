name: Repair Home Final
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'almwld' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair HomeTab source
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/presentation/screens/home/tabs/home_tab.dart')
          s = p.read_text(encoding='utf-8-sig')

          # Keep the established Home order: banner -> health stats -> quick services.
          s = s.replace(
              "SliverToBoxAdapter(child: _banner(state, dark)),\n                SliverToBoxAdapter(child: _quickServices(dark)),\n                SliverToBoxAdapter(child: _healthSummary(state, dark)),",
              "SliverToBoxAdapter(child: _banner(state, dark)),\n                SliverToBoxAdapter(child: _healthSummary(state, dark)),\n                SliverToBoxAdapter(child: _quickServices(dark)),",
              1,
          )

          start = s.find('  Widget _weather(bool dark)')
          end = s.find('  Widget _error(String text, bool dark)')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Home weather/community region not found')

          replacement = r'''  Widget _weather(bool dark) {
    return _section(
      title: 'الطقس اليوم',
      dark: dark,
      child: FutureBuilder<Map<String, dynamic>>(
        future: _weatherFuture,
        builder: (context, snapshot) {
          if (snapshot.connectionState == ConnectionState.waiting) {
            return const SizedBox(
              height: 96,
              child: Center(child: CircularProgressIndicator(strokeWidth: 2)),
            );
          }
          final data = snapshot.data ?? const <String, dynamic>{};
          final temp = data['temp']?.toString();
          final condition = data['condition']?.toString();
          if (temp == null || temp.isEmpty || condition == null || condition.isEmpty) {
            return _empty('تعذر الحصول على بيانات الطقس حالياً', dark);
          }
          return Padding(
            padding: const EdgeInsets.symmetric(horizontal: 16),
            child: Container(
              height: 96,
              padding: const EdgeInsets.symmetric(horizontal: 18),
              decoration: BoxDecoration(
                color: dark ? _darkCard : Colors.white,
                borderRadius: BorderRadius.circular(18),
              ),
              child: Row(
                children: [
                  const Icon(Icons.wb_sunny_outlined, color: AppColors.primary, size: 38),
                  const SizedBox(width: 14),
                  Expanded(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(
                          'صنعاء',
                          style: TextStyle(
                            fontSize: 13,
                            fontWeight: FontWeight.w900,
                            color: dark ? Colors.white : _text,
                          ),
                        ),
                        const SizedBox(height: 4),
                        Text(
                          condition,
                          style: TextStyle(
                            fontSize: 11,
                            color: dark ? Colors.white70 : _muted,
                          ),
                        ),
                      ],
                    ),
                  ),
                  Text(
                    '$temp°',
                    style: TextStyle(
                      fontSize: 28,
                      fontWeight: FontWeight.w900,
                      color: dark ? Colors.white : _text,
                    ),
                  ),
                ],
              ),
            ),
          );
        },
      ),
    );
  }

  Widget _community(List<dynamic> items, bool dark) {
    if (items.isEmpty) {
      return _section(
        title: 'المجتمع',
        dark: dark,
        child: _empty('لا توجد منشورات منشورة حالياً', dark),
      );
    }
    final posts = items.take(5).toList();
    return _section(
      title: 'المجتمع',
      dark: dark,
      child: Column(
        children: posts.map((raw) {
          final item = Map<String, dynamic>.from(raw as Map);
          final author = (item['authorName'] ?? item['userName'] ?? item['displayName'] ?? 'مستخدم').toString();
          final text = (item['content'] ?? item['text'] ?? item['body'] ?? '').toString();
          final image = (item['imageUrl'] ?? item['image'] ?? '').toString();
          return Container(
            margin: const EdgeInsets.fromLTRB(16, 0, 16, 10),
            padding: const EdgeInsets.all(12),
            decoration: BoxDecoration(
              color: dark ? _darkCard : Colors.white,
              borderRadius: BorderRadius.circular(16),
            ),
            child: Row(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                CircleAvatar(
                  radius: 20,
                  backgroundColor: AppColors.primary.withOpacity(.1),
                  child: const Icon(Icons.person_outline, color: AppColors.primary),
                ),
                const SizedBox(width: 10),
                Expanded(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        author,
                        style: TextStyle(
                          fontSize: 12,
                          fontWeight: FontWeight.w900,
                          color: dark ? Colors.white : _text,
                        ),
                      ),
                      if (text.isNotEmpty) ...[
                        const SizedBox(height: 5),
                        Text(
                          text,
                          maxLines: 4,
                          overflow: TextOverflow.ellipsis,
                          style: TextStyle(fontSize: 11, color: dark ? Colors.white70 : _muted),
                        ),
                      ],
                      if (image.isNotEmpty) ...[
                        const SizedBox(height: 8),
                        ClipRRect(
                          borderRadius: BorderRadius.circular(10),
                          child: AppImage(
                            imageUrl: image,
                            height: 110,
                            width: double.infinity,
                            fit: BoxFit.cover,
                          ),
                        ),
                      ],
                    ],
                  ),
                ),
              ],
            ),
          );
        }).toList(),
      ),
    );
  }

'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Format and verify HomeTab
        run: |
          dart format lib/presentation/screens/home/tabs/home_tab.dart
          flutter pub get
          flutter analyze lib/presentation/screens/home/tabs/home_tab.dart --no-fatal-infos --no-fatal-warnings
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/presentation/screens/home/tabs/home_tab.dart
          git commit -m 'fix(home): restore complete HomeTab syntax and order'
          git push origin HEAD:master
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/repair-home-final.yml
          git commit -m 'chore: remove one-time home repair workflow'
          git push origin HEAD:master
