name: Apply Auth Production Fixes

on:
  push:
    paths:
      - '.github/workflows/apply-auth-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: master

      - name: Patch AuthScreen and Splash
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          
          auth_path = Path('lib/presentation/screens/auth/auth_screen.dart')
          splash_path = Path('lib/presentation/screens/splash_screen.dart')
          auth = auth_path.read_text(encoding='utf-8')
          splash = splash_path.read_text(encoding='utf-8')
          
          # 1) Exact social icon sizing requested by the design.
          auth = auth.replace("containerSize: 48,\n                      iconSize: 34,\n                      padding: 6,", "containerSize: 40,\n                      iconSize: 34,\n                      padding: 3,")
          auth = auth.replace("containerSize: 40,\n                      iconSize: 24,\n                      padding: 7,", "containerSize: 32,\n                      iconSize: 24,\n                      padding: 4,")
          
          # 2) Time-aware welcome title/subtitle.
          old_title = """isSignUp\n                      ? 'إنشاء حساب جديد'\n                      : (_isFirstTimeUser\n                          ? 'أهلاً بك في منصة صحتك'\n                          : 'مرحباً بعودتك'),"""
          new_title = """isSignUp\n                      ? 'إنشاء حساب جديد'\n                      : _getGreetingTitle(),"""
          if old_title in auth:
              auth = auth.replace(old_title, new_title, 1)
          elif "isSignUp\n                      ? 'إنشاء حساب جديد'" not in auth:
              raise SystemExit('Auth title anchor not found')
          
          marker = "  void _showLoading() {"
          greeting_methods = r'''  String _getGreetingTitle() {
    final hour = DateTime.now().hour;
    if (hour >= 5 && hour < 12) return 'صباح الخير، مرحباً بعودتك';
    if (hour >= 12 && hour < 18) return 'مساء الخير، مرحباً بعودتك';
    if (hour >= 18 && hour < 24) return 'مساء الخير، مرحباً بعودتك';
    return 'ليلة هادئة، مرحباً بعودتك';
  }

  String _getGreetingSubtitle() {
    final hour = DateTime.now().hour;
    if (hour >= 5 && hour < 12) return 'صباحك صحة وعافية في منصة صحتك';
    if (hour >= 12 && hour < 18) return 'سجّل دخولك مجدداً إلى منصة صحتك';
    if (hour >= 18 && hour < 24) return 'سجّل دخولك مجدداً إلى منصة صحتك';
    return 'سجّل دخولك مجدداً إلى منصة صحتك';
  }

'''
          if "String _getGreetingTitle()" not in auth:
              if marker not in auth:
                  raise SystemExit('Loading marker not found')
              auth = auth.replace(marker, greeting_methods + marker, 1)
          
          # Insert subtitle immediately after the login welcome title Text widget.
          title_style_end = """                  ),\n                ),\n                const SizedBox(height: 8),"""
          if "_getGreetingSubtitle()" not in auth:
              # Fallback anchor based on the known title block.
              pattern = re.compile(r"(Text\(\s*isSignUp\s*\? 'إنشاء حساب جديد'\s*:\s*_getGreetingTitle\(\),.*?\n\s*\),\n\s*const SizedBox\(height: 8\),)", re.S)
              m = pattern.search(auth)
              if not m:
                  raise SystemExit('Greeting subtitle insertion anchor not found')
              block = m.group(1)
              replacement = block.replace("const SizedBox(height: 8),", "const SizedBox(height: 8),\n                if (!isSignUp)\n                  Text(\n                    _getGreetingSubtitle(),\n                    style: TextStyle(\n                      fontSize: 14,\n                      color: isDark ? Colors.white70 : Colors.grey[600],\n                      fontFamily: 'NotoSansArabicUI',\n                    ),\n                    textAlign: TextAlign.center,\n                  ),\n                const SizedBox(height: 12),", 1)
              auth = auth[:m.start(1)] + replacement + auth[m.end(1):]
          
          # 3) Replace Google flow with two explicit modes:
          #    signup: create Firestore profile, sign out, return to login.
          #    login: authenticate existing Google account and enter Home.
          start = auth.find('  Future<void> _loginWithGoogle() async {')
          end = auth.find('  Future<void> _login() async {')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Google/login function anchors not found')
          new_google = r'''  Future<void> _loginWithGoogle() async {
    if (_isLoading) return;
    setState(() => _isLoading = true);
    _showLoading();

    try {
      final google = GoogleSignIn();
      final GoogleSignInAccount? googleUser = await google.signIn();

      if (googleUser == null) {
        _hideLoading();
        if (mounted) setState(() => _isLoading = false);
        return;
      }

      final googleAuth = await googleUser.authentication;
      final credential = GoogleAuthProvider.credential(
        accessToken: googleAuth.accessToken,
        idToken: googleAuth.idToken,
      );

      final result = await FirebaseAuth.instance.signInWithCredential(credential);
      final user = result.user;
      if (user == null) throw Exception('تعذر الحصول على حساب Google');

      final userRef = FirebaseFirestore.instance.collection('users').doc(user.uid);
      final existing = await userRef.get();

      if (widget.isSignUp) {
        if (existing.exists) {
          await FirebaseAuth.instance.signOut();
          await google.signOut();
          _hideLoading();
          if (mounted) {
            setState(() => _isLoading = false);
            _showMessage('حساب Google هذا مسجل مسبقاً. سجّل الدخول من صفحة الدخول.', true);
            Navigator.pushReplacement(
              context,
              MaterialPageRoute(builder: (_) => const AuthScreen(isSignUp: false)),
            );
          }
          return;
        }

        await userRef.set({
          'uid': user.uid,
          'name': user.displayName ?? googleUser.displayName ?? 'مستخدم',
          'email': user.email ?? googleUser.email,
          'phone': user.phoneNumber ?? '',
          'role': 'user',
          'specialty': null,
          'licenseNumber': '',
          'experience': '',
          'isVerified': false,
          'verificationStatus': 'notSubmitted',
          'rating': 0.0,
          'reviewCount': 0,
          'isAvailable': true,
          'photoUrl': user.photoURL ?? googleUser.photoUrl ?? '',
          'provider': 'google',
          'createdAt': FieldValue.serverTimestamp(),
          'updatedAt': FieldValue.serverTimestamp(),
        });

        // إنشاء الحساب السريع ينتهي هنا؛ لا ندخل المستخدم مباشرة.
        // نُنهي جلسة Firebase الحالية حتى تكون الخطوة التالية تسجيل دخول Google فعلياً.
        await FirebaseAuth.instance.signOut();
        await google.signOut();
        final prefs = await SharedPreferences.getInstance();
        await prefs.setBool('remember_me', false);
        await prefs.setBool('is_logged_in', false);
        await prefs.remove('user_uid');

        _hideLoading();
        if (mounted) {
          setState(() => _isLoading = false);
          ToastService.showSuccess('تم إنشاء حساب Google بنجاح. اضغط Google في صفحة الدخول للمتابعة.');
          Navigator.pushReplacement(
            context,
            MaterialPageRoute(builder: (_) => const AuthScreen(isSignUp: false)),
          );
        }
        return;
      }

      await userRef.set({
        'uid': user.uid,
        'name': user.displayName ?? googleUser.displayName ?? 'مستخدم',
        'email': user.email ?? googleUser.email,
        'photoUrl': user.photoURL ?? googleUser.photoUrl ?? '',
        'provider': 'google',
        'updatedAt': FieldValue.serverTimestamp(),
      }, SetOptions(merge: true));

      final role = existing.data()?['role']?.toString() ?? 'user';
      final prefs = await SharedPreferences.getInstance();
      await prefs.setBool('remember_me', true);
      await prefs.setBool('is_logged_in', true);
      await prefs.setString('user_uid', user.uid);

      _hideLoading();
      if (mounted) setState(() => _isLoading = false);
      await _showSuccessAnimation();
      if (!mounted) return;

      if (role == 'admin' || role == 'superAdmin') {
        Navigator.pushReplacement(
          context,
          MaterialPageRoute(builder: (_) => const PlatformDashboard()),
        );
      } else {
        _navigateToHome();
      }
    } on FirebaseAuthException catch (e) {
      _hideLoading();
      if (mounted) setState(() => _isLoading = false);
      var message = 'حدث خطأ أثناء تسجيل الدخول عبر Google';
      if (e.code == 'account-exists-with-different-credential') {
        message = 'هذا البريد مرتبط بطريقة تسجيل دخول أخرى. استخدم طريقة التسجيل الأصلية.';
      } else if (e.code == 'invalid-credential') {
        message = 'بيانات اعتماد Google غير صالحة';
      } else if (e.code == 'network-request-failed') {
        message = 'تحقق من اتصال الإنترنت وحاول مرة أخرى';
      }
      _showMessage(message, true);
    } catch (e) {
      _hideLoading();
      if (mounted) setState(() => _isLoading = false);
      _showMessage('تعذر إكمال عملية Google: $e', true);
    }
  }

'''
          auth = auth[:start] + new_google + auth[end:]
          
          # 4) Make Remember Me persist the actual Firebase session identity.
          old_login_success = """      await prefs.setBool('remember_me', _rememberMe);\n\n      if (_rememberMe) {\n        await prefs.setBool('is_logged_in', true);\n        await prefs.setString(\n          'remember_email',\n          _emailController.text.trim(),\n        );\n      } else {\n        await prefs.setBool('is_logged_in', false);\n      }"""
          new_login_success = """      await prefs.setBool('remember_me', _rememberMe);\n\n      if (_rememberMe) {\n        await prefs.setBool('is_logged_in', true);\n        await prefs.setString('user_uid', FirebaseAuth.instance.currentUser?.uid ?? '');\n        await prefs.setString('remember_email', _emailController.text.trim());\n      } else {\n        await prefs.setBool('is_logged_in', false);\n        await prefs.remove('user_uid');\n        await prefs.remove('remember_email');\n      }"""
          if old_login_success in auth:
              auth = auth.replace(old_login_success, new_login_success, 1)
          else:
              raise SystemExit('Remember-me login anchor not found')
          
          # 5) Make biometric authentication explicit and persistent only for a real Firebase session.
          old_bio = """    if (authenticated) {\n      final user = FirebaseAuth.instance.currentUser;\n\n      if (user != null) {\n        await _showSuccessAnimation();\n\n        if (mounted) {\n          _navigateToHome();\n        }\n      } else {\n        _showMessage('يرجى تسجيل الدخول أولاً', true);\n      }"""
          new_bio = """    if (authenticated) {\n      final user = FirebaseAuth.instance.currentUser;\n\n      if (user != null) {\n        final prefs = await SharedPreferences.getInstance();\n        await prefs.setBool('remember_me', true);\n        await prefs.setBool('is_logged_in', true);\n        await prefs.setString('user_uid', user.uid);\n        await _showSuccessAnimation();\n\n        if (mounted) {\n          _navigateToHome();\n        }\n      } else {\n        _showMessage('لا توجد جلسة حساب محفوظة. سجّل الدخول مرة واحدة ثم فعّل الدخول بالبصمة.', true);\n      }"""
          if old_bio in auth:
              auth = auth.replace(old_bio, new_bio, 1)
          
          auth_path.write_text(auth, encoding='utf-8')
          
          # 6) Splash: remembered Firebase sessions go straight to Home without waiting 9s.
          old_status = """      final bool isUserLoggedIn = user != null && isLoggedInPrefs && user.uid == savedUid;"""
          new_status = """      final rememberMe = prefs.getBool('remember_me') ?? false;\n      final bool isUserLoggedIn = user != null && rememberMe && isLoggedInPrefs && user.uid == savedUid;"""
          if old_status in splash:
              splash = splash.replace(old_status, new_status, 1)
          else:
              raise SystemExit('Splash login status anchor not found')
          
          old_persist = """      if (user != null) {\n        await prefs.setBool('is_logged_in', true);\n        await prefs.setString('user_uid', user.uid);\n      } else {\n        await prefs.setBool('is_logged_in', false);\n      }"""
          new_persist = """      if (user != null && rememberMe) {\n        await prefs.setBool('is_logged_in', true);\n        await prefs.setString('user_uid', user.uid);\n      } else if (user != null && !rememberMe) {\n        await FirebaseAuth.instance.signOut();\n        await prefs.setBool('is_logged_in', false);\n        await prefs.remove('user_uid');\n      } else {\n        await prefs.setBool('is_logged_in', false);\n        await prefs.remove('user_uid');\n      }"""
          if old_persist in splash:
              splash = splash.replace(old_persist, new_persist, 1)
          else:
              raise SystemExit('Splash persistence anchor not found')
          
          old_delay = """      // ✅ الانتظار 9 ثواني كاملة لعرض شاشة البداية\n      await Future.delayed(const Duration(seconds: 9));\n\n      if (mounted) {\n        _navigateToNext();\n      }"""
          new_delay = """      // الجلسة المحفوظة لا تحتاج عرض Splash/Auth مرة أخرى.\n      if (_isLoggedIn) {\n        if (mounted) _navigateToNext();\n        return;\n      }\n\n      await Future.delayed(const Duration(seconds: 3));\n      if (mounted) _navigateToNext();"""
          if old_delay in splash:
              splash = splash.replace(old_delay, new_delay, 1)
          else:
              raise SystemExit('Splash delay anchor not found')
          
          splash_path.write_text(splash, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/screens/auth/auth_screen.dart lib/presentation/screens/splash_screen.dart
          if git diff --cached --quiet; then
            echo "No auth changes needed."
            exit 0
          fi
          git commit -m "fix(auth): complete Google, remember-me, biometric and splash flow"
          git push origin HEAD:master
