name: Apply Auth Production Fixes

on:
  push:
    paths:
      - '.github/workflows/apply-auth-production.yml'
      - 'scripts/apply_auth_production.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Apply auth migration
        run: python3 scripts/apply_auth_production.py

      - name: Commit auth migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/screens/auth/auth_screen.dart lib/presentation/screens/splash_screen.dart
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "fix(auth): complete Google, remember-me, biometric and splash flow"
          git push origin HEAD:master
