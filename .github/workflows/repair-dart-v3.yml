name: Repair Dart blockers v3

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire delivery services screen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          more = Path('lib/presentation/screens/more/more_screen.dart')
          s = more.read_text(encoding='utf-8')
          import_line = "import 'package:sehatak/presentation/screens/delivery/delivery_screen.dart';"
          if import_line not in s:
              s = s.replace(
                  "import 'package:sehatak/presentation/screens/pharmacy/pharmacy_screen.dart';",
                  "import 'package:sehatak/presentation/screens/pharmacy/pharmacy_screen.dart';\n" + import_line,
                  1,
              )
          old = "'icon': 'assets/images/services/delivery.png', 'title': 'خدمات التوصيل', 'subtitle': 'توصيل الأدوية للمنزل', 'screen': const PharmacyScreen()}"
          new = "'icon': 'assets/images/services/delivery.png', 'title': 'خدمات التوصيل', 'subtitle': 'توصيل الأدوية للمنزل', 'screen': const DeliveryScreen()}"
          if old in s:
              s = s.replace(old, new, 1)
          more.write_text(s, encoding='utf-8')

          workflow = Path('.github/workflows/repair-dart-v3.yml')
          workflow.unlink(missing_ok=True)
          PY

      - name: Commit delivery navigation fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/presentation/screens/more/more_screen.dart .github/workflows/repair-dart-v3.yml
          if git diff --cached --quiet; then
            echo 'No delivery navigation changes needed.'
          else
            git diff --cached --check
            git commit -m 'fix: wire delivery services screen'
            git push origin HEAD:master
          fi
