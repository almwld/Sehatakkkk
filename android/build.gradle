buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // blurhash 1.1.0 predates AGP 8's mandatory namespace property.
    // Set its namespace before Android variants are created, without upgrading
    // its web dependency and breaking this app's pinned Firebase 2.x stack.
    project.plugins.withId("com.android.library") {
        // Keep Android library resource linking compatible with dependencies using API 31+ attrs (for example android:attr/lStar).
        project.android.compileSdkVersion 36
        if (project.name == "blurhash") {
            project.android.namespace = "com.raincal.blurhash"
        } else if (project.name == "flutter_vibrate") {
            // flutter_vibrate 1.3.0 predates AGP 8 namespace/manifest rules.
            project.android.namespace = "com.example.flutter_vibrate"

            // AGP 8 rejects the legacy package attribute in library manifests.
            // Remove only this plugin's obsolete attribute before manifest processing.
            def vibrateManifest = project.file("src/main/AndroidManifest.xml")
            if (vibrateManifest.exists()) {
                def manifestText = vibrateManifest.getText("UTF-8")
                def patchedManifest = manifestText.replaceFirst(/\s+package=["']flutter\.plugins\.vibrate["']/, "")
                if (patchedManifest != manifestText) {
                    vibrateManifest.setText(patchedManifest, "UTF-8")
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
