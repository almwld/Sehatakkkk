buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    plugins.withId("com.android.library") {
        def androidExtension = extensions.findByName("android")
        if (androidExtension != null && androidExtension.namespace == null) {
            def manifestFile = file("src/main/AndroidManifest.xml")
            def manifestPackage = null

            if (manifestFile.exists()) {
                def manifest = new XmlParser().parse(manifestFile)
                manifestPackage = manifest.@package?.toString()
            }

            def legacyNamespace = manifestPackage
            if (!legacyNamespace && project.name == "blurhash") {
                legacyNamespace = "com.raincal.blurhash"
            }
            if (!legacyNamespace) {
                legacyNamespace = "com.sehatak.legacy.${project.name.replaceAll('[^A-Za-z0-9_]', '_')}"
            }

            androidExtension.namespace = legacyNamespace
        }
    }
}

rootProject.buildDir = '../build'

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
