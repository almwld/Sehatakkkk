buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // blurhash 1.1.0 predates AGP 8's mandatory namespace property.
    // Set its namespace before Android variants are created, without upgrading
    // its web dependency and breaking this app's pinned Firebase 2.x stack.
    project.plugins.withId("com.android.library") {
        if (project.name == "blurhash") {
            project.android.namespace = "com.raincal.blurhash"
        } else if (project.name == "flutter_vibrate") {
            // flutter_vibrate 1.3.0 also predates AGP 8 namespace requirements.
            project.android.namespace = "com.example.flutter_vibrate"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
