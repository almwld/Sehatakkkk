def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

// Release signing is external to source control.
// Debug builds must remain independent of release signing credentials.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def signingValue = { String propertyName, String envName ->
    def propertyValue = keystoreProperties.getProperty(propertyName)
    if (propertyValue != null && !propertyValue.trim().isEmpty()) return propertyValue.trim()
    def envValue = System.getenv(envName)
    return envValue != null && !envValue.trim().isEmpty() ? envValue.trim() : null
}

def releaseStoreFile = signingValue('storeFile', 'SEHATAK_KEYSTORE_FILE')
def releaseStorePassword = signingValue('storePassword', 'SEHATAK_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'SEHATAK_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'SEHATAK_KEY_PASSWORD')

def releaseSigningConfigured = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

def releaseKeystore = releaseSigningConfigured ? file(releaseStoreFile) : null
if (releaseSigningConfigured && (!releaseKeystore.exists() || !releaseKeystore.isFile())) {
    throw new GradleException("Release keystore not found: " + releaseKeystore.absolutePath)
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
apply plugin: 'com.google.gms.google-services'

android {
    namespace "com.sehatak.app"
    compileSdkVersion 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.sehatak.app"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            storeFile releaseKeystore
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
