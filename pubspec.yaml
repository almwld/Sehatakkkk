name: sehatak
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.0
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.7.0
  
  # UI & Animation
  carousel_slider: ^4.2.1
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.7
  lottie: ^2.6.0
  shimmer: ^3.0.0
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Navigation
  go_router: ^13.0.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Utils
  url_launcher: ^6.2.1
  image_picker: ^1.0.7
  audioplayers: ^5.2.1
  
  # Charts & Graphs
  fl_chart: ^0.68.0
  
  # Other
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0
  glass_kit: ^3.0.0
  liquid_pull_to_refresh: ^3.0.1
  timeline_tile: ^2.0.0
  font_awesome_flutter: ^10.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  # ✅ فقط Lottie و SVG (بدون صور PNG)
  assets:
    - assets/animation/sehatak_animation.json
    - assets/audio/splash_sound.mp3
    - assets/social/
    - assets/svg/
  
  fonts:
    - family: NotoSansArabicUI
      fonts:
        - asset: assets/fonts/NotoSansArabicUI-Regular.ttf
        - asset: assets/fonts/NotoSansArabicUI-Bold.ttf
          weight: 700
