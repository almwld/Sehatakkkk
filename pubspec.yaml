  permission_handler: ^11.0.1
  local_auth: ^2.1.8
  flutter_app_badger: ^1.5.0
  flutter_local_notifications: ^16.3.0
  workmanager: ^0.5.0
  flutter_background_service: ^5.0.5
  sensors_plus: ^5.0.0
  flutter_vibrate: ^1.3.0
  flutter_foreground_task: ^5.1.0

  # ============================================================
  # 📸 Media - الوسائط
  # ============================================================
  image_picker: ^1.0.7
  camera: ^0.10.5
  record: ^5.0.0
  flutter_sound: ^9.2.13
  audioplayers: ^5.2.1
  photo_view: ^0.14.0
  file_picker: ^6.1.1
  flutter_image_compress: ^2.0.0

  # ============================================================
  # 📊 Export - تصدير البيانات
  # ============================================================
  csv: ^5.0.0
  pdf: ^3.10.4
  printing: ^5.11.1

  # ============================================================
  # 🗺️ Maps & Location - الخرائط والموقع
  # ============================================================
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  flutter_map_marker_cluster: ^1.3.3

  # ============================================================
  # 🌐 WebView - عرض الويب
  # ============================================================
  webview_flutter: ^4.4.0

  # ============================================================
  # 📞 Real-time Communication - التواصل الفوري
  # ============================================================
  livekit_client: ^1.5.6
  flutter_webrtc: 0.9.47

  # ============================================================
  # 🔐 Security & Encryption - الأمن والتشفير
  # ============================================================
  pointycastle: ^3.7.3
  crypto: ^3.0.3
  dart_jsonwebtoken: ^2.4.0

  # ============================================================
  # 🤖 AI & Machine Learning - الذكاء الاصطناعي
  # ============================================================
  google_generative_ai: ^0.4.0
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.2

  # ============================================================
  # 📦 JSON & Code Generation - توليد الكود
  # ============================================================
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.6

  # ============================================================
  # 🍞 Toast & Messages - الإشعارات
  # ============================================================
  fluttertoast: ^8.2.4
  overlay_support: ^2.1.0
  bot_toast: ^4.1.3

  # ============================================================
  # ⚡ تحسين الأداء
  # ============================================================
  blurhash: ^1.1.0
  flutter_cache_manager: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

