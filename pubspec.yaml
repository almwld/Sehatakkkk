  lottie: ^3.1.3
  confetti: ^0.7.0
  flutter_staggered_grid_view: ^0.7.0
  pull_to_refresh: ^2.0.0
  flutter_slidable: ^3.0.1
  carousel_slider: ^5.0.0
  table_calendar: ^3.0.9
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0

  # ============================================================
  # 🧠 State Management - إدارة الحالة
  # ============================================================
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5
  provider: ^6.1.2
  get_it: ^7.6.7

  # ============================================================
  # 🗺️ Navigation - التنقل
  # ============================================================
  go_router: ^13.0.1

  # ============================================================
