name: sehatak
description: تطبيق صحي متكامل لتتبع النوم والخطوات ونبضات القلب
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # 📱 حساسات الهاتف
  sensors_plus: ^5.0.0
  
  # 💾 تخزين البيانات
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.9.0
  
  # 🎙️ تسجيل وتحليل الصوت
  record: ^5.0.0
  flutter_sound: ^9.2.13
  
  # ⏰ معالجة الخلفية
  workmanager: ^0.5.0
  flutter_local_notifications: ^16.3.0
  
  # 📊 تصدير البيانات
  share_plus: ^7.2.1
  csv: ^5.0.0
  pdf: ^3.10.4
  printing: ^5.11.0
  
  # 📈 الرسوم البيانية
  fl_chart: ^0.66.0
  intl: ^0.18.1
  
  # 🫀 قياس نبضات القلب
  camera: ^0.10.5
  permission_handler: ^11.0.1
  flutter_foreground_task: ^5.1.0
  
  # 🛠️ أدوات مساعدة
  device_info_plus: ^9.1.1
  connectivity_plus: ^5.0.2
  
  # 🎨 واجهة المستخدم
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  step_progress_indicator: ^1.0.2
  circular_countdown_timer: ^0.2.4
  animated_heart: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
