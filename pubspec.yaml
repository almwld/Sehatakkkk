name: sehatak
description: A comprehensive healthcare platform for Yemen
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter_svg: ^2.0.9
  video_player: ^2.8.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  iconsax: ^0.0.8
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.1.3
  confetti: ^0.7.0
  flutter_staggered_grid_view: ^0.7.0
  pull_to_refresh: ^2.0.0
  flutter_slidable: ^3.0.0
  flutter_animate: ^4.5.0
  carousel_slider: ^5.0.0
  table_calendar: ^3.0.9
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5
  provider: ^6.1.2
  get_it: ^7.6.7
  go_router: ^13.0.1
  firebase_core: ^2.25.4
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.0
  cloud_functions: ^4.6.5
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.15
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.9
  firebase_app_check: ^0.2.1
  google_sign_in: ^6.2.1
  http: ^1.2.0
  dio: ^5.4.0
  retrofit: ^4.0.3
  socket_io_client: ^2.0.3
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  hive_flutter: ^1.1.0
  intl: ^0.18.1
  timezone: ^0.9.4
  connectivity_plus: ^5.0.0
  url_launcher: ^6.2.3
  share_plus: ^7.2.1
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1
  permission_handler: ^11.1.0
  local_auth: ^2.1.8
  flutter_app_badger: ^1.5.0
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.5.2
  flutter_background_service: ^5.0.5
  sensors_plus: ^4.0.0
  flutter_vibrate: ^1.3.0
  image_picker: ^1.0.7
  camera: ^0.10.5
  record: ^5.0.0
  audioplayers: ^5.2.1
  photo_view: ^0.14.0
  file_picker: ^6.1.1
  flutter_image_compress: ^2.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  flutter_map_marker_cluster: ^1.3.3
  webview_flutter: ^4.4.0
  livekit_client: ^1.5.6
  flutter_webrtc: 0.9.47
  pointycastle: ^3.7.3
  crypto: ^3.0.3
  dart_jsonwebtoken: ^2.4.0
  google_generative_ai: ^0.4.0
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.2
  pdf: ^3.10.7
  printing: ^5.11.1
  json_serializable: ^6.7.0
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.6
  fluttertoast: ^8.2.4
  overlay_support: ^2.1.0
  bot_toast: ^4.1.3
  blurhash: ^1.1.0
  flutter_cache_manager: ^3.3.0
  flutter_staggered_animations: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/search/
    - assets/images/ui/
    - assets/animations/
    - assets/audio/
    - assets/fonts/
    - assets/icons/map_pins/clinic.svg
    - assets/icons/map_pins/hospital.svg
    - assets/icons/map_pins/laboratory.svg
    - assets/icons/map_pins/medical.svg
    - assets/icons/map_pins/pharmacy.svg
    - assets/icons/social/chat_modern.svg
    - assets/icons/social/discord.svg
    - assets/icons/social/facebook.svg
    - assets/icons/social/instagram.svg
    - assets/icons/social/linkedin.svg
    - assets/icons/social/twitter.svg
    - assets/icons/social/whatsapp.svg
    - assets/icons/social/x_twitter.svg
    - assets/images/services/
    - assets/images/tracking/
    - assets/images/chat/
    - assets/images/payment/
    - assets/images/wallets/
    - assets/images/social/
    - assets/images/icons/doctors/
    - assets/images/icons/search/
    - assets/images/icons/top_bar/
    - assets/images/childhealth.png
    - assets/images/pregnancy_follow_up.png
    - assets/images/sehatak_chat_wallpaper_auto.svg
    - assets/images/sehatak_chat_wallpaper_dark.svg
    - assets/images/sehatak_chat_wallpaper_dark_1080x2160.png
    - assets/images/sehatak_chat_wallpaper_light.svg
    - assets/images/sehatak_chat_wallpaper_light_1080x2160.png
    - assets/svg/
  fonts:
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/ElMessiri-Regular.ttf
        - asset: assets/fonts/ElMessiri-Medium.ttf
        - asset: assets/fonts/ElMessiri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ElMessiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/ElMessiri-VariableFont_wght.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoNaskhArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoNaskhArabic-VariableFont_wght.ttf

dependency_overrides:
  google_fonts: ^5.1.0
