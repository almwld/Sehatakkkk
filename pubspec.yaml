name: sehatak
description: A comprehensive healthcare platform for Yemen
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # ... باقي المكتبات ...

flutter:
  uses-material-design: true

  # ============================================================
  # 📁 Assets - مع جميع المجلدات الفرعية
  # ============================================================
  assets:
    - assets/icons/app_icon.png
    - assets/icons/consultations/
    - assets/icons/core/
    - assets/icons/lab/
    - assets/icons/mini_specialties/
    - assets/icons/navigation/
    - assets/icons/offers/
    - assets/icons/payment/
    - assets/icons/plans/
    - assets/icons/png_core/
    - assets/icons/png_specialties/
    - assets/icons/services/
    - assets/icons/social/
    - assets/icons/specialties/
    - assets/icons/svg/
    - assets/images/
    - assets/images/banners/      # ✅ المجلد المفقود
    - assets/images/medications/
    - assets/images/pharmacies/
    - assets/audio/
    - assets/animations/

  # ============================================================
  # 🔤 Fonts
  # ============================================================
  fonts:
    - family: NotoSansArabicUI
      fonts:
        - asset: assets/fonts/NotoSansArabicUI-Regular.ttf
        - asset: assets/fonts/NotoSansArabicUI-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansArabicUI-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabicUI-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSansArabicUI-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabicUI-Black.ttf
          weight: 900
