<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800">
  <defs>
    <pattern id="healthPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- ✅ قلب كبير -->
      <path d="M30,22 C30,16 24,12 18,16 C12,12 6,16 6,22 C6,30 18,38 18,38 C18,38 30,30 30,22Z" fill="#00796B" opacity="0.05"/>
      
      <!-- ✅ صليب طبي -->
      <rect x="42" y="12" width="4" height="14" rx="1" fill="#00796B" opacity="0.04"/>
      <rect x="38" y="16" width="12" height="4" rx="1" fill="#00796B" opacity="0.04"/>
      
      <!-- ✅ نجمة / زهرة -->
      <circle cx="10" cy="10" r="4" fill="#00796B" opacity="0.04"/>
      <circle cx="10" cy="10" r="8" fill="none" stroke="#00796B" stroke-width="0.5" opacity="0.03"/>
      <circle cx="10" cy="10" r="12" fill="none" stroke="#00796B" stroke-width="0.3" opacity="0.02"/>
      
      <!-- ✅ علامة طبية (رمز الصحة) -->
      <circle cx="50" cy="42" r="6" fill="#00796B" opacity="0.04"/>
      <path d="M50,38 L50,46 M46,42 L54,42" stroke="#00796B" stroke-width="1.5" opacity="0.04"/>
      
      <!-- ✅ موجة قلب (ECG) -->
      <path d="M8,46 L12,46 L14,42 L16,48 L18,44 L22,46 L28,46" stroke="#00796B" stroke-width="1" fill="none" opacity="0.03"/>
      
      <!-- ✅ نقاط صغيرة متناثرة -->
      <circle cx="18" cy="52" r="1.5" fill="#00796B" opacity="0.04"/>
      <circle cx="36" cy="8" r="1.5" fill="#00796B" opacity="0.04"/>
      <circle cx="52" cy="16" r="1.5" fill="#00796B" opacity="0.04"/>
      <circle cx="8" cy="36" r="1.5" fill="#00796B" opacity="0.04"/>
      <circle cx="44" cy="52" r="1.5" fill="#00796B" opacity="0.04"/>
      <circle cx="56" cy="30" r="1.5" fill="#00796B" opacity="0.04"/>
      
      <!-- ✅ خطوط أفقية رفيعة -->
      <line x1="0" y1="30" x2="60" y2="30" stroke="#00796B" stroke-width="0.3" opacity="0.02"/>
      <line x1="0" y1="15" x2="60" y2="15" stroke="#00796B" stroke-width="0.3" opacity="0.02"/>
      <line x1="0" y1="45" x2="60" y2="45" stroke="#00796B" stroke-width="0.3" opacity="0.02"/>
      
      <!-- ✅ مثلثات صغيرة -->
      <polygon points="24,6 28,10 20,10" fill="#00796B" opacity="0.02"/>
      <polygon points="52,54 56,58 48,58" fill="#00796B" opacity="0.02"/>
      
      <!-- ✅ زهور صغيرة -->
      <circle cx="36" cy="30" r="2" fill="#00796B" opacity="0.03"/>
      <circle cx="36" cy="26" r="1" fill="#00796B" opacity="0.03"/>
      <circle cx="36" cy="34" r="1" fill="#00796B" opacity="0.03"/>
      <circle cx="32" cy="30" r="1" fill="#00796B" opacity="0.03"/>
      <circle cx="40" cy="30" r="1" fill="#00796B" opacity="0.03"/>
      
      <!-- ✅ دوائر متحدة المركز -->
      <circle cx="18" cy="18" r="3" fill="none" stroke="#00796B" stroke-width="0.3" opacity="0.03"/>
      <circle cx="18" cy="18" r="6" fill="none" stroke="#00796B" stroke-width="0.3" opacity="0.02"/>
      
      <!-- ✅ مربعات صغيرة -->
      <rect x="46" y="8" width="4" height="4" rx="1" fill="#00796B" opacity="0.02"/>
      <rect x="2" y="50" width="4" height="4" rx="1" fill="#00796B" opacity="0.02"/>
      
      <!-- ✅ أشكال هلال -->
      <path d="M6,20 Q10,16 14,20 Q10,18 6,20Z" fill="#00796B" opacity="0.02"/>
      <path d="M54,36 Q56,32 58,36 Q56,34 54,36Z" fill="#00796B" opacity="0.02"/>
    </pattern>
    
    <!-- ✅ تدرج لوني متعدد -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="25%" stop-color="#F1F8E9"/>
      <stop offset="50%" stop-color="#E0F7FA"/>
      <stop offset="75%" stop-color="#F3E5F5"/>
      <stop offset="100%" stop-color="#E8F5E9"/>
    </linearGradient>
  </defs>
  
  <!-- ✅ خلفية متدرجة -->
  <rect width="400" height="800" fill="url(#bgGrad)"/>
  
  <!-- ✅ النقوش فوق الخلفية -->
  <rect width="400" height="800" fill="url(#healthPattern)"/>
  
  <!-- ✅ طبقة إضافية للنقوش الباهتة -->
  <rect width="400" height="800" fill="url(#healthPattern)" opacity="0.3"/>
</svg>
